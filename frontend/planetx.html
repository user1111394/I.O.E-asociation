<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet X Explorer — I.O.E Hub</title>
<script src="js/ioe-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #05050a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #worldCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(5,5,10,0.85), transparent);
  }
  header h1 {
    font-size: 1rem;
    background: linear-gradient(90deg,#a040d0,#ffd700);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .exit-btn {
    font-size: 0.75rem; font-weight: 700; color: #cbd5e0;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 12px; border-radius: 20px; cursor: pointer;
  }

  /* ── HUD: jumlah sumber daya terkumpul ── */
  .resource-hud {
    position: fixed; top: 54px; left: 14px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .resource-chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700;
    backdrop-filter: blur(4px);
  }

  /* ── Joystick virtual ── */
  .joystick-zone {
    position: fixed; bottom: 30px; left: 24px; z-index: 20;
    width: 110px; height: 110px;
    touch-action: none;
  }
  .joystick-base {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
  }
  .joystick-knob {
    position: absolute; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(0,194,255,0.4); border: 1px solid rgba(0,194,255,0.7);
    top: 32px; left: 32px;
    transition: top 0.05s, left 0.05s;
  }

  /* ── Tombol keluar/selesai explore ── */
  .finish-explore-btn {
    position: fixed; bottom: 34px; right: 24px; z-index: 20;
    padding: 12px 18px; border: none; border-radius: 14px;
    background: linear-gradient(90deg,#8020b0,#1a1a1a);
    color: #fff; font-weight: 800; font-size: 0.78rem; cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,194,255,0.3);
  }

  /* ── Tombol naik/turun UFO (khusus Planet X — gerak 3D bebas,
     bukan cuma di atas "tanah" seperti Bulan/Mars) ── */
  .vertical-controls {
    position: fixed; bottom: 110px; right: 24px; z-index: 20;
    display: flex; flex-direction: column; gap: 10px;
  }
  .vertical-btn {
    width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1); color: #fff; font-size: 1.3rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none;
  }
  .vertical-btn:active { background: rgba(0,194,255,0.35); }

  /* ── Depth indicator (mengganti fungsi "ada di kawah/tanah" karena
     tidak ada tanah di Planet X — pemain perlu tahu seberapa jauh dia
     dari titik masuk) ── */
  .depth-hud {
    position: fixed; top: 54px; right: 14px; z-index: 10;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700;
    backdrop-filter: blur(4px);
  }

  /* ── Overlay pickup notif ── */
  .pickup-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    z-index: 30; pointer-events: none;
    background: rgba(0,0,0,0.7); border: 1px solid rgba(255,210,63,0.5);
    padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; color: #ffd23f;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
  }
  .pickup-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ── Overlay hasil explore (setelah tombol selesai ditekan) ── */
  .result-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .result-overlay.show { display: flex; }
  .result-card {
    background: linear-gradient(160deg, #1a1f3a, #0a0a12);
    border: 1px solid rgba(123,92,255,0.4);
    border-radius: 16px; padding: 22px; max-width: 320px; width: 100%;
    text-align: center;
  }
  .result-card h2 { font-size: 1.1rem; margin-bottom: 10px; }
  .result-list { font-size: 0.85rem; margin-bottom: 18px; line-height: 1.8; }
  .result-btn {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: linear-gradient(90deg,#8020b0,#1a1a1a);
    color: #fff; font-weight: 800; cursor: pointer;
  }

  .loading-overlay {
    position: fixed; inset: 0; background: #05050a;
    display: flex; align-items: center; justify-content: center; z-index: 200;
    color: #718096; font-size: 0.85rem; text-align: center; padding: 24px; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">Memasuki anomali Planet X...</div>

<canvas id="worldCanvas"></canvas>

<header>
  <h1>🕳️ Planet X — Explore</h1>
  <button class="exit-btn" onclick="exitToHub()">✕ Keluar</button>
</header>

<div class="resource-hud">
  <div class="resource-chip">🕳️ Void Shard: <span id="hudCrystal">0</span></div>
  <div class="resource-chip">🟣 Dark Matter Essence: <span id="hudDust">0</span></div>
</div>

<div class="depth-hud">📏 Kedalaman: <span id="hudDepth">0</span>m</div>

<div class="joystick-zone" id="joystickZone">
  <div class="joystick-base"></div>
  <div class="joystick-knob" id="joystickKnob"></div>
</div>

<div class="vertical-controls">
  <div class="vertical-btn" id="btnUp">▲</div>
  <div class="vertical-btn" id="btnDown">▼</div>
</div>

<button class="finish-explore-btn" onclick="finishExplore()">✅ Selesai Explore</button>

<div class="pickup-toast" id="pickupToast"></div>

<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <h2>🎉 Eksplorasi Selesai!</h2>
    <div class="result-list" id="resultList"></div>
    <button class="result-btn" onclick="exitToHub()">Kembali ke Hub</button>
  </div>
</div>

<script>
  // ══════════════════════════════════════════
  // AUTH & API
  // ══════════════════════════════════════════
  function getCurrentMember() {
    const session = (typeof getIoeSession === 'function') ? getIoeSession() : null;
    if (!session || !session.memberId || !session.sessionToken) return null;
    return { memberId: session.memberId, sessionToken: session.sessionToken };
  }

  async function callTycoonApi(action, extra = {}) {
    const member = getCurrentMember();
    if (!member) throw new Error('Silakan login dulu');
    const res = await fetch('/api/tycoon', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, memberId: member.memberId, sessionToken: member.sessionToken, ...extra }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal memproses permintaan');
    return data;
  }

  function exitToHub() {
    // game.html adalah halaman daftar game (belum dibuat saat ini, akan
    // menyusul) yang jadi pintu masuk ke tycoon.html/craft.html/astro.html.
    window.location.href = 'game.html';
  }
  window.exitToHub = exitToHub;

  // ══════════════════════════════════════════
  // THREE.JS SETUP — pola & dispose SAMA PERSIS seperti tycoon.html
  // (lihat komentar disposeWorldView di sana untuk alasan lengkap kenapa
  // dispose ini wajib ada, terutama karena halaman ini rencananya juga
  // akan dibuka dari iframe/navigasi berulang di I.O.E Hub).
  // ══════════════════════════════════════════
  // ══════════════════════════════════════════
  // THREE.JS SETUP — pola & dispose SAMA PERSIS seperti tycoon.html/
  // mars.html (lihat komentar disposeWorldView di sana untuk alasan
  // lengkap kenapa dispose ini wajib ada).
  //
  // BEDA BESAR DARI BULAN/MARS: Planet X adalah anomali misterius, tidak
  // punya permukaan padat. X-Planet Explorer (kendaraan UFO/hovercraft,
  // sudah menunjukkan ini) bergerak BEBAS di 3 sumbu di dalam "lautan
  // awan" — bukan menyusuri tanah datar. Konsep tanah/kawah/gravitasi-ke-
  // bawah TIDAK berlaku di sini sama sekali; sebagai gantinya area
  // jelajah dibatasi bola raksasa (WORLD_RADIUS) ke segala arah.
  // ══════════════════════════════════════════
  let scene, camera, renderer;
  let sub; // ufo (X-Planet Explorer)
  let pickups = []; // { mesh, type, collected }
  let collectedCrystal = 0, collectedDust = 0;
  let disposed = false;

  const WORLD_RADIUS = 90; // radius bola pembatas area jelajah, ke segala arah (bukan cuma horizontal)
  const SUB_SPEED = 0.14;
  const SUB_TURN_SPEED = 0.04;
  const SUB_VERTICAL_SPEED = 0.1;
  const PICKUP_RADIUS = 2.2; // sedikit lebih besar dari Bulan/Mars — lebih sulit presisi karena gerak 3 dimensi

  function initScene() {
    scene = new THREE.Scene();
    // Warna ruang anomali Planet X: hitam-ungu gelap, misterius, khas
    // tema dark matter di seluruh dokumen konsep.
    scene.background = new THREE.Color(0x0a0510);
    // Fog dibuat lebih dekat & lebih pekat dibanding sebelumnya, supaya
    // terasa seperti "render distance" (batas pandang jelas, bukan
    // transisi halus jarak jauh) — cocok untuk suasana lautan awan tebal
    // Planet X yang penuh anomali/kabut misterius.
    scene.fog = new THREE.Fog(0x0a0510, 8, 55);

    const canvas = document.getElementById('worldCanvas');
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const ambient = new THREE.AmbientLight(0x6a3a8a, 0.5);
    scene.add(ambient);
    const sunLight = new THREE.DirectionalLight(0xd0a0ff, 0.7);
    sunLight.position.set(20, 30, 10);
    scene.add(sunLight);

    buildVoidAnomaly();
    buildUFO();
    scatterPickups();

    window.addEventListener('resize', onResize);
    setupJoystick();
    setupVerticalButtons();
    window.addEventListener('pagehide', disposeScene);
    window.addEventListener('beforeunload', disposeScene);

    document.getElementById('loadingOverlay').style.display = 'none';
    animate();
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // ── Ruang anomali Planet X: alih-alih "tanah" datar, dibuat beberapa
  //    lapisan bidang transparan bertekstur pita awan pada ketinggian
  //    berbeda, mengelilingi UFO — memberi referensi visual
  //    kedalaman/gerak tanpa perlu tanah sungguhan. Ditambah partikel
  //    ambient (bintik-bintik melayang) supaya gerak 3D terasa, bukan
  //    hampa kosong. ──
  function buildVoidAnomaly() {
    // ── Sesuai deskripsi dokumen: "glow ungu, aurora, bintang, melayang"
    //    — dibuat pita aurora ungu-emas mengambang (bukan pita awan
    //    biasa), dengan efek emissive supaya terasa
    //    menyala/misterius. ──
    const bandColors = [0x4a0080, 0xffd700, 0x8020b0, 0x2a0050, 0xa040d0];
    for (let i = 0; i < 5; i++) {
      const y = -60 + i * 30;
      const geo = new THREE.PlaneGeometry(WORLD_RADIUS * 3, WORLD_RADIUS * 3);
      const mat = new THREE.MeshBasicMaterial({
        color: bandColors[i % bandColors.length],
        transparent: true, opacity: 0.1, side: THREE.DoubleSide,
      });
      const band = new THREE.Mesh(geo, mat);
      band.rotation.x = -Math.PI / 2;
      band.position.y = y;
      scene.add(band);
    }

    // Bintang tersebar di sekitar (sesuai deskripsi "bintang, melayang") —
    // titik-titik terang kecil tersebar di volume, beda dari partikel
    // ambient biasa (lebih terang, lebih jarang, meniru bintang jauh).
    const starGeo = new THREE.BufferGeometry();
    const starCount = 300;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = Math.cbrt(Math.random()) * WORLD_RADIUS;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.cos(phi);
      starPositions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: true });
    scene.add(new THREE.Points(starGeo, starMat));

    // Partikel ambient — bintik kecil tersebar di seluruh volume bola
    // jelajah, memberi rasa kedalaman/gerak saat UFO bergerak
    // (mirip partikel debu di air laut sungguhan).
    const particleCount = 800;
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      // Sebar merata di dalam bola radius WORLD_RADIUS (bukan cuma
      // permukaan bola) memakai distribusi volumetrik sederhana.
      const r = Math.cbrt(Math.random()) * WORLD_RADIUS;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi);
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0xd0a0ff, size: 0.3, sizeAttenuation: true, transparent: true, opacity: 0.6 });
    scene.add(new THREE.Points(particleGeo, particleMat));
  }

  // X-Planet Explorer — bentuk UFO/hovercraft (piringan + kubah, beda dari
  // ujung bulat memakai capsule buatan dari cylinder+sphere, karena
  // CapsuleGeometry tidak tersedia di Three.js r128), sirip kemudi, dan
  // jendela kokpit kecil.
  function buildUFO() {
    const group = new THREE.Group();

    // Bentuk UFO: piringan lebar-pipih (CylinderGeometry radiusnya besar,
    // tingginya kecil) + kubah kokpit setengah bola di tengah atas.
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.7, roughness: 0.3 });
    const saucer = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.2, 0.5, 20), bodyMat);
    group.add(saucer);

    const domeMat = new THREE.MeshStandardMaterial({ color: 0x4a0080, metalness: 0.3, roughness: 0.1, emissive: 0x4a0080, emissiveIntensity: 0.4, transparent: true, opacity: 0.75 });
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), domeMat);
    dome.position.y = 0.25;
    group.add(dome);

    // Cincin lampu emas mengelilingi tepi piringan — aksen emas khas
    // tema Planet X, juga jadi penanda visual arah hadap yang jelas.
    const ringLightMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.6, metalness: 0.5, roughness: 0.2 });
    const ringLight = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.08, 8, 24), ringLightMat);
    ringLight.rotation.x = Math.PI / 2;
    group.add(ringLight);

    // Penanda arah depan — sedikit menonjol di depan, membantu pemain
    // tahu ke mana UFO menghadap meski bentuknya simetris bundar.
    const noseMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.8 });
    const noseMarker = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), noseMat);
    noseMarker.position.set(0, 0, 1.5);
    group.add(noseMarker);

    group.position.set(0, 0, 0);
    // FIX (UFO menghalangi pandangan first-person): kamera
    // ditempatkan PERSIS di posisi UFO (lihat updateCamera), jadi
    // badan besarnya akan selalu menembus/menghalangi layar dari dalam
    // kalau tetap terlihat. visible=false menyembunyikannya dari render
    // sepenuhnya — sama seperti kebanyakan game first-person yang tidak
    // menampilkan body kendaraan/karakter sendiri (cuma tangan/kokpit
    // kalau ada). Rotasi & posisi tetap dihitung normal (dipakai untuk
    // arah kamera & collision pickup), cuma tidak di-render ke layar.
    group.visible = false;
    scene.add(group);
    sub = group;
  }

  // Sebar Void Shard & Dark Matter Essence sebagai objek 3D mengambang bebas
  // di dalam volume bola jelajah (bukan di "permukaan" — tidak ada
  // permukaan di Planet X). Warna diredam mendekati warna ruang anomali
  // supaya tetap butuh diteliti untuk ditemukan (kamuflase, sama seperti
  // Bulan/Mars).
  function scatterPickups() {
    const gasMat = new THREE.MeshStandardMaterial({ color: 0x4a0080, emissive: 0x2a0050, emissiveIntensity: 0.3, metalness: 0.2, roughness: 0.3, transparent: true, opacity: 0.75 });
    const crystalMat = new THREE.MeshStandardMaterial({ color: 0x8a6020, emissive: 0xffd700, emissiveIntensity: 0.2, roughness: 0.4, metalness: 0.4 });

    const pickupCount = 26;
    for (let i = 0; i < pickupCount; i++) {
      // Posisi ACAK DI DALAM VOLUME BOLA (bukan cuma di bidang datar
      // seperti Bulan/Mars) — pakai distribusi volumetrik sama seperti
      // partikel ambient, supaya pickup tersebar natural di seluruh
      // ruang 3D yang bisa dijelajahi UFO.
      const r = (0.25 + seededPlanetXRandom(i * 3.3) * 0.65) * WORLD_RADIUS; // hindari terlalu dekat pusat & terlalu dekat batas terluar
      const theta = seededPlanetXRandom(i * 5.5) * Math.PI * 2;
      const phi = Math.acos(2 * seededPlanetXRandom(i * 7.7) - 1);
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.cos(phi);
      const z = r * Math.sin(phi) * Math.sin(theta);

      const isGas = i % 2 === 0;
      const mesh = isGas
        ? new THREE.Mesh(new THREE.SphereGeometry(0.4, 10, 8), gasMat)
        : new THREE.Mesh(new THREE.OctahedronGeometry(0.35, 1), crystalMat);
      mesh.position.set(x, y, z);
      scene.add(mesh);
      pickups.push({ mesh, type: isGas ? 'voidShard' : 'darkMatterEssence', collected: false });
    }
  }

  function seededPlanetXRandom(seed) {
    const x = Math.sin(seed * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  // ══════════════════════════════════════════
  // JOYSTICK VIRTUAL (kiri) — setir: kiri-kanan memutar UFO,
  // atas-bawah maju-mundur searah hadap. SAMA POLA seperti Bulan/Mars.
  // ══════════════════════════════════════════
  let joystickActive = false;
  let joystickDir = { x: 0, y: 0 };

  function setupJoystick() {
    const zone = document.getElementById('joystickZone');
    const knob = document.getElementById('joystickKnob');
    const maxDist = 32;

    function handleMove(clientX, clientY) {
      const rect = zone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = clientX - centerX, dy = clientY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }
      knob.style.left = `${32 + dx}px`;
      knob.style.top = `${32 + dy}px`;
      joystickDir.x = dx / maxDist;
      joystickDir.y = dy / maxDist;
    }

    function resetKnob() {
      knob.style.left = '32px';
      knob.style.top = '32px';
      joystickDir.x = 0;
      joystickDir.y = 0;
      joystickActive = false;
    }

    zone.addEventListener('touchstart', e => { joystickActive = true; handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    zone.addEventListener('touchmove', e => { if (joystickActive) handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    zone.addEventListener('touchend', resetKnob);
    zone.addEventListener('touchcancel', resetKnob);

    zone.addEventListener('mousedown', e => { joystickActive = true; handleMove(e.clientX, e.clientY); });
    window.addEventListener('mousemove', e => { if (joystickActive) handleMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', resetKnob);
  }

  // ══════════════════════════════════════════
  // TOMBOL NAIK/TURUN (kanan) — kontrol vertikal UFO, terpisah
  // dari joystick kiri (sesuai permintaan: "konsol bagian kiri dan
  // tombol naik-turun bagian kanan").
  // ══════════════════════════════════════════
  let verticalDir = 0; // -1 = turun, 0 = diam, 1 = naik

  function setupVerticalButtons() {
    const btnUp = document.getElementById('btnUp');
    const btnDown = document.getElementById('btnDown');

    function bindHoldButton(el, value) {
      const start = e => { verticalDir = value; e.preventDefault(); };
      const stop = () => { if (verticalDir === value) verticalDir = 0; };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', stop);
      el.addEventListener('touchcancel', stop);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', stop);
      el.addEventListener('mouseleave', stop);
    }
    bindHoldButton(btnUp, 1);
    bindHoldButton(btnDown, -1);
  }

  // ══════════════════════════════════════════
  // GAME LOOP — gerak UFO di 3D penuh, dibatasi bola WORLD_RADIUS
  // ke segala arah (bukan cuma radius horizontal seperti Bulan/Mars).
  // ══════════════════════════════════════════
  function updateSubPosition() {
    if (joystickDir.x !== 0) {
      sub.rotation.y -= joystickDir.x * SUB_TURN_SPEED;
    }

    let moveX = 0, moveY = 0, moveZ = 0;

    if (joystickDir.y !== 0) {
      const moveAmount = -joystickDir.y * SUB_SPEED;
      moveX = Math.sin(sub.rotation.y) * moveAmount;
      moveZ = Math.cos(sub.rotation.y) * moveAmount;
    }

    if (verticalDir !== 0) {
      moveY = verticalDir * SUB_VERTICAL_SPEED;
    }

    if (moveX !== 0 || moveY !== 0 || moveZ !== 0) {
      const nextX = sub.position.x + moveX;
      const nextY = sub.position.y + moveY;
      const nextZ = sub.position.z + moveZ;

      // Batas jelajah: BOLA radius WORLD_RADIUS dari titik pusat (0,0,0),
      // ke segala arah termasuk atas-bawah — bukan cuma radius horizontal
      // seperti di Bulan/Mars, karena tidak ada "tanah" sebagai batas
      // alami di sini.
      const nextDist = Math.sqrt(nextX * nextX + nextY * nextY + nextZ * nextZ);
      if (nextDist < WORLD_RADIUS - 3) {
        sub.position.set(nextX, nextY, nextZ);
      }
    }

    // Update HUD kedalaman: jarak dari titik pusat (0,0,0), dibulatkan.
    const depth = Math.round(Math.sqrt(sub.position.x ** 2 + sub.position.y ** 2 + sub.position.z ** 2));
    const depthEl = document.getElementById('hudDepth');
    if (depthEl) depthEl.textContent = depth;
  }

  // ── Kamera first-person: menempel di posisi UFO, menghadap
  //    sama persis arah hadapnya (sub.rotation.y). Sama pola dengan
  //    Bulan/Mars — first-person tidak butuh kontrol arah pandang
  //    terpisah karena "arah pandang" = "arah hadap kendaraan". ──
  const EYE_OFFSET = 0.3;

  // ── Efek BOBBING kamera (mengambang halus, khas UFO/hovercraft yang
  //    tidak pernah benar-benar diam — beda dari roll Saturn Flyer yang
  //    aktif cuma saat belok). Bobbing berjalan TERUS-MENERUS berdasarkan
  //    waktu (bukan input pemain), memberi kesan kendaraan "melayang",
  //    sesuai deskripsi dokumen "melayang" untuk X-Planet Explorer. ──
  let bobbingTime = 0;
  const BOBBING_AMPLITUDE = 0.08; // seberapa jauh naik-turun (unit dunia)
  const BOBBING_SPEED = 1.6; // kecepatan siklus naik-turun

  function updateCamera() {
    bobbingTime += 0.016; // asumsi ~60fps, cukup untuk efek visual (tidak perlu delta time presisi)
    const bobOffset = Math.sin(bobbingTime * BOBBING_SPEED) * BOBBING_AMPLITUDE;

    const eyeX = sub.position.x;
    const eyeY = sub.position.y + EYE_OFFSET + bobOffset;
    const eyeZ = sub.position.z;
    camera.position.set(eyeX, eyeY, eyeZ);

    const lookX = eyeX + Math.sin(sub.rotation.y);
    const lookZ = eyeZ + Math.cos(sub.rotation.y);
    camera.lookAt(lookX, eyeY, lookZ);
  }

  function checkPickupCollisions() {
    pickups.forEach(p => {
      if (p.collected) return;
      const dx = sub.position.x - p.mesh.position.x;
      const dy = sub.position.y - p.mesh.position.y;
      const dz = sub.position.z - p.mesh.position.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz); // jarak 3D penuh, bukan cuma horizontal (beda dari Bulan/Mars)
      if (dist < PICKUP_RADIUS) {
        p.collected = true;
        scene.remove(p.mesh);
        if (p.type === 'voidShard') collectedCrystal++;
        else collectedDust++;
        updateHud();
        showPickupToast(p.type);
      }
    });
  }

  function updateHud() {
    document.getElementById('hudCrystal').textContent = collectedCrystal;
    document.getElementById('hudDust').textContent = collectedDust;
  }

  let toastTimeout = null;
  function showPickupToast(type) {
    const toast = document.getElementById('pickupToast');
    toast.textContent = type === 'voidShard' ? '🕳️ +1 Void Shard' : '🟣 +1 Dark Matter Essence';
    toast.classList.add('show');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 900);
  }

  function animate() {
    if (disposed) return;
    requestAnimationFrame(animate);
    updateSubPosition();
    updateCamera();
    checkPickupCollisions();
    renderer.render(scene, camera);
  }

  // ══════════════════════════════════════════
  // SELESAI EXPLORE — panggil backend explore-planet (reward FINAL tetap
  // ditentukan server secara random, sama seperti Bulan/Mars).
  // ══════════════════════════════════════════
  async function finishExplore() {
    try {
      const data = await callTycoonApi('explore-planet', { planetId: 'planetx' });
      const rewardLabels = { voidShard: 'Void Shard', darkMatterEssence: 'Dark Matter Essence' };
      const rewardEmoji = { voidShard: '🕳️', darkMatterEssence: '🟣' };
      const listHtml = Object.entries(data.rewards)
        .map(([res, amt]) => `<div>${rewardEmoji[res] || '✨'} +${amt} ${rewardLabels[res] || res}</div>`)
        .join('');
      document.getElementById('resultList').innerHTML = listHtml;
      document.getElementById('resultOverlay').classList.add('show');
    } catch (err) {
      alert(`Gagal menyelesaikan eksplorasi: ${err.message}`);
    }
  }
  window.finishExplore = finishExplore;

  // ══════════════════════════════════════════
  // DISPOSE — sama persis pola tycoon.html/mars.html.
  // ══════════════════════════════════════════
  function disposeScene() {
    if (disposed || !renderer) return;
    disposed = true;
    scene.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(m => m.dispose());
      }
    });
    const glExt = renderer.getContext().getExtension('WEBGL_lose_context');
    if (glExt) glExt.loseContext();
    renderer.dispose();
  }

  // ══════════════════════════════════════════
  // INIT — pastikan sudah login sebelum boleh explore (butuh sesi untuk
  // panggil explore-planet nanti), baru inisialisasi scene 3D.
  // ══════════════════════════════════════════
  (async function init() {
    const member = getCurrentMember();
    if (!member) {
      document.getElementById('loadingOverlay').textContent = '⚠️ Silakan login dulu untuk explore.';
      return;
    }

    try {
      const data = await callTycoonApi('get-state');
      const progress = data.state.spaceProgram && data.state.spaceProgram['planetx'];
      const vehicleReady = progress && progress.vehicle;

      if (!vehicleReady) {
        const planetName = (data.planets && data.planets['planetx'] && data.planets['planetx'].name) || 'planetx';
        const vehicleName = (data.planets && data.planets['planetx'] && data.planets['planetx'].vehicle && data.planets['planetx'].vehicle.name) || 'kendaraan';
        document.getElementById('loadingOverlay').innerHTML =
          `🔒 Kamu belum punya ${vehicleName}.<br>Craft dulu di halaman Refinery & Craft sebelum explore ${planetName}.`;
        return;
      }
    } catch (err) {
      document.getElementById('loadingOverlay').textContent = `❌ Gagal memuat status: ${err.message}`;
      return;
    }

    initScene();
  })();
</script>
</body>
