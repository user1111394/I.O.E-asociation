<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0d1408;
    color: #e8f0e0;

  #worldCanvas {

  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;

    background: linear-gradient(180deg, rgba(13,20,8,0.85), transparent);
  }
  header h1 {
    font-size: 1rem;
    background: linear-gradient(90deg,#a8d878,#4a9d4a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .exit-btn {
    font-size: 0.75rem; font-weight: 700; color: #d8e8c8;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 12px; border-radius: 20px; cursor: pointer;
  }

  /* ── HUD: biome saat ini, Seed Coin, durability shovel ── */

    position: fixed; top: 54px; left: 14px; z-index: 10;

  }

    display: flex; align-items: center; gap: 6px;

  .status-chip.biome-chip { border-color: rgba(168,216,120,0.5); color: #c8e8a8; }
  .status-chip.durability-low { border-color: rgba(255,120,80,0.6); color: #ff9878; }

  /* ── Joystick virtual (pola sama persis astro.html) ── */

  /* ── Toast hasil gali ── */

  /* ── Overlay shovel rusak / upgrade ── */

<script>
// ══════════════════════════════════════════
// AUTH & API (pola sama persis astro.html)
// ══════════════════════════════════════════
function getCurrentMember() {
  const session = (typeof getIoeSession === 'function') ? getIoeSession() : null;
  if (!session || !session.memberId || !session.sessionToken) return null;
  return { memberId: session.memberId, sessionToken: session.sessionToken };
}

async function callTycoonApi(action, extra = {}) {
  const member = getCurrentMember();
  if (!member) throw new Error('Silakan login dulu');
  const res = await fetch('/api/tycoon', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, memberId: member.memberId, sessionToken: member.sessionToken, ...extra }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Gagal memproses permintaan');
  return data;
}

function exitToHub() {
  window.location.href = 'game.html';
}
function goToGarden() {
  window.location.href = 'garden.html';
}

// ══════════════════════════════════════════
// STATE GLOBAL DARI SERVER (diisi saat init)
// ══════════════════════════════════════════
let SERVER_STATE = null;   // { digSpots, shovelTier, shovelDurability, seedInventory }
let BIOMES = null;
let PLANTS = null;
let SHOVEL_TIERS = null;
let SHOVEL_UPGRADE_COST = null;
let WORLD_RADIUS_MIN = 15;
let WORLD_RADIUS_MAX = 260;
let seedCoins = 0;

// Layout dig spot HARUS identik dengan DIG_SPOT_LAYOUT di tycoon.js
// (5 bioma x 6 spot = 30, ID format "{biomeId}_{index}"), supaya posisi
// 3D yang di-generate di sini konsisten dipakai semua member. Posisi
// masing-masing spot DITURUNKAN dari ID lewat PRNG seeded (bukan dikirim
// server) — deterministik, jadi server cukup kirim ID + plantId + status
// diggableAt, tanpa perlu kirim/simpan koordinat 3D sama sekali.
function seededRandom(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

// Sudut tengah tiap bioma (derajat), dipakai untuk sebar dig spot di
// dalam sektor bioma masing-masing supaya tidak menumpuk di perbatasan.
function biomeAngleRange(biomeId) {
  const b = BIOMES[biomeId];
  return [b.angleStart, b.angleEnd];
}

// Hitung posisi dunia (x,z) untuk 1 dig spot ID, deterministik dari ID-nya.
// Kalau titik hasil kebetulan jatuh di dalam/dekat sungai, digeser tegak
// lurus menjauhi jalur sungai secukupnya supaya tidak muncul di tengah air.
function digSpotWorldPosition(spotId) {
  const [biomeId, idxStr] = spotId.split('_');
  const idx = Number(idxStr);
  const [angleStart, angleEnd] = biomeAngleRange(biomeId);

  // Sebar merata di sektor sudut bioma + sedikit variasi acak seeded,
  // dan jarak dari pusat bervariasi supaya tidak semua di 1 garis lingkaran.
  const seedBase = spotId.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const angleFrac = (idx + 0.5) / 6 + (seededRandom(seedBase * 3.1) - 0.5) * 0.15;
  const angleDeg = angleStart + angleFrac * (angleEnd - angleStart);
  const angleRad = (angleDeg * Math.PI) / 180;

  const distFrac = 0.25 + seededRandom(seedBase * 7.7) * 0.7; // sebar dari dekat pusat sampai mendekati tepi
  const dist = WORLD_RADIUS_MIN + distFrac * (WORLD_RADIUS_MAX - WORLD_RADIUS_MIN);

  let x = Math.cos(angleRad) * dist;
  let z = Math.sin(angleRad) * dist;

  // Cek jarak ke sungai di ruang lokal (localY = -z, sama seperti
  // getWorldSurfaceHeightAt). Kalau terlalu dekat, geser posisi menjauh
  // sepanjang garis radial (menjauhi/mendekati pusat) sampai aman —
  // lebih simpel daripada geser tegak lurus sungai karena tetap
  // mempertahankan dig spot di sektor bioma yang sama.
  const safeDist = RIVER_WIDTH / 2 + RIVER_BANK_WIDTH + 2;
  let safety = 0;
  while (distanceToRiver(x, -z) < safeDist && safety < 20) {
    const pushedDist = dist + (safety + 1) * 4;
    x = Math.cos(angleRad) * Math.min(pushedDist, WORLD_RADIUS_MAX - 4);
    z = Math.sin(angleRad) * Math.min(pushedDist, WORLD_RADIUS_MAX - 4);
    safety++;
  }

  return { x, z, angleDeg, dist: Math.sqrt(x * x + z * z) };
}

// Bioma mana yang sedang diinjak player, berdasarkan sudut posisinya
// dari pusat dunia (0,0). Sudut dinormalisasi ke 0-360.
function biomeAtPosition(x, z) {
  let angleDeg = (Math.atan2(z, x) * 180) / Math.PI;
  if (angleDeg < 0) angleDeg += 360;
  for (const [biomeId, b] of Object.entries(BIOMES)) {
    if (angleDeg >= b.angleStart && angleDeg < b.angleEnd) return biomeId;
  }
  return Object.keys(BIOMES)[0];
}

// ══════════════════════════════════════════
// THREE.JS SCENE
// ══════════════════════════════════════════
let scene, camera, renderer, disposed = false;
let player = { x: 0, z: 0, rotationY: 0, lookPitch: 0 };
const PLAYER_SPEED = 0.18;
const PLAYER_TURN_SPEED = 0.04;
const EYE_HEIGHT = 1.6;
const SWIPE_YAW_SENSITIVITY = 0.0045;   // radian per pixel horizontal swipe
const SWIPE_PITCH_SENSITIVITY = 0.0035; // radian per pixel vertical swipe
const MIN_PITCH = -0.9; // hampir lurus ke bawah (radian)
const MAX_PITCH = 0.9;  // hampir lurus ke atas (radian)
const DIG_INTERACT_RADIUS = 4.5; // jarak maksimal dari dig spot untuk bisa gali

let digSpotMeshes = {}; // { spotId: THREE.Mesh }
let nearestDiggableSpotId = null;

// Terrain per bioma: fungsi height sederhana (gelombang halus + noise
// kecil) — TIDAK sekompleks kawah Bulan karena Wild Harvest butuh
// permukaan alami yang bisa dijalani kaki, bukan medan berlubang tajam.
// Terrain per bioma: gelombang besar (bukit landai) + gundukan/cekungan
// seeded tetap (TERRAIN_MOUNDS) + noise kecil (tekstur tanah), DIKURANGI
// di sekitar jalur sungai supaya membentuk lembah/dasar sungai yang nyata
// (bukan cuma mesh air ngambang di atas tanah datar).
function getSurfaceHeightAt(localX, localY) {
  const dist = Math.sqrt(localX * localX + localY * localY);
  const rolling = Math.sin(localX * 0.02) * Math.cos(localY * 0.025) * 2.2;
  const noise = Math.sin(localX * 0.15 + localY * 0.1) * 0.25;
  const mounds = moundHeight(localX, localY);
  // Area dekat pusat (spawn) diratakan supaya start selalu datar & aman.
  const flattenSpawn = Math.min(1, Math.max(0, (dist - 8) / 12));

  let height = (rolling + noise + mounds) * flattenSpawn;

  // Lembah sungai: makin dekat ke jalur sungai, makin turun. Dasar
  // sungai (di dalam RIVER_WIDTH) diratakan ke satu level tetap
  // (-RIVER_DEPTH) supaya mesh air datar bisa pas menempel di situ;
  // tepian (RIVER_BANK_WIDTH) melandai halus dari tanah normal turun
  // ke dasar sungai.
  const riverDist = distanceToRiver(localX, localY);
  const halfWidth = RIVER_WIDTH / 2;
  if (riverDist < halfWidth) {
    height = -RIVER_DEPTH;
  } else if (riverDist < halfWidth + RIVER_BANK_WIDTH) {
    const t = (riverDist - halfWidth) / RIVER_BANK_WIDTH; // 0 di tepi sungai, 1 di tanah normal
    const smoothT = t * t * (3 - 2 * t); // smoothstep, transisi halus
    height = -RIVER_DEPTH + (height - -RIVER_DEPTH) * smoothT;
  }

  return height;
}
function getWorldSurfaceHeightAt(worldX, worldZ) {
  return getSurfaceHeightAt(worldX, -worldZ);
}

// ══════════════════════════════════════════
// TEKSTUR TANAH PER BIOMA — digambar di 1 canvas besar yang merepresen-
// tasikan top-down seluruh dunia (bukan diulang/tile seperti tekstur
// Bulan), supaya tiap bioma bisa punya motif berbeda sesuai temanya:
//  - meadow: bintik rumput hijau cerah + bunga kecil sesekali
//  - forest: bintik hijau tua rapat + serasah daun coklat
//  - coast: pasir dengan gradasi krem + kerikil
//  - snow: putih dengan kilau kebiruan + retakan es tipis
//  - highlands: coklat kemerahan vulkanik + retakan lava
// Motif digambar berdasarkan SUDUT posisi tiap pixel dari pusat canvas
// (sama seperti biomeColorAtAngle), dengan blend halus di perbatasan.
// ══════════════════════════════════════════
function biomeColorAtAngle(angleDeg) {
  // Blend warna 2 bioma terdekat di perbatasan sudut supaya transisi
  // antar zona tidak terlihat sebagai garis tegas (lebih terasa "alami").
  const entries = Object.values(BIOMES);
  for (const b of entries) {
    const mid = (b.angleStart + b.angleEnd) / 2;
    const halfWidth = (b.angleEnd - b.angleStart) / 2;
    const distFromMid = Math.abs(((angleDeg - mid + 540) % 360) - 180);
    if (distFromMid <= halfWidth) {
      const edgeFactor = Math.max(0, (halfWidth - distFromMid) / halfWidth);
      return { color: b.color, blend: edgeFactor };
    }
  }
  return { color: entries[0].color, blend: 1 };
}

function biomeBlendAtAngle(angleDeg) {
  const entries = Object.entries(BIOMES);
  for (const [biomeId, b] of entries) {
    const mid = (b.angleStart + b.angleEnd) / 2;
    const halfWidth = (b.angleEnd - b.angleStart) / 2;
    const distFromMid = Math.abs(((angleDeg - mid + 540) % 360) - 180);
    if (distFromMid <= halfWidth) {
      const edgeFactor = Math.max(0, Math.min(1, (halfWidth - distFromMid) / (halfWidth * 0.35)));
      return { biomeId, blend: edgeFactor };
    }
  }
  return { biomeId: entries[0][0], blend: 1 };
}

function drawBiomeMotif(ctx, biomeId, x, y, rand) {
  switch (biomeId) {
    case 'meadow': {
      const shade = 110 + rand() * 60;
      ctx.fillStyle = `rgba(${shade * 0.6},${shade},${shade * 0.5},0.5)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.02) { ctx.fillStyle = 'rgba(255,240,180,0.6)'; ctx.fillRect(x, y, 2, 2); } // bunga kecil sesekali
      break;
    }
    case 'forest': {
      const shade = 50 + rand() * 40;
      ctx.fillStyle = `rgba(${shade * 0.5},${shade},${shade * 0.5},0.55)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.04) { ctx.fillStyle = 'rgba(110,80,40,0.5)'; ctx.fillRect(x, y, 3, 3); } // serasah daun
      break;
    }
    case 'coast': {
      const shade = 190 + rand() * 40;
      ctx.fillStyle = `rgba(${shade},${shade * 0.92},${shade * 0.72},0.5)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.015) { ctx.fillStyle = 'rgba(140,140,140,0.4)'; ctx.fillRect(x, y, 2, 2); } // kerikil
      break;
    }
    case 'snow': {
      const shade = 225 + rand() * 25;
      ctx.fillStyle = `rgba(${shade},${shade},${shade + 6},0.5)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.01) { ctx.fillStyle = 'rgba(180,220,240,0.4)'; ctx.fillRect(x, y, 3, 1); } // retak es tipis
      break;
    }
    case 'highlands': {
      const shade = 90 + rand() * 45;
      ctx.fillStyle = `rgba(${shade},${shade * 0.55},${shade * 0.35},0.55)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.015) { ctx.fillStyle = 'rgba(200,70,30,0.35)'; ctx.fillRect(x, y, 2, 2); } // retak lava
      break;
    }
    default: {
      ctx.fillStyle = 'rgba(120,120,120,0.4)';
      ctx.fillRect(x, y, 2, 2);
    }
  }
}

function createWorldGroundTexture() {
  const canvasSize = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = canvasSize; canvas.height = canvasSize;
  const ctx = canvas.getContext('2d');

  // Warna dasar per-pixel dari biomeColorAtAngle (base fill), lalu
  // ditumpuk dengan motif titik-titik supaya tidak solid flat.
  const imgData = ctx.createImageData(canvasSize, canvasSize);
  const center = canvasSize / 2;
  for (let py = 0; py < canvasSize; py++) {
    for (let px = 0; px < canvasSize; px++) {
      const dx = px - center, dy = py - center;
      let angleDeg = (Math.atan2(dy, dx) * 180) / Math.PI;
      if (angleDeg < 0) angleDeg += 360;
      const { color } = biomeColorAtAngle(angleDeg);
      const c = new THREE.Color(color);
      const idx = (py * canvasSize + px) * 4;
      imgData.data[idx] = c.r * 255;
      imgData.data[idx + 1] = c.g * 255;
      imgData.data[idx + 2] = c.b * 255;
      imgData.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // Motif per bioma ditumpuk sebagai bintik-bintik acak SEEDED (bukan
  // Math.random) supaya tekstur konsisten tiap reload, digambar dengan
  // kepadatan tinggi (banyak titik kecil) langsung di posisi sudutnya.
  const dotCount = 90000;
  for (let i = 0; i < dotCount; i++) {
    const rSeed = i * 3.7;
    const angle = seededRandom(rSeed) * Math.PI * 2;
    const radiusFrac = Math.sqrt(seededRandom(rSeed * 1.3)); // sqrt supaya merata di area (bukan menumpuk di pusat)
    const px = center + Math.cos(angle) * radiusFrac * center;
    const py = center + Math.sin(angle) * radiusFrac * center;
    let angleDeg = (angle * 180) / Math.PI;
    if (angleDeg < 0) angleDeg += 360;
    const { biomeId } = biomeBlendAtAngle(angleDeg);
    let localSeed = rSeed * 7.1;
    const rand = () => { localSeed += 1; return seededRandom(localSeed); };
    drawBiomeMotif(ctx, biomeId, px, py, rand);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.ClampToEdgeWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  return texture;
}

function buildTerrain() {
  const size = WORLD_RADIUS_MAX * 2.15;
  const segments = 180;
  const geo = new THREE.PlaneGeometry(size, size, segments, segments);
  const pos = geo.attributes.position;

  // UV disesuaikan supaya texture (yang direpresentasikan sebagai
  // top-down seluruh dunia, radius dunia = tepi canvas) terpasang pas
  // menutupi seluruh ground, BUKAN di-tile berulang seperti tekstur
  // Bulan (karena tiap bioma harus tampil sekali di posisi sudutnya
  // yang benar, tidak masuk akal untuk diulang).
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, getSurfaceHeightAt(x, y));
    uv.setXY(i, (x / size) + 0.5, (y / size) + 0.5);
  }
  geo.attributes.uv.needsUpdate = true;
  geo.computeVertexNormals();

  const groundTexture = createWorldGroundTexture();
  const mat = new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 1 });
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
}

// ══════════════════════════════════════════
// SUNGAI — 1 jalur sungai melengkung memotong dunia dari satu sisi ke
// sisi lain (lewat dekat pusat), dipakai untuk (1) menurunkan tanah di
// sekitarnya jadi lembah sungai di getSurfaceHeightAt, dan (2) posisi
// mesh air datar semi-transparan di buildRiver(). Jalur berbentuk
// gelombang sinus lembut supaya tidak terlihat seperti garis lurus kaku.
// ══════════════════════════════════════════
const RIVER_WIDTH = 7;         // lebar sungai (unit dunia)
const RIVER_BANK_WIDTH = 6;    // lebar tepian yang melandai turun ke sungai
const RIVER_DEPTH = 1.8;       // seberapa dalam dasar sungai dari permukaan normal

// Posisi sungai di sumbu Z lokal untuk setiap X lokal (jalur sinus lembut,
// melintasi seluruh lebar dunia). Dipakai untuk hitung jarak tegak lurus
// titik manapun ke sungai.
function riverZAt(localX) {
  return Math.sin(localX * 0.012) * 40 + Math.cos(localX * 0.004) * 25;
}
// Jarak (approx) titik (localX, localY) ke jalur sungai — dihitung dengan
// membandingkan localY terhadap riverZAt(localX). Aproksimasi ini cukup
// akurat karena jalur sungai melengkung landai (tidak tajam).
function distanceToRiver(localX, localY) {
  const riverY = riverZAt(localX);
  return Math.abs(localY - riverY);
}

// Gundukan tanah: beberapa fungsi cekungan/tonjolan radial diseed tetap
// (posisi sama tiap sesi, sama seperti pola CRATERS di astro.html) untuk
// bikin permukaan terasa naik-turun alami, bukan cuma gelombang halus.
const TERRAIN_MOUNDS = [];
(function seedMounds() {
  for (let i = 0; i < 45; i++) {
    const angle = (i / 45) * Math.PI * 2 + i * 0.9;
    const dist = WORLD_RADIUS_MIN + (i % 9) * (WORLD_RADIUS_MAX - WORLD_RADIUS_MIN) / 9;
    TERRAIN_MOUNDS.push({
      localX: Math.cos(angle) * dist,
      localY: Math.sin(angle) * dist,
      radius: 10 + (i % 4) * 8,
      // Tinggi bisa positif (gundukan naik) atau negatif (cekungan) —
      // variasi bikin medan terasa berbukit, bukan cuma naik semua.
      height: (i % 3 === 0 ? -1 : 1) * (1.2 + (i % 5) * 0.6),
    });
  }
})();
function moundHeight(localX, localY) {
  let h = 0;
  for (const m of TERRAIN_MOUNDS) {
    const d = Math.sqrt((localX - m.localX) ** 2 + (localY - m.localY) ** 2);
    if (d < m.radius) {
      // Falloff halus (cosine) supaya tepi gundukan tidak terlihat patah.
      const t = d / m.radius;
      h += m.height * (0.5 + 0.5 * Math.cos(t * Math.PI));
    }
  }
  return h;
}

// Pepohonan/dekorasi sederhana tersebar acak (kosmetik saja, tidak
// mempengaruhi gameplay) supaya dunia tidak terasa kosong & datar.
// Dilewati kalau posisinya jatuh di dalam/dekat sungai (biar tidak
// tumbuh di tengah air).
function scatterDecorations() {
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 1 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3a7a3a, roughness: 0.9, flatShading: true });
  const decoCount = 160;
  for (let i = 0; i < decoCount; i++) {
    const seed = i * 4.4;
    const angle = seededRandom(seed) * Math.PI * 2;
    const dist = WORLD_RADIUS_MIN + seededRandom(seed * 1.7) * (WORLD_RADIUS_MAX - WORLD_RADIUS_MIN - 5);
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    // digSpotWorldPosition pakai (x,z) dunia, tapi height/sungai bekerja
    // di ruang lokal geometri (localY = -worldZ) — konsisten dengan
    // getWorldSurfaceHeightAt di bawah.
    if (distanceToRiver(x, -z) < RIVER_WIDTH / 2 + RIVER_BANK_WIDTH * 0.6) continue;

    const y = getWorldSurfaceHeightAt(x, z);
    // Skala diperbesar signifikan (trunk 1.4 -> 4.5 tinggi dasar) supaya
    // pohon terasa proporsional dengan skala dunia (radius 260) dan
    // tinggi mata pemain (EYE_HEIGHT 1.6) — sebelumnya terlalu pendek.
    const scale = 2.4 + seededRandom(seed * 2.3) * 2.2;
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * scale, 0.26 * scale, 4.5 * scale, 6), trunkMat);
    trunk.position.y = 2.25 * scale;
    group.add(trunk);
    const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(2.0 * scale, 0), leafMat);
    leaves.position.y = 4.8 * scale;
    group.add(leaves);
    group.position.set(x, y, z);
    scene.add(group);
  }
}

function buildSky() {
  scene.background = new THREE.Color(0x8fc9e8);
  scene.fog = new THREE.Fog(0x8fc9e8, 40, WORLD_RADIUS_MAX * 0.85);
}

// Mesh air sungai: strip mesh yang mengikuti jalur riverZAt(localX) di
// sepanjang lebar dunia, mengambang tipis di atas dasar sungai
// (-RIVER_DEPTH + sedikit) supaya terlihat sebagai air, bukan lubang
// kosong. Transparan + warna biru kehijauan supaya beda jelas dari
// tanah tapi tetap terasa "alami" (bukan biru terang buatan).
function buildRiver() {
  const segments = 200;
  const halfSize = WORLD_RADIUS_MAX * 1.1;
  const positions = [];
  const indices = [];
  const totalWidth = RIVER_WIDTH; // mesh selebar dasar sungai saja

  for (let i = 0; i <= segments; i++) {
    const localX = -halfSize + (i / segments) * halfSize * 2;
    const centerZ = riverZAt(localX);
    // 2 titik per segmen: tepi kiri & kanan sungai (tegak lurus arah X,
    // aproksimasi cukup baik karena jalur sungai melengkung landai).
    positions.push(localX, centerZ - totalWidth / 2, -RIVER_DEPTH + 0.05);
    positions.push(localX, centerZ + totalWidth / 2, -RIVER_DEPTH + 0.05);
  }
  for (let i = 0; i < segments; i++) {
    const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
    indices.push(a, c, b, b, c, d);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: 0x3d7a8c, transparent: true, opacity: 0.75,
    roughness: 0.3, metalness: 0.1,
  });
  const river = new THREE.Mesh(geo, mat);
  river.rotation.x = -Math.PI / 2;
  scene.add(river);
}

// Dig spot direpresentasikan sebagai gundukan tanah kecil dengan tanda
// tumbuhan liar di atasnya (kosmetik, bukan model tanaman spesifik —
// versi sederhana web, bukan .FBX custom seperti dokumen Unity asli).
function buildDigSpotMesh(spotId, plantTier) {
  const tierColors = { common: 0x8fbf6f, uncommon: 0x5fa8d8, rare: 0xb888e0, legendary: 0xe8b83f, mythic: 0xe85f8f };
  const group = new THREE.Group();

  const moundMat = new THREE.MeshStandardMaterial({ color: 0x6b5030, roughness: 1 });
  const mound = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2), moundMat);
  group.add(mound);

  const markerMat = new THREE.MeshStandardMaterial({
    color: tierColors[plantTier] || 0xffffff,
    emissive: tierColors[plantTier] || 0xffffff, emissiveIntensity: 0.3,
  });
  const marker = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.7, 6), markerMat);
  marker.position.y = 0.75;
  group.add(marker);

  return group;
}

function rebuildDigSpots() {
  // Hapus mesh lama dulu (dipanggil ulang tiap refresh state).
  for (const mesh of Object.values(digSpotMeshes)) scene.remove(mesh);
  digSpotMeshes = {};

  for (const [spotId, spot] of Object.entries(SERVER_STATE.digSpots)) {
    const isDiggable = spot.diggableAt === null || Date.now() >= spot.diggableAt;
    if (!isDiggable) continue; // sedang respawn, tidak ditampilkan

    const plant = PLANTS[spot.plantId];
    if (!plant) continue;
    const { x, z } = digSpotWorldPosition(spotId);
    const y = getWorldSurfaceHeightAt(x, z);

    const mesh = buildDigSpotMesh(spotId, plant.tier);
    mesh.position.set(x, y, z);
    mesh.userData = { spotId, plantId: spot.plantId };
    scene.add(mesh);
    digSpotMeshes[spotId] = mesh;
  }
}

// ══════════════════════════════════════════
// JOYSTICK VIRTUAL (pola sama persis astro.html)
// ══════════════════════════════════════════
let joystickActive = false;
let joystickDir = { x: 0, y: 0 };

function setupJoystick() {
  const zone = document.getElementById('joystickZone');
  const knob = document.getElementById('joystickKnob');
  const maxDist = 32;

  function handleMove(clientX, clientY) {
    const rect = zone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    let dx = clientX - centerX, dy = clientY - centerY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
    }
    knob.style.left = `${32 + dx}px`;
    knob.style.top = `${32 + dy}px`;
    joystickDir.x = dx / maxDist;
    joystickDir.y = dy / maxDist;
  }
  function resetKnob() {
    knob.style.left = '32px';
    knob.style.top = '32px';
    joystickDir.x = 0;
    joystickDir.y = 0;
    joystickActive = false;
  }

  zone.addEventListener('touchstart', e => { joystickActive = true; handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  zone.addEventListener('touchmove', e => { if (joystickActive) handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  zone.addEventListener('touchend', resetKnob);
  zone.addEventListener('touchcancel', resetKnob);

  zone.addEventListener('mousedown', e => { joystickActive = true; handleMove(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if (joystickActive) handleMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', resetKnob);
}

// ══════════════════════════════════════════
// PLAYER MOVEMENT — jalan kaki first-person, kontrol tank-style sama
// persis astro.html (kiri-kanan putar badan, atas-bawah maju-mundur
// searah hadap), TANPA entitas rover — player cuma titik posisi+rotasi
// yang jadi acuan langsung posisi kamera.
// ══════════════════════════════════════════
function updatePlayerPosition() {
  if (joystickDir.x !== 0) {
    player.rotationY -= joystickDir.x * PLAYER_TURN_SPEED;
  }
  if (joystickDir.y !== 0) {
    const moveAmount = -joystickDir.y * PLAYER_SPEED;
    const moveX = Math.sin(player.rotationY) * moveAmount;
    const moveZ = Math.cos(player.rotationY) * moveAmount;
    const nextX = player.x + moveX;
    const nextZ = player.z + moveZ;
    const nextDist = Math.sqrt(nextX * nextX + nextZ * nextZ);
    if (nextDist < WORLD_RADIUS_MAX - 3) {
      player.x = nextX;
      player.z = nextZ;
    }
  }
}

function updateCamera() {
  const groundY = getWorldSurfaceHeightAt(player.x, player.z);
  const eyeY = groundY + EYE_HEIGHT;
  camera.position.set(player.x, eyeY, player.z);
  // Arah pandang gabungan yaw (rotationY, sama dengan arah badan/jalan)
  // + pitch (lookPitch, murni tilt atas-bawah dari swipe vertikal,
  // TIDAK memengaruhi arah jalan sama sekali).
  const lookX = player.x + Math.sin(player.rotationY) * Math.cos(player.lookPitch);
  const lookZ = player.z + Math.cos(player.rotationY) * Math.cos(player.lookPitch);
  const lookY = eyeY + Math.sin(player.lookPitch);
  camera.lookAt(lookX, lookY, lookZ);
}

// ══════════════════════════════════════════
// SWIPE LOOK-AROUND — drag jari di layar (di luar area joystick kiri)
// untuk menoleh bebas. Sumbu X (horizontal swipe) memutar player.rotationY
// (jadi arah JALAN ikut berubah, sesuai keputusan), sumbu Y (vertical
// swipe) cuma mengubah lookPitch (murni kamera, tidak pengaruh arah jalan).
// ══════════════════════════════════════════
let swipeActive = false;
let lastSwipeX = 0, lastSwipeY = 0;

function isInsideJoystickZone(x, y) {
  const zone = document.getElementById('joystickZone');
  const rect = zone.getBoundingClientRect();
  // Beri sedikit margin toleransi supaya jari yang sedikit meleset dari
  // joystick tetap dianggap "pakai joystick", bukan swipe kamera.
  const margin = 20;
  return x >= rect.left - margin && x <= rect.right + margin &&
         y >= rect.top - margin && y <= rect.bottom + margin;
}

function setupSwipeLook() {
  const canvas = document.getElementById('worldCanvas');

  function onStart(x, y) {
    if (isInsideJoystickZone(x, y)) return; // biarkan joystick yang tangani
    swipeActive = true;
    lastSwipeX = x;
    lastSwipeY = y;
  }
  function onMove(x, y) {
    if (!swipeActive) return;
    const dx = x - lastSwipeX;
    const dy = y - lastSwipeY;
    lastSwipeX = x;
    lastSwipeY = y;

    player.rotationY -= dx * SWIPE_YAW_SENSITIVITY;
    // dy negatif = jari geser ke ATAS layar -> pandangan harus mendongak
    // ke atas (pitch naik), makanya dikurangi bukan ditambah.
    player.lookPitch = Math.max(MIN_PITCH, Math.min(MAX_PITCH, player.lookPitch - dy * SWIPE_PITCH_SENSITIVITY));
  }
  function onEnd() {
    swipeActive = false;
  }

  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    onStart(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    const t = e.touches[0];
    onMove(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', onEnd);
  canvas.addEventListener('touchcancel', onEnd);

  // Dukungan mouse juga (testing desktop / device dengan mouse).
  canvas.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);
}


// Cek dig spot terdekat yang masih dalam jangkauan gali, tampilkan/
// sembunyikan tombol Gali sesuai itu.
function updateNearestDigSpot() {
  let nearest = null;
  let nearestDist = Infinity;
  for (const [spotId, mesh] of Object.entries(digSpotMeshes)) {
    const dx = player.x - mesh.position.x;
    const dz = player.z - mesh.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < DIG_INTERACT_RADIUS && dist < nearestDist) {
      nearest = spotId;
      nearestDist = dist;
    }
  }
  nearestDiggableSpotId = nearest;
  const digBtn = document.getElementById('digBtn');
  digBtn.classList.toggle('visible', !!nearest);
}

function updateBiomeHud() {
  const biomeId = biomeAtPosition(player.x, player.z);
  const biome = BIOMES[biomeId];
  document.getElementById('hudBiome').textContent = `📍 ${biome.name}`;
}

function updateHud() {
  document.getElementById('hudSeedCoin').textContent = seedCoins;
  const tierData = SHOVEL_TIERS[SERVER_STATE.shovelTier];
  const durability = SERVER_STATE.shovelDurability;
  const durabilityChip = document.getElementById('hudDurability');
  const durabilityText = durability === Infinity ? '∞' : `${durability}/${tierData.maxDurability}`;
  durabilityChip.textContent = `⛏️ ${tierData.name}: ${durabilityText}`;
  const isLow = durability !== Infinity && durability <= tierData.maxDurability * 0.2;
  durabilityChip.classList.toggle('durability-low', isLow);
}

let toastTimeout = null;
function showDigToast(outcome, plantName, quantity) {
  const toast = document.getElementById('digToast');
  toast.className = 'dig-toast show ' + outcome;
  const labels = { perfect: '✨ Perfect!', good: '👍 Good', miss: '💨 Miss...' };
  toast.textContent = quantity > 0
    ? `${labels[outcome]} +${quantity} biji ${plantName}`
    : `${labels[outcome]} Tidak dapat apa-apa`;
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 1400);
}

// ══════════════════════════════════════════
// AKSI GALI — panggil server (hasil di-roll SERVER murni acak, bukan
// timing manual di klien). Kalau shovel durability habis, server akan
// menolak dengan error spesifik -> tampilkan overlay shovel.
// ══════════════════════════════════════════
async function performDig() {
  if (!nearestDiggableSpotId) return;
  const digBtn = document.getElementById('digBtn');
  digBtn.disabled = true;
  try {
    const data = await callTycoonApi('dig-spot', { spotId: nearestDiggableSpotId });
    SERVER_STATE = data.state;
    seedCoins = data.seedCoins !== undefined ? data.seedCoins : seedCoins;

    const plant = PLANTS[data.plantId];
    showDigToast(data.outcome, plant ? plant.name : data.plantId, data.quantity);

    updateHud();
    rebuildDigSpots();
    updateNearestDigSpot();

    if (data.shovelDurability === 0) {
      openShovelOverlay('rusak');
    }
  } catch (err) {
    if (/shovel/i.test(err.message) && /rusak|durability|cukup kuat/i.test(err.message)) {
      openShovelOverlay('rusak', err.message);
    } else {
      showDigToast('miss', '', 0);
    }
  } finally {
    digBtn.disabled = false;
  }
}
window.performDig = performDig;

// ══════════════════════════════════════════
// OVERLAY SHOVEL — rusak / upgrade
// ══════════════════════════════════════════
function openShovelOverlay(reason, customMsg) {
  const overlay = document.getElementById('shovelOverlay');
  const msg = document.getElementById('shovelCardMsg');
  if (customMsg) {
    msg.textContent = customMsg;
  } else {
    msg.textContent = 'Shovel kamu sudah habis durability-nya. Perbaiki atau upgrade dulu sebelum bisa menggali lagi.';
  }
  overlay.classList.add('show');
}
function closeShovelOverlay() {
  document.getElementById('shovelOverlay').classList.remove('show');
}
window.closeShovelOverlay = closeShovelOverlay;

async function doRepairShovel() {
  try {
    const data = await callTycoonApi('repair-shovel');
    SERVER_STATE = data.state;
    seedCoins = data.seedCoins;
    updateHud();
    closeShovelOverlay();
  } catch (err) {
    alert(err.message);
  }
}
window.doRepairShovel = doRepairShovel;

async function doUpgradeShovel() {
  try {
    const data = await callTycoonApi('upgrade-shovel');
    SERVER_STATE = data.state;
    seedCoins = data.seedCoins;
    updateHud();
    closeShovelOverlay();
  } catch (err) {
    alert(err.message);
  }
}
window.doUpgradeShovel = doUpgradeShovel;

// ══════════════════════════════════════════
// GAME LOOP
// ══════════════════════════════════════════
function animate() {
  if (disposed) return;
  requestAnimationFrame(animate);
  updatePlayerPosition();
  updateCamera();
  updateNearestDigSpot();
  updateBiomeHud();
  renderer.render(scene, camera);
}

function disposeScene() {
  if (disposed || !renderer) return;
  disposed = true;
  scene.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => m.dispose());
    }
  });
  const glExt = renderer.getContext().getExtension('WEBGL_lose_context');
  if (glExt) glExt.loseContext();
  renderer.dispose();
}
window.addEventListener('beforeunload', disposeScene);

function initScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, WORLD_RADIUS_MAX * 1.3);
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('worldCanvas'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  buildSky();
  const hemi = new THREE.HemisphereLight(0xffffff, 0x6b5030, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff4d8, 0.8);
  sun.position.set(60, 100, 40);
  scene.add(sun);

  buildTerrain();
  buildRiver();
  scatterDecorations();
  rebuildDigSpots();

  setupJoystick();
  setupSwipeLook();
  updateHud();
  updateBiomeHud();

  window.addEventListener('resize', () => {
    if (disposed) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById('loadingOverlay').style.display = 'none';
  animate();
}

// ══════════════════════════════════════════
// INIT — ambil state dari server dulu (biome data, dig spot, shovel,
// seed coin), baru render scene. Sama pola dengan astro.html.
// ══════════════════════════════════════════
(async function init() {
  const member = getCurrentMember();
  if (!member) {
    document.getElementById('loadingOverlay').textContent = '⚠️ Silakan login dulu untuk memasuki Wild Harvest.';
    return;
  }

  try {
    const data = await callTycoonApi('get-wildharvest-state');
    SERVER_STATE = data.state;
    BIOMES = data.biomes;
    PLANTS = data.plants;
    SHOVEL_TIERS = data.shovelTiers;
    SHOVEL_UPGRADE_COST = data.shovelUpgradeCost;
    WORLD_RADIUS_MIN = data.worldRadiusMin;
    WORLD_RADIUS_MAX = data.worldRadiusMax;
    seedCoins = data.seedCoins;
  } catch (err) {
    document.getElementById('loadingOverlay').textContent = `❌ Gagal memuat dunia: ${err.message}`;
    return;
  }

  initScene();
})();
</script>
