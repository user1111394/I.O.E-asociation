<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro Explorer — I.O.E Hub</title>
<script src="js/ioe-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #05050a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #worldCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(5,5,10,0.85), transparent);
  }
  header h1 {
    font-size: 1rem;
    background: linear-gradient(90deg,#a0aec0,#00c2ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .exit-btn {
    font-size: 0.75rem; font-weight: 700; color: #cbd5e0;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 12px; border-radius: 20px; cursor: pointer;
  }

  /* ── HUD: jumlah sumber daya terkumpul ── */
  .resource-hud {
    position: fixed; top: 54px; left: 14px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .resource-chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700;
    backdrop-filter: blur(4px);
  }

  /* ── Joystick virtual ── */
  .joystick-zone {
    position: fixed; bottom: 30px; left: 24px; z-index: 20;
    width: 110px; height: 110px;
    touch-action: none;
  }
  .joystick-base {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
  }
  .joystick-knob {
    position: absolute; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(0,194,255,0.4); border: 1px solid rgba(0,194,255,0.7);
    top: 32px; left: 32px;
    transition: top 0.05s, left 0.05s;
  }

  /* ── Tombol keluar/selesai explore ── */
  .finish-explore-btn {
    position: fixed; bottom: 34px; right: 24px; z-index: 20;
    padding: 12px 18px; border: none; border-radius: 14px;
    background: linear-gradient(90deg,#00c2ff,#7b5cff);
    color: #fff; font-weight: 800; font-size: 0.78rem; cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,194,255,0.3);
  }

  /* ── Overlay pickup notif ── */
  .pickup-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    z-index: 30; pointer-events: none;
    background: rgba(0,0,0,0.7); border: 1px solid rgba(255,210,63,0.5);
    padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; color: #ffd23f;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
  }
  .pickup-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ── Overlay hasil explore (setelah tombol selesai ditekan) ── */
  .result-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .result-overlay.show { display: flex; }
  .result-card {
    background: linear-gradient(160deg, #1a1f3a, #0a0a12);
    border: 1px solid rgba(123,92,255,0.4);
    border-radius: 16px; padding: 22px; max-width: 320px; width: 100%;
    text-align: center;
  }
  .result-card h2 { font-size: 1.1rem; margin-bottom: 10px; }
  .result-list { font-size: 0.85rem; margin-bottom: 18px; line-height: 1.8; }
  .result-btn {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: linear-gradient(90deg,#00c2ff,#7b5cff);
    color: #fff; font-weight: 800; cursor: pointer;
  }

  .loading-overlay {
    position: fixed; inset: 0; background: #05050a;
    display: flex; align-items: center; justify-content: center; z-index: 200;
    color: #718096; font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">Mendarat di Bulan...</div>

<canvas id="worldCanvas"></canvas>

<header>
  <h1>🌙 Bulan — Explore</h1>
  <button class="exit-btn" onclick="exitToHub()">✕ Keluar</button>
</header>

<div class="resource-hud">
  <div class="resource-chip">💠 Moon Crystal: <span id="hudCrystal">0</span></div>
  <div class="resource-chip">🌙 Lunar Dust: <span id="hudDust">0</span></div>
</div>

<div class="joystick-zone" id="joystickZone">
  <div class="joystick-base"></div>
  <div class="joystick-knob" id="joystickKnob"></div>
</div>

<button class="finish-explore-btn" onclick="finishExplore()">✅ Selesai Explore</button>

<div class="pickup-toast" id="pickupToast"></div>

<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <h2>🎉 Eksplorasi Selesai!</h2>
    <div class="result-list" id="resultList"></div>
    <button class="result-btn" onclick="exitToHub()">Kembali ke Hub</button>
  </div>
</div>

<script>
  // ══════════════════════════════════════════
  // AUTH & API
  // ══════════════════════════════════════════
  function getCurrentMember() {
    const session = (typeof getIoeSession === 'function') ? getIoeSession() : null;
    if (!session || !session.memberId || !session.sessionToken) return null;
    return { memberId: session.memberId, sessionToken: session.sessionToken };
  }

  async function callTycoonApi(action, extra = {}) {
    const member = getCurrentMember();
    if (!member) throw new Error('Silakan login dulu');
    const res = await fetch('/api/tycoon', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, memberId: member.memberId, sessionToken: member.sessionToken, ...extra }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal memproses permintaan');
    return data;
  }

  function exitToHub() {
    // game.html adalah halaman daftar game (belum dibuat saat ini, akan
    // menyusul) yang jadi pintu masuk ke tycoon.html/craft.html/astro.html.
    window.location.href = 'game.html';
  }
  window.exitToHub = exitToHub;

  // ══════════════════════════════════════════
  // THREE.JS SETUP — pola & dispose SAMA PERSIS seperti tycoon.html
  // (lihat komentar disposeWorldView di sana untuk alasan lengkap kenapa
  // dispose ini wajib ada, terutama karena halaman ini rencananya juga
  // akan dibuka dari iframe/navigasi berulang di I.O.E Hub).
  // ══════════════════════════════════════════
  let scene, camera, renderer;
  let rover, roverVelocity = { x: 0, z: 0 };
  let pickups = []; // { mesh, type, collected }
  let collectedCrystal = 0, collectedDust = 0;
  let disposed = false;

  const MAP_RADIUS = 45; // radius area permukaan Bulan yang bisa dijelajahi
  const ROVER_SPEED = 0.12;
  const PICKUP_RADIUS = 1.8; // jarak rover ke pickup supaya ke-collect

  function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05050a);
    scene.fog = new THREE.Fog(0x05050a, 25, 70);

    const canvas = document.getElementById('worldCanvas');
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 8, 10);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const ambient = new THREE.AmbientLight(0x8888aa, 0.6);
    scene.add(ambient);
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.1);
    sunLight.position.set(20, 30, 10);
    scene.add(sunLight);

    buildMoonSurface();
    buildStarfield();
    buildRover();
    scatterPickups();

    window.addEventListener('resize', onResize);
    setupJoystick();
    setupCameraDrag();
    window.addEventListener('pagehide', disposeScene);
    window.addEventListener('beforeunload', disposeScene);

    document.getElementById('loadingOverlay').style.display = 'none';
    animate();
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // Permukaan Bulan — abu-abu, bergelombang halus dengan kawah (bukan
  // datar polos), pakai PlaneGeometry dengan subdivisi asli (BUKAN
  // CircleGeometry — lihat catatan bug fatal soal ini di tycoon.html:
  // CircleGeometry cuma punya 1 vertex pusat + 1 cincin tepi, bikin
  // permukaan robek kalau diberi variasi tinggi).
  // Rumus tinggi permukaan Bulan pada koordinat (x, z) manapun — dipakai
  // BERSAMA oleh buildMoonSurface() (untuk bentuk geometri tanah) dan
  // updateRoverPosition() (untuk menempelkan rover ke permukaan). Sengaja
  // dipisah jadi 1 fungsi supaya kedua tempat itu SELALU sinkron — kalau
  // rumusnya beda/terpisah, rover akan salah tinggi dibanding tanah asli
  // (persis bug "mengambang di lubang" yang dilaporkan).
  function getSurfaceHeightAt(x, z) {
    let height = Math.sin(x * 0.15) * Math.cos(z * 0.12) * 0.4;
    height += craterHeight(x, z);
    return height;
  }

  function buildMoonSurface() {
    const size = MAP_RADIUS * 2.2;
    const segments = 80;
    const geo = new THREE.PlaneGeometry(size, size, segments, segments);
    const pos = geo.attributes.position;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      pos.setZ(i, getSurfaceHeightAt(x, y));
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({ color: 0x9a9a9e, roughness: 1, flatShading: true });
    const ground = new THREE.Mesh(geo, mat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
  }

  // Kawah dibuat dari beberapa fungsi cekungan radial yang diseed tetap
  // (posisi sama tiap sesi) supaya permukaan konsisten dan tidak berubah
  // tiap reload, memudahkan penempatan pickup supaya tidak nyangkut di
  // dalam kawah dalam.
  const CRATERS = [];
  (function seedCraters() {
    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2 + i * 0.7;
      const dist = 8 + (i % 4) * 8;
      CRATERS.push({
        x: Math.cos(angle) * dist,
        z: Math.sin(angle) * dist,
        radius: 2.5 + (i % 3) * 1.5,
        depth: 0.8 + (i % 3) * 0.4,
      });
    }
  })();
  function craterHeight(x, y) {
    let h = 0;
    for (const c of CRATERS) {
      const d = Math.sqrt((x - c.x) ** 2 + (y - c.z) ** 2);
      if (d < c.radius) {
        h -= c.depth * (1 - d / c.radius);
      }
    }
    return h;
  }

  function buildStarfield() {
    const starGeo = new THREE.BufferGeometry();
    const starCount = 600;
    const positions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 80 + Math.random() * 60;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.5; // separuh atas saja (langit)
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi) + 10;
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, sizeAttenuation: true });
    scene.add(new THREE.Points(starGeo, starMat));
  }

  // Lunar Rover — bentuk sederhana: chassis kotak + 4 roda + antena.
  function buildRover() {
    const group = new THREE.Group();

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, metalness: 0.3, roughness: 0.6 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2.2), bodyMat);
    body.position.y = 0.6;
    group.add(body);

    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
    const wheelPositions = [
      [-0.9, 0.35, 0.8], [0.9, 0.35, 0.8],
      [-0.9, 0.35, -0.8], [0.9, 0.35, -0.8],
    ];
    wheelPositions.forEach(([wx, wy, wz]) => {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.3, 12), wheelMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(wx, wy, wz);
      group.add(wheel);
    });

    const antennaMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.5 });
    const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.2, 6), antennaMat);
    antenna.position.set(0.4, 1.4, -0.6);
    group.add(antenna);

    group.position.set(0, 0, 0);
    scene.add(group);
    rover = group;
  }

  // Sebar Moon Crystal & Lunar Dust sebagai objek 3D di permukaan — jauh
  // dari titik start rover (radius > 4) supaya tidak langsung ke-collect
  // begitu scene dimuat, dan dalam radius map supaya semua bisa dijangkau.
  function scatterPickups() {
    const crystalMat = new THREE.MeshStandardMaterial({ color: 0x7b5cff, emissive: 0x7b5cff, emissiveIntensity: 0.5, metalness: 0.3, roughness: 0.2 });
    const dustMat = new THREE.MeshStandardMaterial({ color: 0xc9c9d8, emissive: 0x8888aa, emissiveIntensity: 0.25, roughness: 0.6 });

    for (let i = 0; i < 14; i++) {
      const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
      const dist = 6 + Math.random() * (MAP_RADIUS - 8);
      const x = Math.cos(angle) * dist, z = Math.sin(angle) * dist;

      const isCrystal = i % 2 === 0;
      const mesh = isCrystal
        ? new THREE.Mesh(new THREE.OctahedronGeometry(0.5), crystalMat)
        : new THREE.Mesh(new THREE.DodecahedronGeometry(0.4), dustMat);
      // Sama seperti rover, pickup mengikuti tinggi permukaan asli di
      // titik itu (bukan y tetap) — supaya tidak melayang/tenggelam kalau
      // kebetulan jatuh di dekat kawah.
      const surfaceY = getSurfaceHeightAt(x, z);
      mesh.position.set(x, surfaceY + 0.5, z);
      scene.add(mesh);
      pickups.push({ mesh, type: isCrystal ? 'moonCrystal' : 'lunarDust', collected: false });
    }
  }

  // ══════════════════════════════════════════
  // JOYSTICK VIRTUAL — kontrol gerak rover.
  // Sengaja pakai touch/pointer events manual (bukan library) supaya
  // ringan dan tidak menambah dependency untuk kontrol sederhana ini.
  // ══════════════════════════════════════════
  let joystickActive = false;
  let joystickDir = { x: 0, y: 0 }; // -1..1 masing-masing sumbu

  function setupJoystick() {
    const zone = document.getElementById('joystickZone');
    const knob = document.getElementById('joystickKnob');
    const maxDist = 32; // batas geser knob dari pusat (px)

    function handleMove(clientX, clientY) {
      const rect = zone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = clientX - centerX, dy = clientY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }
      knob.style.left = `${32 + dx}px`;
      knob.style.top = `${32 + dy}px`;
      joystickDir.x = dx / maxDist;
      joystickDir.y = dy / maxDist;
    }

    function resetKnob() {
      knob.style.left = '32px';
      knob.style.top = '32px';
      joystickDir.x = 0;
      joystickDir.y = 0;
      joystickActive = false;
    }

    zone.addEventListener('touchstart', e => { joystickActive = true; handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    zone.addEventListener('touchmove', e => { if (joystickActive) handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    zone.addEventListener('touchend', resetKnob);
    zone.addEventListener('touchcancel', resetKnob);

    // Dukungan mouse juga, untuk testing di desktop.
    zone.addEventListener('mousedown', e => { joystickActive = true; handleMove(e.clientX, e.clientY); });
    window.addEventListener('mousemove', e => { if (joystickActive) handleMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', resetKnob);
  }

  // ══════════════════════════════════════════
  // GAME LOOP
  // ══════════════════════════════════════════
  // Tinggi chassis rover di atas permukaan tanah tepat di bawahnya
  // (setengah tinggi body + jari-jari roda, supaya roda menyentuh tanah
  // bukan menembus/melayang).
  const ROVER_GROUND_OFFSET = 0.35;

  function updateRoverPosition() {
    if (joystickDir.x !== 0 || joystickDir.y !== 0) {
      // joystickDir.y negatif = dorong ke atas = maju (konvensi joystick umum)
      const moveX = joystickDir.x * ROVER_SPEED;
      const moveZ = joystickDir.y * ROVER_SPEED;

      const nextX = rover.position.x + moveX;
      const nextZ = rover.position.z + moveZ;

      // Batasi rover tetap di dalam radius map, supaya tidak jalan ke luar
      // area yang sudah dibuat (di luar situ tidak ada permukaan ter-render).
      const nextDist = Math.sqrt(nextX * nextX + nextZ * nextZ);
      if (nextDist < MAP_RADIUS - 2) {
        rover.position.x = nextX;
        rover.position.z = nextZ;
      }

      // Hadapkan rover ke arah gerak.
      rover.rotation.y = Math.atan2(moveX, moveZ);
    }

    // FIX (rover mengambang di kawah): sebelumnya rover.position.y TIDAK
    // PERNAH diupdate sama sekali (tetap di nilai awal), padahal permukaan
    // tanah punya variasi tinggi lewat getSurfaceHeightAt() (termasuk
    // cekungan kawah). Sekarang tinggi rover dihitung ULANG setiap frame
    // — bukan cuma saat bergerak — memakai rumus permukaan YANG SAMA PERSIS
    // dipakai untuk membuat geometri tanah, supaya rover selalu menempel
    // pas di permukaan asli, termasuk saat masuk/keluar kawah.
    const groundHeight = getSurfaceHeightAt(rover.position.x, rover.position.z);
    rover.position.y = groundHeight + ROVER_GROUND_OFFSET;
  }

  // ── Kamera: chase-cam dengan offset yang bisa diputar via swipe ──
  // FIX (kamera tidak bisa digeser): sebelumnya offset kamera FIXED
  // (0,6,8) dan update-nya ada DI DALAM blok "if joystick bergerak" —
  // jadi begitu rover diam, kamera benar-benar beku, tidak merespons
  // input apapun. Sekarang offset kamera punya SUDUT yang bisa diputar
  // bebas lewat swipe (cameraYaw), dan update kamera dipindah ke fungsi
  // sendiri yang dipanggil TIAP FRAME di animate() — terlepas dari rover
  // bergerak atau diam.
  let cameraYaw = 0; // radian, 0 = di belakang rover
  const CAMERA_DISTANCE = 8;
  const CAMERA_HEIGHT = 6;

  function updateCamera() {
    const offsetX = Math.sin(cameraYaw) * CAMERA_DISTANCE;
    const offsetZ = Math.cos(cameraYaw) * CAMERA_DISTANCE;
    const targetCamPos = new THREE.Vector3(
      rover.position.x + offsetX,
      rover.position.y + CAMERA_HEIGHT,
      rover.position.z + offsetZ
    );
    camera.position.lerp(targetCamPos, 0.08);
    camera.lookAt(rover.position.x, rover.position.y + 0.6, rover.position.z);
  }

  // Swipe/drag di layar (di luar area joystick) untuk memutar kamera
  // mengelilingi rover. joystick sendiri sudah stopPropagation lewat area
  // terpisah (#joystickZone), jadi listener di sini aman dipasang di
  // seluruh window tanpa bentrok dengan kontrol gerak.
  let cameraDragActive = false;
  let lastDragX = 0;

  function setupCameraDrag() {
    const joystickZone = document.getElementById('joystickZone');
    const finishBtn = document.querySelector('.finish-explore-btn');

    function isInsideExcludedZone(target) {
      return joystickZone.contains(target) || (finishBtn && finishBtn.contains(target));
    }

    window.addEventListener('touchstart', e => {
      if (isInsideExcludedZone(e.target)) return;
      cameraDragActive = true;
      lastDragX = e.touches[0].clientX;
    }, { passive: true });

    window.addEventListener('touchmove', e => {
      if (!cameraDragActive) return;
      const dx = e.touches[0].clientX - lastDragX;
      lastDragX = e.touches[0].clientX;
      cameraYaw -= dx * 0.005; // sensitivitas putar
    }, { passive: true });

    window.addEventListener('touchend', () => { cameraDragActive = false; });
    window.addEventListener('touchcancel', () => { cameraDragActive = false; });

    // Dukungan mouse untuk testing desktop.
    window.addEventListener('mousedown', e => {
      if (isInsideExcludedZone(e.target)) return;
      cameraDragActive = true;
      lastDragX = e.clientX;
    });
    window.addEventListener('mousemove', e => {
      if (!cameraDragActive) return;
      const dx = e.clientX - lastDragX;
      lastDragX = e.clientX;
      cameraYaw -= dx * 0.005;
    });
    window.addEventListener('mouseup', () => { cameraDragActive = false; });
  }

  function checkPickupCollisions() {
    pickups.forEach(p => {
      if (p.collected) return;
      const dx = rover.position.x - p.mesh.position.x;
      const dz = rover.position.z - p.mesh.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < PICKUP_RADIUS) {
        p.collected = true;
        scene.remove(p.mesh);
        if (p.type === 'moonCrystal') collectedCrystal++;
        else collectedDust++;
        updateHud();
        showPickupToast(p.type);
      }
    });
  }

  function updateHud() {
    document.getElementById('hudCrystal').textContent = collectedCrystal;
    document.getElementById('hudDust').textContent = collectedDust;
  }

  let toastTimeout = null;
  function showPickupToast(type) {
    const toast = document.getElementById('pickupToast');
    toast.textContent = type === 'moonCrystal' ? '💠 +1 Moon Crystal' : '🌙 +1 Lunar Dust';
    toast.classList.add('show');
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 900);
  }

  function animate() {
    if (disposed) return;
    requestAnimationFrame(animate);
    updateRoverPosition();
    updateCamera();
    checkPickupCollisions();
    renderer.render(scene, camera);
  }

  // ══════════════════════════════════════════
  // SELESAI EXPLORE — panggil backend explore-planet (reward FINAL tetap
  // ditentukan server secara random, lihat catatan di komentar atas file
  // ini). Jumlah pickup yang dikumpulkan di map ditampilkan sebagai
  // ringkasan pengalaman bermain, TAPI bukan angka yang dikirim/dipercaya
  // sebagai reward — reward asli datang dari response server.
  // ══════════════════════════════════════════
  async function finishExplore() {
    try {
      const data = await callTycoonApi('explore-planet', { planetId: 'moon' });
      const rewardLabels = { moonCrystal: 'Moon Crystal', lunarDust: 'Lunar Dust' };
      const rewardEmoji = { moonCrystal: '💠', lunarDust: '🌙' };
      const listHtml = Object.entries(data.rewards)
        .map(([res, amt]) => `<div>${rewardEmoji[res] || '✨'} +${amt} ${rewardLabels[res] || res}</div>`)
        .join('');
      document.getElementById('resultList').innerHTML = listHtml;
      document.getElementById('resultOverlay').classList.add('show');
    } catch (err) {
      alert(`Gagal menyelesaikan eksplorasi: ${err.message}`);
    }
  }
  window.finishExplore = finishExplore;

  // ══════════════════════════════════════════
  // DISPOSE — sama persis pola tycoon.html, lihat komentar lengkap di sana.
  // ══════════════════════════════════════════
  function disposeScene() {
    if (disposed || !renderer) return;
    disposed = true;
    scene.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(m => m.dispose());
      }
    });
    const glExt = renderer.getContext().getExtension('WEBGL_lose_context');
    if (glExt) glExt.loseContext();
    renderer.dispose();
  }

  // ══════════════════════════════════════════
  // INIT — pastikan sudah login sebelum boleh explore (butuh sesi untuk
  // panggil explore-planet nanti), baru inisialisasi scene 3D.
  // ══════════════════════════════════════════
  (function init() {
    const member = getCurrentMember();
    if (!member) {
      document.getElementById('loadingOverlay').textContent = '⚠️ Silakan login dulu untuk explore.';
      return;
    }
    initScene();
  })();
</script>
</body>
