<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pojok Baca — I.O.E Hub</title>
<style>
  :root {
    --bg: #05050d;
    --card: #0f0f1e;
    --border: rgba(255,255,255,0.1);
    --text: #e8e8f0;
    --text-muted: #8a8aa0;
    --primary: #7bc5ff;
    --primary2: #7b5cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif; min-height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: rgba(5,5,13,0.92); backdrop-filter: blur(10px); z-index: 10;
  }
  .topbar-title { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
  .topbar a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }

  .center-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 80vh; text-align: center; padding: 24px;
  }
  .center-screen .icon { font-size: 3rem; margin-bottom: 14px; }
  .center-screen h2 { margin: 0 0 8px; font-size: 1.2rem; }
  .center-screen p { color: var(--text-muted); font-size: 0.9rem; max-width: 320px; line-height: 1.6; margin: 0; }
  .spinner {
    width: 28px; height: 28px; border: 3px solid rgba(123,197,255,0.2); border-top-color: var(--primary);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Layar "belum punya izin" */
  .not-allowed .icon { filter: grayscale(1); opacity: 0.6; }

  /* ===== Rak cerita: kartu cover potret berjajar 3, judul di bar kecil di bawah tiap cover ===== */
  .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 12px; padding: 20px 16px 32px; }
  @media (min-width: 640px) { .shelf { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); max-width: 860px; margin: 0 auto; } }
  .story-card { display: block; width: 100%; padding: 0; background: none; border: none; color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
  .story-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 10px; }
  .story-card .cover-box { aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--card); transition: border-color 0.15s; }
  .story-card:active .cover-box { border-color: var(--primary); }
  .story-card img.cover { width: 100%; height: 100%; object-fit: cover; display: block; }
  .story-card .cover-placeholder, .detail-cover-placeholder {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2rem;
    background: linear-gradient(135deg, rgba(123,197,255,0.15), rgba(123,92,255,0.15));
  }
  .story-card .title-bar {
    margin-top: 8px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card);
    font-size: 0.75rem; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shelf-empty { padding: 60px 24px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

  /* ===== Detail cerita: cover kiri + sinopsis kanan, garis, lalu daftar bab ===== */
  .detail-wrap { max-width: 680px; margin: 0 auto; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px; color: var(--primary); font-size: 0.85rem;
    cursor: pointer; background: none; border: none; padding: 14px 18px 0; font-family: inherit;
  }
  .detail-head { display: flex; gap: 16px; padding: 16px 18px 20px; align-items: flex-start; border-bottom: 1px solid var(--border); }
  .detail-cover { flex: 0 0 34%; max-width: 160px; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--card); }
  .detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-info { flex: 1; min-width: 0; }
  .detail-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 4px; overflow-wrap: anywhere; line-height: 1.3; }
  .detail-meta { color: var(--text-muted); font-size: 0.78rem; margin-bottom: 12px; }
  .detail-info h4 { margin: 0 0 6px; font-size: 0.85rem; color: var(--primary); }
  .synopsis { font-size: 0.88rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .synopsis.empty { color: var(--text-muted); font-style: italic; }

  .chapter-list { padding: 12px 16px 32px; }
  .chapter-item {
    display: flex; align-items: center; justify-content: space-between; width: 100%; font: inherit; color: inherit; text-align: left;
    padding: 16px 14px; margin: 10px 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; cursor: pointer; transition: border-color 0.15s;
  }
  .chapter-item:active { border-color: var(--primary); }
  .chapter-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .chapter-item .ch-title { font-size: 0.9rem; font-weight: 600; overflow-wrap: anywhere; }
  .chapter-item .ch-arrow { color: var(--text-muted); margin-left: 10px; }

  /* ===== Tampilan baca satu bab ===== */
  .reader { padding: 0 18px 60px; max-width: 680px; margin: 0 auto; }
  .reader .back-link { padding: 14px 0 0; margin-bottom: 18px; }
  .reader h3 { font-size: 1.15rem; margin: 0 0 20px; overflow-wrap: anywhere; }
  .reader-content { font-size: 1rem; line-height: 1.9; color: var(--text); white-space: pre-wrap; word-wrap: break-word; }
  .reader-nav { display: flex; gap: 10px; margin-top: 32px; }
  .reader-nav button {
    flex: 1; padding: 12px; font: inherit; font-size: 0.85rem; font-weight: 600; color: var(--primary);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
  }
  .reader-nav button:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">📖 Pojok Baca</div>
  <a href="index.html">← Kembali ke Hub</a>
</div>

<!-- Layar loading awal (saat verifikasi login & izin) -->
<div id="loading-screen" class="center-screen">
  <div class="spinner"></div>
  <p>Memeriksa akses...</p>
</div>

<!-- Layar belum punya izin -->
<div id="not-allowed-screen" class="center-screen not-allowed" style="display:none;">
  <div class="icon">🔒</div>
  <h2>Belum Punya Izin</h2>
  <p>Pojok Baca ini hanya bisa dibuka oleh member yang sudah diberi izin oleh admin. Kalau kamu merasa ini keliru, hubungi admin I.O.E.</p>
</div>

<!-- Layar error teknis (bukan soal izin, tapi server/koneksi) -->
<div id="error-screen" class="center-screen" style="display:none;">
  <div class="icon">⚠️</div>
  <h2>Gagal Memuat</h2>
  <p id="error-message">Terjadi kesalahan. Coba muat ulang halaman.</p>
</div>

<!-- Konten utama: 3 tampilan (rak -> detail cerita -> baca bab), satu aktif pada satu waktu -->
<div id="main-content" style="display:none;">
  <div id="shelf-view" style="display:none;">
    <div id="shelf" class="shelf"></div>
  </div>

  <div id="detail-view" class="detail-wrap" style="display:none;">
    <button class="back-link" onclick="history.back()">← Semua Cerita</button>
    <div id="detail-head" class="detail-head"></div>
    <div id="chapter-list" class="chapter-list"></div>
  </div>

  <div id="reader-view" class="reader" style="display:none;">
    <button class="back-link" onclick="history.back()">← Daftar Bab</button>
    <h3 id="reader-chapter-title"></h3>
    <div id="reader-content" class="reader-content"></div>
    <div class="reader-nav">
      <button id="prev-btn" onclick="stepChapter(-1)">‹ Sebelumnya</button>
      <button id="next-btn" onclick="stepChapter(1)">Berikutnya ›</button>
    </div>
  </div>
</div>

<script src="js/ioe-auth.js"></script>
<script>
let session = null;
let shelfData = [];              // metadata semua cerita (dari get-shelf)
const storyCache = {};           // id -> cerita utuh (dari get-story), supaya buka ulang tidak fetch lagi
let currentStory = null;

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

// Validasi URL cover sebelum dipasang sebagai <img src> — pertahanan kedua di sisi client,
// konsisten dengan validasi di server (auth.js hanya menyimpan URL Cloudinary).
function isSafeCoverUrl(url) {
  return typeof url === 'string' && /^https:\/\/res\.cloudinary\.com\//.test(url);
}

function showScreen(id) {
  ['loading-screen', 'not-allowed-screen', 'error-screen', 'main-content'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? '' : 'none';
  });
}

function showView(id) {
  ['shelf-view', 'detail-view', 'reader-view'].forEach(v => {
    document.getElementById(v).style.display = (v === id) ? '' : 'none';
  });
  window.scrollTo(0, 0);
}

async function api(body) {
  const res = await fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}

// ───── Rak ─────
function coverHtml(url, cls) {
  return isSafeCoverUrl(url)
    ? `<img class="${cls}" src="${escHtml(url)}" alt="" loading="lazy">`
    : `<div class="${cls === 'cover' ? 'cover-placeholder' : 'detail-cover-placeholder'}">📖</div>`;
}

function renderShelf() {
  const shelf = document.getElementById('shelf');
  if (!shelfData.length) {
    shelf.className = '';
    shelf.innerHTML = '<div class="shelf-empty">Belum ada cerita di rak ini.</div>';
    return;
  }
  shelf.className = 'shelf';
  shelf.innerHTML = shelfData.map(st => `
    <button class="story-card" onclick="openStory('${escHtml(st.id)}')" aria-label="${escHtml(st.title)}">
      <div class="cover-box">${coverHtml(st.coverUrl, 'cover')}</div>
      <div class="title-bar">${escHtml(st.title)}</div>
    </button>
  `).join('');
}

// ───── Detail cerita ─────
function renderDetail(story) {
  const synopsis = (story.synopsis || '').trim();
  document.getElementById('detail-head').innerHTML = `
    <div class="detail-cover">${coverHtml(story.coverUrl, 'detail-cover-img')}</div>
    <div class="detail-info">
      <h2 class="detail-title">${escHtml(story.title)}</h2>
      <div class="detail-meta">${story.chapters.length} bab</div>
      <h4>Sinopsis</h4>
      <p class="synopsis ${synopsis ? '' : 'empty'}">${synopsis ? escHtml(synopsis) : 'Belum ada sinopsis.'}</p>
    </div>
  `;
  document.getElementById('chapter-list').innerHTML = story.chapters.map((ch, i) => `
    <button class="chapter-item" onclick="openChapter(${i})">
      <span class="ch-title">${escHtml(ch.title)}</span>
      <span class="ch-arrow">›</span>
    </button>
  `).join('');
}

// ───── Navigasi (pakai history supaya tombol Back HP naik satu tingkat: bab -> detail -> rak) ─────
function render(state) {
  if (state.v === 'detail' && currentStory && currentStory.id === state.id) {
    renderDetail(currentStory);
    showView('detail-view');
  } else if (state.v === 'reader' && currentStory && currentStory.id === state.id && currentStory.chapters[state.ch]) {
    drawChapter(state.ch);
    showView('reader-view');
  } else {
    renderShelf();
    showView('shelf-view');
  }
}

window.addEventListener('popstate', (e) => {
  const state = e.state || { v: 'shelf' };
  if (state.v !== 'shelf' && storyCache[state.id]) currentStory = storyCache[state.id];
  render(state);
});

async function openStory(id) {
  const card = document.querySelector(`.story-card[onclick="openStory('${id}')"]`);
  if (card) card.disabled = true;
  try {
    if (!storyCache[id]) {
      const { res, data } = await api({ action: 'get-story', memberId: session.memberId, sessionToken: session.sessionToken, storyId: id });
      if (res.status === 403) { showScreen('not-allowed-screen'); return; }
      if (!res.ok) throw new Error(data.error || 'Gagal memuat cerita');
      storyCache[id] = data.story;
    }
    currentStory = storyCache[id];
    history.pushState({ v: 'detail', id }, '');
    render({ v: 'detail', id });
  } catch (err) {
    console.error('Gagal membuka cerita:', err);
    alert('Gagal membuka cerita: ' + (err.message || err));
  } finally {
    if (card) card.disabled = false;
  }
}

// ───── Baca bab ─────
let currentChapterIndex = 0;

function drawChapter(index) {
  const ch = currentStory.chapters[index];
  currentChapterIndex = index;
  document.getElementById('reader-chapter-title').textContent = ch.title;
  document.getElementById('reader-content').textContent = ch.content; // textContent, bukan innerHTML — aman otomatis dari isi bab
  document.getElementById('prev-btn').disabled = index <= 0;
  document.getElementById('next-btn').disabled = index >= currentStory.chapters.length - 1;
}

function openChapter(index) {
  if (!currentStory || !currentStory.chapters[index]) return;
  history.pushState({ v: 'reader', id: currentStory.id, ch: index }, '');
  render({ v: 'reader', id: currentStory.id, ch: index });
}

// Pindah bab sebelum/sesudah: replaceState supaya tombol Back tetap sekali tekan kembali ke daftar bab.
function stepChapter(delta) {
  const next = currentChapterIndex + delta;
  if (!currentStory || !currentStory.chapters[next]) return;
  const state = { v: 'reader', id: currentStory.id, ch: next };
  history.replaceState(state, '');
  render(state);
}

// ───── Init ─────
async function init() {
  // requireIoeLogin() otomatis redirect ke login.html kalau belum login,
  // atau ke ban.html kalau akun di-ban. Kalau return null, redirect sudah ditangani di sana.
  session = await requireIoeLogin();
  if (!session) return;

  try {
    // Langkah 1: cek apakah member ini ada di daftar izin Pojok Baca (hanya untuk menentukan tampilan awal)
    const access = await api({ action: 'check-pojokbaca-access', memberId: session.memberId });
    if (!access.data.allowed) {
      showScreen('not-allowed-screen');
      return;
    }

    // Langkah 2: ambil rak cerita. Server MEMVERIFIKASI ULANG izin & session di sini (auth.js get-shelf);
    // pengecekan di langkah 1 bukan satu-satunya lapisan keamanan.
    const { res, data } = await api({ action: 'get-shelf', memberId: session.memberId, sessionToken: session.sessionToken });
    if (res.status === 403) {
      showScreen('not-allowed-screen'); // izin dicabut tepat di antara langkah 1 dan 2
      return;
    }
    if (!res.ok) throw new Error(data.error || 'Gagal memuat Pojok Baca');

    shelfData = data.stories || [];
    history.replaceState({ v: 'shelf' }, '');
    render({ v: 'shelf' });
    showScreen('main-content');
  } catch (err) {
    console.error('Pojok Baca error:', err);
    document.getElementById('error-message').textContent = err.message || 'Terjadi kesalahan tidak terduga.';
    showScreen('error-screen');
  }
}

init();
</script>
</body>
</html>
