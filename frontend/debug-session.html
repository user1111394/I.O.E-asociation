<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Session — Sementara</title>
<style>
  body {
    background: #0a0a12; color: #e2e8f0;
    font-family: monospace; padding: 20px;
    font-size: 14px; line-height: 1.6;
  }
  h1 { color: #ffd23f; font-size: 1.1rem; }
  pre {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(123,92,255,0.3);
    border-radius: 8px; padding: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .warn { color: #ff6b6b; }
</style>
</head>
<body>

<h1>⚠️ Debug Session (halaman sementara, boleh dihapus setelah selesai)</h1>

<p>Isi localStorage['ioe_account_session'] di browser ini:</p>
<pre id="out">Memuat...</pre>

<script>
  const raw = localStorage.getItem('ioe_account_session');
  document.getElementById('out').textContent = raw
    ? JSON.stringify(JSON.parse(raw), null, 2)
    : '(kosong — tidak ada session tersimpan di browser ini)';
</script>

</body>
</html>
