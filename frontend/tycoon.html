<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ore Tycoon — I.O.E Hub</title>
<script src="js/ioe-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0a12;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #worldCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: radial-gradient(circle at 50% 20%, #232a4d 0%, #0a0a12 75%);
  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(10,10,18,0.85), transparent);
  }
  header h1 {
    font-size: 1rem;
    background: linear-gradient(90deg,#7b5cff,#00c2ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .coin-badge {
    font-size: 0.8rem; font-weight: 700; color: #ffd23f;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,210,63,0.3);
    padding: 5px 10px; border-radius: 20px;
  }

  .machine-panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    max-height: 46vh;
    background: linear-gradient(180deg, transparent, rgba(10,10,18,0.95) 12%);
    display: flex; flex-direction: column;
  }
  .panel-drag-handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.25);
    margin: 8px auto 4px;
    flex-shrink: 0;
  }
  .collect-all-bar { padding: 6px 14px 8px; flex-shrink: 0; }
  .collect-all-btn {
    width: 100%; padding: 11px; border: none; border-radius: 12px;
    background: linear-gradient(90deg,#00c2ff,#7b5cff);
    color: #fff; font-weight: 800; font-size: 0.85rem; cursor: pointer;
  }
  .collect-all-btn:disabled { opacity: 0.5; }

  .machine-list {
    overflow-y: auto;
    padding: 0 14px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .machine-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 10px;
    display: flex; gap: 10px; align-items: center;
  }
  .machine-card.locked { opacity: 0.55; }

  .machine-icon {
    width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
  }

  .machine-info { flex: 1; min-width: 0; }
  .machine-name { font-size: 0.82rem; font-weight: 700; color: #fff; }
  .machine-tier-label { font-size: 0.62rem; color: #718096; margin-bottom: 5px; }
  .machine-progress-bar {
    height: 7px; border-radius: 4px; background: rgba(255,255,255,0.08);
    overflow: hidden; margin-bottom: 5px;
  }
  .machine-progress-fill {
    height: 100%; border-radius: 4px;
    transition: width 0.3s;
  }
  .machine-stats { font-size: 0.62rem; color: #a0aec0; }
  .machine-actions { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .machine-btn {
    padding: 6px 10px; border: none; border-radius: 8px;
    font-size: 0.65rem; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .btn-collect { background: rgba(0,229,197,0.2); color: #00e5c0; border: 1px solid rgba(0,229,197,0.4); }
  .btn-collect:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-upgrade { background: rgba(123,92,255,0.2); color: #a78bfa; border: 1px solid rgba(123,92,255,0.4); }
  .btn-unlock { background: linear-gradient(90deg,#ff5aa0,#7b5cff); color: #fff; }

  .inventory-strip {
    display: flex; gap: 6px; overflow-x: auto; padding: 0 14px 10px; flex-shrink: 0;
  }
  .inventory-strip::-webkit-scrollbar { display: none; }
  .ore-chip {
    display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 5px 10px; font-size: 0.68rem; white-space: nowrap;
  }
  .ore-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .welcome-back-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .welcome-back-overlay.show { display: flex; }
  .welcome-back-card {
    background: linear-gradient(160deg, #1a1f3a, #0a0a12);
    border: 1px solid rgba(123,92,255,0.4);
    border-radius: 16px; padding: 20px; max-width: 320px; width: 100%;
    text-align: center;
  }
  .welcome-back-card h2 { font-size: 1.1rem; margin-bottom: 6px; }
  .welcome-back-card .away-time { font-size: 0.78rem; color: #a0aec0; margin-bottom: 14px; }
  .welcome-back-list { text-align: left; font-size: 0.75rem; margin-bottom: 16px; }
  .welcome-back-list div { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .welcome-back-btn {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: linear-gradient(90deg,#00c2ff,#7b5cff);
    color: #fff; font-weight: 800; cursor: pointer;
  }

  .loading-state { text-align: center; padding: 30px 20px; color: #718096; font-size: 0.8rem; }
</style>
</head>
<body>

<canvas id="worldCanvas"></canvas>

<header>
  <h1>⛏️ Ore Tycoon</h1>
  <div class="coin-badge" id="coinBadge">🪙 —</div>
</header>

<div class="machine-panel">
  <div class="panel-drag-handle"></div>
  <div class="collect-all-bar">
    <button class="collect-all-btn" id="collectAllBtn" onclick="collectOre()">Collect All</button>
  </div>
  <div class="inventory-strip" id="inventoryGrid"></div>
  <div id="machineList" class="machine-list">
    <div class="loading-state">Memuat tambang...</div>
  </div>
</div>

<div class="welcome-back-overlay" id="welcomeBackOverlay">
  <div class="welcome-back-card">
    <h2>🎉 Selamat Datang Kembali!</h2>
    <div class="away-time" id="awayTimeText"></div>
    <div class="welcome-back-list" id="welcomeBackList"></div>
    <button class="welcome-back-btn" onclick="closeWelcomeBack()">Collect All</button>
  </div>
</div>

<script>
  const ORE_COLORS = {
    coal: '#4a4a52', copper: '#2E8B57', iron: '#c05c5c', silver: '#C0C0C0',
    gold: '#FFD700', platinum: '#E5E4E2', crystal: '#9370DB', mythril: '#4169E1',
    uranium: '#39FF14', darkmatter: '#8b5cf6',
  };
  const ORE_LABELS = {
    coal: 'Coal', copper: 'Copper', iron: 'Iron', silver: 'Silver', gold: 'Gold',
    platinum: 'Platinum', crystal: 'Crystal', mythril: 'Mythril', uranium: 'Uranium', darkmatter: 'Dark Matter',
  };
  const ORE_EMOJI = {
    coal: '⚫', copper: '🟤', iron: '🔴', silver: '⚪', gold: '🟡',
    platinum: '💎', crystal: '🔮', mythril: '🔷', uranium: '🟢', darkmatter: '🟣',
  };

  let currentState = null;
  let machineTiers = null;

  function getCurrentMember() {
    const session = (typeof getIoeSession === 'function') ? getIoeSession() : null;
    if (!session || !session.memberId || !session.sessionToken) return null;
    return { memberId: session.memberId, sessionToken: session.sessionToken };
  }

  async function callTycoonApi(action, extra = {}) {
    const member = getCurrentMember();
    if (!member) throw new Error('Silakan login dulu');
    const res = await fetch('/api/tycoon', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, memberId: member.memberId, sessionToken: member.sessionToken, ...extra }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal memproses permintaan');
    return data;
  }

  function formatOreAmount(n) { return Math.floor(n).toLocaleString('id-ID'); }

  let worldScene, worldCamera, worldRenderer, worldGroup;

  function buildMachineMesh(tier, color, unlocked) {
    const group = new THREE.Group();
    const opacity = unlocked ? 1 : 0.3;
    const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.4, roughness: 0.5, transparent: !unlocked, opacity });
    const accentColor = unlocked ? color : '#3a3f55';
    const accentMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: accentColor, emissiveIntensity: unlocked ? 0.6 : 0.15, transparent: !unlocked, opacity });

    const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1, 1.2), mat);
    group.add(body);

    const drill = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.8, 8), accentMat);
    drill.rotation.z = Math.PI / 2;
    drill.position.set(0.9, 0, 0);
    group.add(drill);

    if (tier >= 3) {
      const gear = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.08, 8, 16), accentMat);
      gear.position.set(-0.5, 0.3, 0.65);
      group.add(gear);
    }
    if (tier >= 6) {
      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), accentMat);
      orb.position.set(0, 0.7, 0);
      group.add(orb);
    }
    if (tier >= 9 && unlocked) {
      const aura = new THREE.Mesh(
        new THREE.SphereGeometry(0.9, 12, 12),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12 })
      );
      group.add(aura);
    }
    return group;
  }

  function initWorldView() {
    const canvas = document.getElementById('worldCanvas');
    const width = window.innerWidth, height = window.innerHeight;

    worldScene = new THREE.Scene();
    worldCamera = new THREE.PerspectiveCamera(50, width / height, 0.1, 400);

    worldRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    worldRenderer.setSize(width, height);
    worldRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    worldScene.background = new THREE.Color(0x87ceeb); // skyblue
    worldScene.fog = new THREE.Fog(0x87ceeb, 30, 110); // samakan warna fog dengan langit, supaya gunung jauh memudar ke warna langit (bukan ke biru gelap lama)

    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    worldScene.add(ambient);
    const sunLight = new THREE.DirectionalLight(0xfff4d6, 1);
    sunLight.position.set(10, 18, 8);
    worldScene.add(sunLight);

    // Lahan alam — pakai PlaneGeometry, BUKAN CircleGeometry.
    //
    // BUG FATAL sebelumnya: CircleGeometry(radius, segments) HANYA punya
    // SATU vertex pusat + SATU cincin vertex di tepi terluar — parameter
    // "segments" cuma menentukan berapa potong "pizza slice" mengelilingi
    // lingkaran, BUKAN jumlah cincin konsentris ke arah dalam. Artinya
    // tidak ada subdivisi radial sama sekali. Ketika kode di bawah memberi
    // vertex pusat tinggi 0 (rata) tapi SEMUA vertex tepi (yang jauh dari
    // pusat) diberi tinggi acak, triangle di antara 1 titik pusat dan
    // banyak titik tepi yang saling berjauhan jadi robek/melengkung liar
    // — persis paku/lubang tajam yang muncul di screenshot.
    //
    // PlaneGeometry(width, height, widthSegments, heightSegments) punya
    // GRID vertex asli di dua arah, jadi gelombang antar-vertex tetangga
    // selalu halus (tidak ada lompatan jauh seperti kasus CircleGeometry).
    // Bentuk pulau bundar tetap didapat dengan menurunkan tinggi secara
    // PROGRESIF mendekati tepi (bukan memotong vertex jadi bundar, yang
    // akan menciptakan tepi lubang tajam lagi kalau vertex-nya dibuang
    // manual) — jadi terlihat seperti pulau tanpa risiko robek geometri.
    const groundSize = 80; // sisi persegi sebelum "dilingkarkan" via falloff
    const groundSegments = 64;
    const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize, groundSegments, groundSegments);
    const groundPos = groundGeo.attributes.position;
    for (let i = 0; i < groundPos.count; i++) {
      const x = groundPos.getX(i), y = groundPos.getY(i); // PlaneGeometry belum dirotasi, jadi bidangnya masih di X-Y
      const dist = Math.sqrt(x * x + y * y);

      if (dist < 8) {
        groundPos.setZ(i, 0); // area tengah (tempat mesin berdiri): rata sempurna
        continue;
      }

      const bump = Math.sin(x * 0.3) * Math.cos(y * 0.25) * 0.6
                 + Math.sin(x * 0.12 + y * 0.18) * 0.9;

      // Falloff halus dari radius 8 (rata) ke radius 40 (gelombang penuh)
      // supaya transisinya lembut, tidak ada patahan tegas di batas 8.
      const falloff = Math.min(1, (dist - 8) / 12);
      groundPos.setZ(i, bump * falloff);
    }
    groundGeo.computeVertexNormals();

    const ground = new THREE.Mesh(
      groundGeo,
      new THREE.MeshStandardMaterial({ color: 0x3d7a3d, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    worldScene.add(ground);

    scatterGrass();

    // Gunung di kejauhan — beberapa kerucut besar di lingkar luar, jadi
    // horizon tidak kosong/datar walau bukan bagian lahan yang dipijak.
    scatterMountains();
    scatterTrees();

    worldGroup = new THREE.Group();
    worldScene.add(worldGroup);

    // ── Kontrol drag manual (orbit sederhana) — GANTI auto-rotate.
    //    User geser jari untuk memutar sudut pandang sendiri, kamera
    //    tidak pernah bergerak otomatis supaya mesin yang mau di-collect
    //    tidak perlu "ditunggu" muncul ke depan. ──
    let camAngle = 0.3, camElevation = 0.85, camDistance = 20;
    function updateCameraFromOrbit() {
      const y = camDistance * Math.sin(camElevation);
      const horizR = camDistance * Math.cos(camElevation);
      worldCamera.position.set(horizR * Math.sin(camAngle), y, horizR * Math.cos(camAngle));
      worldCamera.lookAt(0, 0, 0);
    }
    updateCameraFromOrbit();

    let dragging = false, lastX = 0, lastY = 0;
    function onDragStart(x, y) { dragging = true; lastX = x; lastY = y; }
    function onDragMove(x, y) {
      if (!dragging) return;
      const dx = x - lastX, dy = y - lastY;
      camAngle -= dx * 0.008;
      camElevation = Math.min(1.3, Math.max(0.25, camElevation + dy * 0.005));
      lastX = x; lastY = y;
      updateCameraFromOrbit();
    }
    function onDragEnd() { dragging = false; }

    canvas.addEventListener('touchstart', e => { const t = e.touches[0]; onDragStart(t.clientX, t.clientY); }, { passive: true });
    canvas.addEventListener('touchmove', e => { const t = e.touches[0]; onDragMove(t.clientX, t.clientY); }, { passive: true });
    canvas.addEventListener('touchend', onDragEnd);
    canvas.addEventListener('mousedown', e => onDragStart(e.clientX, e.clientY));
    canvas.addEventListener('mousemove', e => onDragMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onDragEnd);

    // 'disposed' dideklarasikan DI SINI (sebelum loop didefinisikan &
    // dipanggil) supaya urutannya jelas dibaca, walau secara teknis aman
    // juga kalau dideklarasikan setelahnya (loop() baru benar-benar
    // membaca 'disposed' di frame requestAnimationFrame berikutnya, bukan
    // saat panggilan pertama yang sinkron).
    let disposed = false;

    function loop() {
      if (disposed) return; // stop loop begitu context dilepas (lihat disposeWorldView)
      requestAnimationFrame(loop);
      worldRenderer.render(worldScene, worldCamera);
    }
    loop();

    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      worldRenderer.setSize(w, h);
      worldCamera.aspect = w / h;
      worldCamera.updateProjectionMatrix();
    });

    // ── FIX bug "limit WebGL" (context tidak pernah dilepas) ──
    // Setiap kali initWorldView() dipanggil, browser mengalokasikan SATU
    // WebGL context baru. Browser (terutama mobile) punya limit KERAS
    // jumlah context WebGL aktif bersamaan (biasanya sekitar 8-16 — beda
    // tiap browser/device). Kalau halaman ini dibuka di dalam <iframe>
    // yang dibuka-tutup berkali-kali (rencana pemakaian nanti di I.O.E
    // Hub) TANPA pernah melepas context lama, context akan menumpuk terus
    // sampai limit itu kena — begitu itu terjadi, context BARU gagal
    // dibuat sama sekali dan canvas jadi kosong/hitam (persis bug yang
    // dilaporkan: "gak keluar tampilannya").
    //
    // dispose() pada renderer + kehilangan context secara eksplisit lewat
    // ekstensi WEBGL_lose_context adalah cara PALING PASTI memberitahu
    // browser context ini sudah tidak dipakai dan boleh direklamasi —
    // sekadar berhenti me-render (hentikan loop) TIDAK cukup, karena
    // context WebGL-nya sendiri tetap dianggap "hidup" oleh browser
    // sampai benar-benar di-dispose.
    //
    // 'pagehide' dipakai (bukan 'beforeunload') karena pagehide juga
    // terpicu saat halaman di dalam iframe DILEPAS/di-remove dari DOM
    // oleh parent (misal nav.js menutup modal/iframe game ini), yang
    // merupakan skenario utama yang perlu diantisipasi di sini.
    function disposeWorldView() {
      if (disposed || !worldRenderer) return;
      disposed = true;
      worldScene.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          mats.forEach(m => m.dispose());
        }
      });
      const glExt = worldRenderer.getContext().getExtension('WEBGL_lose_context');
      if (glExt) glExt.loseContext();
      worldRenderer.dispose();
    }
    window.addEventListener('pagehide', disposeWorldView);
    window.addEventListener('beforeunload', disposeWorldView);
  }

  // ── Efek rumput sederhana & RINGAN: pakai InstancedMesh (satu geometry +
  //    satu material, di-render dalam SATU draw call untuk semua bilah),
  //    bukan ratusan Mesh terpisah yang akan membebani WebGL. Ditebar di
  //    cincin radius 6-16 (mulai dari luar area mesin, sampai sebelum area
  //    pepohonan) supaya tanah tidak polos warna solid. ──
  function scatterGrass() {
    const bladeGeo = new THREE.ConeGeometry(0.05, 0.35, 3);
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0x4a9440, roughness: 1 });
    const count = 260;
    const grassMesh = new THREE.InstancedMesh(bladeGeo, bladeMat, count);

    const dummy = new THREE.Object3D();
    for (let i = 0; i < count; i++) {
      const angle = seededRandom(i * 1.37 + 200) * Math.PI * 2;
      const radius = 6 + seededRandom(i * 2.91 + 200) * 10; // 6-16, di luar area mesin (radius 0-8)
      dummy.position.set(Math.cos(angle) * radius, 0.15, Math.sin(angle) * radius);
      dummy.rotation.y = seededRandom(i * 4.19 + 200) * Math.PI * 2;
      const scale = 0.7 + seededRandom(i * 5.53 + 200) * 0.6;
      dummy.scale.set(scale, scale * (0.8 + seededRandom(i * 6.7 + 200) * 0.4), scale);
      dummy.updateMatrix();
      grassMesh.setMatrixAt(i, dummy.matrix);
    }
    grassMesh.instanceMatrix.needsUpdate = true;
    worldScene.add(grassMesh);
  }

  // ── Pohon sederhana: silinder batang + 2 kerucut daun bertumpuk.
  //    Ditebar acak (dengan seed tetap) di sekitar tepi lahan, menjauhi
  //    area tengah supaya tidak menabrak mesin. ──
  function makeTree() {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.16, 1.1, 6),
      new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: 1 })
    );
    trunk.position.y = 0.55;
    tree.add(trunk);

    const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f6b2f, roughness: 0.9 });
    const leaf1 = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.1, 7), leafMat);
    leaf1.position.y = 1.35;
    tree.add(leaf1);
    const leaf2 = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.8, 7), leafMat);
    leaf2.position.y = 1.9;
    tree.add(leaf2);

    return tree;
  }

  // Pseudo-random dengan seed tetap supaya posisi pohon konsisten tiap
  // reload (tidak "meloncat" posisinya tiap refresh halaman).
  function seededRandom(seed) {
    const x = Math.sin(seed * 999) * 10000;
    return x - Math.floor(x);
  }

  // ── Gunung kejauhan: kerucut besar low-poly di lingkar luar (radius
  //    35-55), jadi horizon punya siluet, bukan datar kosong. Warna
  //    keunguan/kebiruan pudar khas gunung jauh (aerial perspective). ──
  function scatterMountains() {
    // FIX (gunung tidak mengelilingi map penuh): sebelumnya angle setiap
    // gunung MURNI acak (seededRandom * 2π) dengan cuma 8 gunung — pada
    // sudut acak murni, sangat mungkin ada celah besar di salah satu sisi
    // map yang tidak kebagian gunung sama sekali (persis di screenshot,
    // sisi kanan-atas kosong). Diperbaiki dengan membagi 360° jadi
    // beberapa "slot" merata dulu (mountainCount slot), BARU tiap gunung
    // diberi variasi sudut kecil di dalam slotnya masing-masing — hasilnya
    // tetap terlihat organik/tidak berbaris kaku, tapi dijamin tidak ada
    // celah besar karena tiap arah mata angin pasti kebagian jatah gunung.
    const mountainCount = 20; // dinaikkan lagi dari 14 — dari sudut kamera manapun, celah antar slot masih terlihat kalau terlalu jarang
    const slotAngle = (Math.PI * 2) / mountainCount;
    const mat = new THREE.MeshStandardMaterial({ color: 0x4a5a72, roughness: 1, flatShading: true });
    // Material puncak salju terpisah dari badan gunung (dipasang sebagai
    // cone kedua yang lebih kecil, ditumpuk di ujung atas gunung utama).
    const snowMat = new THREE.MeshStandardMaterial({ color: 0xf0f4f8, roughness: 0.9, flatShading: true });

    for (let i = 0; i < mountainCount; i++) {
      // Variasi ±35% dari lebar slot supaya tidak terlihat berbaris kaku/grid,
      // tapi tetap tidak akan tumpang tindih parah ke slot tetangga.
      const angle = i * slotAngle + (seededRandom(i * 2.71 + 50) - 0.5) * slotAngle * 0.7;
      const radius = 35 + seededRandom(i * 6.13 + 50) * 20;
      const height = 12 + seededRandom(i * 9.41 + 50) * 14;
      const baseR = height * (0.6 + seededRandom(i * 3.77 + 50) * 0.4);

      const mountain = new THREE.Mesh(new THREE.ConeGeometry(baseR, height, 6), mat);
      const posX = Math.cos(angle) * radius;
      const posY = height / 2 - 1;
      const posZ = Math.sin(angle) * radius;
      const rotY = seededRandom(i * 1.9 + 50) * Math.PI;
      mountain.position.set(posX, posY, posZ);
      mountain.rotation.y = rotY;
      worldScene.add(mountain);

      // Puncak bersalju — cone kedua yang lebih kecil (30% tinggi & lebar
      // badan gunung), ditempatkan pas menutupi ujung atas cone utama.
      // Cuma gunung yang cukup tinggi (>18) yang dapat salju, meniru garis
      // salju alami (gunung pendek biasanya tidak bersalju).
      if (height > 18) {
        // FIX (salju terlihat numpuk/gembung aneh): sebelumnya snowBaseR
        // ditebak (baseR * 0.32) tanpa memperhitungkan bahwa cone gunung
        // MELEBAR LINEAR dari puncak ke alas — radius sebenarnya di titik
        // mana pun sepanjang tinggi cone bisa dihitung pasti secara
        // geometri, bukan ditebak. Kalau tebakannya kebesaran dari radius
        // asli di titik itu, snow cap akan "mbendol"/menonjol keluar dari
        // permukaan gunung dan terlihat seperti gundukan terpisah,
        // bukan lapisan tipis yang menyatu.
        //
        // Cone gunung: radius 0 di puncak, radius = baseR di alas (jarak
        // 'height' dari puncak). Snow cap dipasang mulai dari fraksi
        // 'snowStartFraction' tinggi gunung DARI PUNCAK ke bawah — radius
        // gunung di titik itu = baseR * snowStartFraction (proporsi
        // linear cone). Snow cap dibuat SEDIKIT lebih besar dari itu
        // (bukan jauh lebih besar) supaya menutup tipis di permukaan,
        // bukan menggembung ke luar.
        const snowStartFraction = 0.28; // salju menutupi 28% teratas tinggi gunung
        const snowHeight = height * snowStartFraction;
        const mountainRadiusAtSnowLine = baseR * snowStartFraction; // radius gunung PERSIS di garis salju
        const snowBaseR = mountainRadiusAtSnowLine * 1.06; // cuma sedikit lebih besar (lapisan tipis), bukan gembung

        const snowCap = new THREE.Mesh(new THREE.ConeGeometry(snowBaseR, snowHeight, 6), snowMat);
        // Puncak cone gunung ada di posY + height/2. Cone salju diposisikan
        // supaya PUNCAKnya berimpit dengan puncak gunung, dan ALASnya
        // persis di garis salju yang dihitung di atas — tidak ditebak lagi.
        const mountainTopY = posY + height / 2;
        snowCap.position.set(posX, mountainTopY - snowHeight / 2, posZ);
        snowCap.rotation.y = rotY;
        worldScene.add(snowCap);
      }
    }
  }

  function scatterTrees() {
    const treeCount = 14;
    for (let i = 0; i < treeCount; i++) {
      const angle = seededRandom(i * 3.1) * Math.PI * 2;
      const radius = 9 + seededRandom(i * 5.7) * 6; // di luar area mesin (radius ~9-15)
      const tree = makeTree();
      tree.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
      tree.scale.setScalar(0.8 + seededRandom(i * 7.3) * 0.5);
      tree.rotation.y = seededRandom(i * 2.2) * Math.PI * 2;
      worldScene.add(tree);
    }
  }

  // Posisi mesin: organik/tersebar di area tengah (radius 0-8), TIDAK grid.
  // Pakai seed per-tier supaya posisi tiap mesin konsisten tiap reload,
  // tidak berpindah-pindah tiap kali rebuildWorldMachines() dipanggil.
  function organicPositionForTier(tier, indexAmongUnlocked) {
    const angle = seededRandom(tier * 4.13) * Math.PI * 2;
    const radius = 2 + seededRandom(tier * 8.71) * 5.5;
    return {
      x: Math.cos(angle) * radius,
      z: Math.sin(angle) * radius,
      rotationY: seededRandom(tier * 6.29) * Math.PI * 2,
    };
  }

  function rebuildWorldMachines() {
    if (!worldGroup) return;
    while (worldGroup.children.length > 0) worldGroup.remove(worldGroup.children[0]);

    const tiers = Object.keys(machineTiers).map(Number).sort((a, b) => a - b);
    const unlockedTiers = tiers.filter(t => currentState.machines[t]?.unlocked);

    // Mesin yang BELUM unlocked tidak dirender sama sekali (hilang total
    // dari world, sesuai keputusan — bukan silhouette transparan lagi).
    unlockedTiers.forEach((tier, idx) => {
      const info = machineTiers[tier];
      const oreColor = ORE_COLORS[info.oreType] || '#888888';

      const mesh = buildMachineMesh(tier, oreColor, true);
      mesh.scale.setScalar(0.65);

      const pos = organicPositionForTier(tier, idx);
      mesh.position.set(pos.x, 0.3, pos.z);
      mesh.rotation.y = pos.rotationY;

      worldGroup.add(mesh);
    });
  }

  function renderMachineList() {
    const listEl = document.getElementById('machineList');
    const tiers = Object.keys(machineTiers).map(Number).sort((a, b) => a - b);

    listEl.innerHTML = tiers.map(tier => {
      const info = machineTiers[tier];
      const m = currentState.machines[tier];
      const oreColor = ORE_COLORS[info.oreType] || '#888';
      const emoji = ORE_EMOJI[info.oreType] || '⛏️';

      if (!m || !m.unlocked) {
        const canUnlock = tier === 1 || currentState.machines[tier - 1]?.unlocked;
        return `
          <div class="machine-card locked">
            <div class="machine-icon" style="background:rgba(255,255,255,0.06);">${emoji}</div>
            <div class="machine-info">
              <div class="machine-name">${info.name}</div>
              <div class="machine-tier-label">Tier ${tier} · Terkunci</div>
              <div class="machine-stats">Butuh 🪙 ${info.unlockCost.toLocaleString('id-ID')}</div>
            </div>
            <div class="machine-actions">
              <button class="machine-btn btn-unlock" ${canUnlock ? '' : 'disabled'} onclick="unlockMachine(${tier})">Unlock</button>
            </div>
          </div>`;
      }

      const rate = info.oreRatePerHour * (1 + 0.10 * (m.speedLevel - 1));
      const cap = Math.floor(info.baseCapacity * (1 + 0.20 * (m.capacityLevel - 1)));
      const pct = Math.min(100, (m.oreStored / cap) * 100);

      return `
        <div class="machine-card">
          <div class="machine-icon" style="background:linear-gradient(135deg, ${oreColor}55, ${oreColor}22);">${emoji}</div>
          <div class="machine-info">
            <div class="machine-name">${info.name}</div>
            <div class="machine-tier-label">Tier ${tier} · Lv Speed ${m.speedLevel} · Lv Cap ${m.capacityLevel}</div>
            <div class="machine-progress-bar"><div class="machine-progress-fill" style="width:${pct}%; background: linear-gradient(90deg, ${oreColor}, #00c2ff);"></div></div>
            <div class="machine-stats">${formatOreAmount(m.oreStored)} / ${cap} ${ORE_LABELS[info.oreType]} · ${rate.toFixed(1)}/jam</div>
          </div>
          <div class="machine-actions">
            <button class="machine-btn btn-collect" ${m.oreStored < 1 ? 'disabled' : ''} onclick="collectOre(${tier})">Collect</button>
            <button class="machine-btn btn-upgrade" onclick="showUpgradeChoice(${tier})">Upgrade</button>
          </div>
        </div>`;
    }).join('');

    rebuildWorldMachines();
  }

  function renderInventory() {
    const grid = document.getElementById('inventoryGrid');
    const inv = currentState.oreInventory || {};
    const entries = Object.entries(inv).filter(([, v]) => v > 0);

    if (entries.length === 0) { grid.innerHTML = ''; return; }
    grid.innerHTML = entries.map(([oreType, amount]) => `
      <div class="ore-chip">
        <span class="ore-dot" style="background:${ORE_COLORS[oreType] || '#888'}"></span>
        ${ORE_LABELS[oreType] || oreType}: ${formatOreAmount(amount)}
      </div>
    `).join('');
  }

  async function refreshCoinBadge() {
    const member = getCurrentMember();
    if (!member) return;
    try {
      const res = await fetch('/api/shop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get-balance', memberId: member.memberId, sessionToken: member.sessionToken }),
      });
      const data = await res.json();
      if (res.ok) document.getElementById('coinBadge').textContent = `🪙 ${(data.coins || 0).toLocaleString('id-ID')}`;
    } catch (e) { console.error('Gagal ambil saldo koin:', e); }
  }

  async function loadTycoon(showWelcomeBack = true) {
    try {
      const before = currentState;
      const data = await callTycoonApi('get-state');
      currentState = data.state;
      machineTiers = data.machineTiers;

      if (showWelcomeBack && before) checkWelcomeBack(before, currentState);

      renderMachineList();
      renderInventory();
      refreshCoinBadge();
    } catch (err) {
      document.getElementById('machineList').innerHTML = `<div class="loading-state">⚠️ ${err.message}</div>`;
    }
  }

  function checkWelcomeBack(before, after) {
    const gains = [];
    for (const tier of Object.keys(after.machines)) {
      const b = before.machines[tier]?.oreStored || 0;
      const a = after.machines[tier]?.oreStored || 0;
      if (a > b + 0.5) gains.push({ tier, amount: a - b, oreType: machineTiers[tier].oreType });
    }
    if (gains.length === 0) return;

    document.getElementById('welcomeBackList').innerHTML = gains.map(g =>
      `<div>${machineTiers[g.tier].name} → +${formatOreAmount(g.amount)} ${ORE_LABELS[g.oreType]}</div>`
    ).join('');
    document.getElementById('awayTimeText').textContent = 'Mesin kamu terus bekerja selama kamu pergi!';
    document.getElementById('welcomeBackOverlay').classList.add('show');
  }

  function closeWelcomeBack() {
    document.getElementById('welcomeBackOverlay').classList.remove('show');
    collectOre();
  }

  async function collectOre(tier) {
    try {
      const data = await callTycoonApi('collect-ore', tier ? { tier } : {});
      currentState = data.state;
      renderMachineList();
      renderInventory();
    } catch (err) { alert(err.message); }
  }

  async function unlockMachine(tier) {
    if (!confirm(`Unlock ${machineTiers[tier].name} seharga 🪙 ${machineTiers[tier].unlockCost.toLocaleString('id-ID')}?`)) return;
    try {
      const data = await callTycoonApi('unlock-machine', { tier });
      currentState = data.state;
      renderMachineList();
      refreshCoinBadge();
    } catch (err) { alert(err.message); }
  }

  async function showUpgradeChoice(tier) {
    const choice = confirm('OK = Upgrade Speed (+10% rate)\nCancel = Upgrade Capacity (+20% kapasitas)');
    const upgradeType = choice ? 'speed' : 'capacity';
    try {
      const data = await callTycoonApi('upgrade-machine', { tier, upgradeType });
      currentState = data.state;
      renderMachineList();
      refreshCoinBadge();
    } catch (err) { alert(err.message); }
  }
  window.collectOre = collectOre;
  window.unlockMachine = unlockMachine;
  window.showUpgradeChoice = showUpgradeChoice;
  window.closeWelcomeBack = closeWelcomeBack;

  initWorldView();
  loadTycoon(true);
</script>

</body>
</html>
