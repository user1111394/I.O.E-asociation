<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kandangku — I.O.E Hub</title>
<script src="js/ioe-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #14100a;
    color: #f0e8d8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #barnCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(20,16,10,0.85), transparent);
  }
  header h1 {
    font-size: 1rem;
    background: linear-gradient(90deg,#ffb84d,#ff8a3d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .exit-btn {
    font-size: 0.75rem; font-weight: 700; color: #f0e0c8;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 12px; border-radius: 20px; cursor: pointer;
  }

  .status-hud {
    position: fixed; top: 54px; left: 14px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .status-chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700;
    backdrop-filter: blur(4px);
  }

  .catchpet-btn {
    position: fixed; top: 54px; right: 14px; z-index: 10;
    font-size: 0.72rem; font-weight: 700; color: #14100a;
    background: linear-gradient(90deg,#ffb84d,#ff5aa0);
    border: none; padding: 7px 13px; border-radius: 20px; cursor: pointer;
  }

  .upgrade-hint {
    position: fixed; bottom: 20px; left: 14px; right: 14px; z-index: 10;
    display: flex; justify-content: center;
  }
  .upgrade-btn {
    font-size: 0.75rem; font-weight: 700; color: #14100a;
    background: linear-gradient(90deg,#ffb84d,#ff8a3d);
    border: none; padding: 9px 18px; border-radius: 20px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,184,77,0.35);
  }
  .upgrade-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Panel aksi hewan (modal bottom-sheet, konsisten pola Garden) ── */
  .pet-panel-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .pet-panel-overlay.show { display: flex; }
  .pet-panel {
    width: 100%; max-width: 480px;
    background: linear-gradient(160deg, #241c10, #14100a);
    border: 1px solid rgba(255,184,77,0.3);
    border-radius: 20px 20px 0 0;
    padding: 18px 18px 26px;
    max-height: 75vh; overflow-y: auto;
  }
  .pet-panel h2 { font-size: 1rem; margin-bottom: 4px; }
  .pet-panel .pet-sub { font-size: 0.75rem; color: #c8b898; margin-bottom: 14px; }
  .pet-panel .close-btn {
    float: right; background: rgba(255,255,255,0.1); border: none;
    color: #f0e0c8; width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    font-size: 0.9rem;
  }

  .happiness-bar-wrapper {
    background: rgba(255,255,255,0.08); border-radius: 10px; height: 14px;
    overflow: hidden; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.12);
  }
  .happiness-bar-fill {
    height: 100%; background: linear-gradient(90deg,#ff8a3d,#ffd23f,#7ac850);
    transition: width 0.3s;
  }
  .happiness-label { font-size: 0.72rem; color: #c8b898; margin-bottom: 4px; display: flex; justify-content: space-between; }

  .action-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: linear-gradient(90deg,#ffb84d,#ff8a3d);
    color: #14100a; font-weight: 800; font-size: 0.85rem; cursor: pointer;
    margin-bottom: 8px;
  }
  .action-btn.secondary {
    background: rgba(255,255,255,0.1); color: #f0e0c8;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .yield-banner {
    background: rgba(122,200,80,0.15); border: 1px solid rgba(122,200,80,0.4);
    border-radius: 10px; padding: 10px 12px; font-size: 0.8rem; margin-bottom: 10px;
    color: #b8e898; display: flex; justify-content: space-between; align-items: center;
  }

  .empty-hint { font-size: 0.85rem; color: #c8b898; text-align: center; padding: 40px 20px; line-height: 1.6; }
  .empty-hint .go-catch-btn {
    display: inline-block; margin-top: 14px; padding: 10px 20px; border-radius: 20px;
    background: linear-gradient(90deg,#ffb84d,#ff5aa0); color: #14100a; font-weight: 800;
    text-decoration: none; font-size: 0.8rem;
  }

  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    z-index: 80; pointer-events: none;
    background: rgba(0,0,0,0.75); border: 1px solid rgba(255,184,77,0.5);
    padding: 10px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 700;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    text-align: center; color: #ffd8a0;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .toast.error { color: #ff9878; border-color: rgba(255,120,80,0.5); }

  .loading-overlay {
    position: fixed; inset: 0; background: #14100a;
    display: flex; align-items: center; justify-content: center; z-index: 200;
    color: #c8b898; font-size: 0.85rem; text-align: center; padding: 24px; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">Memasuki kandang...</div>

<canvas id="barnCanvas"></canvas>

<header>
  <h1>🏠 Kandangku</h1>
  <button class="exit-btn" onclick="exitToHub()">✕ Keluar</button>
</header>

<button class="catchpet-btn" onclick="goToCatchPet()">🐾 Catch a Pet</button>

<div class="status-hud">
  <div class="status-chip">🐾 Animal Coin: <span id="hudAnimalCoin">0</span></div>
  <div class="status-chip" id="hudCapacity">🏠 Slot: —</div>
  <div class="status-chip" id="hudFishCapacity">🐟 Kolam: —</div>
</div>

<div class="upgrade-hint">
  <button class="upgrade-btn" id="upgradeBtn" onclick="doUpgradeBarn()">⬆️ Upgrade Kandang</button>
</div>

<div class="pet-panel-overlay" id="petPanelOverlay">
  <div class="pet-panel">
    <button class="close-btn" onclick="closePetPanel()">✕</button>
    <h2 id="petPanelTitle">Hewan</h2>
    <div class="pet-sub" id="petPanelSub"></div>
    <div id="petPanelBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function exitToHub() { window.location.href = 'game.html'; }
function goToCatchPet() { window.location.href = 'catchapet.html'; }

function getCurrentMember() {
  const session = (typeof getIoeSession === 'function') ? getIoeSession() : null;
  if (!session || !session.memberId || !session.sessionToken) return null;
  return { memberId: session.memberId, sessionToken: session.sessionToken };
}

async function callTycoonApi(action, extra = {}) {
  const member = getCurrentMember();
  if (!member) throw new Error('Silakan login dulu');
  const res = await fetch('/api/tycoon', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, memberId: member.memberId, sessionToken: member.sessionToken, ...extra }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Gagal memproses permintaan');
  return data;
}

let toastTimeout = null;
function showToast(message, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show' + (isError ? ' error' : '');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
}

// ══════════════════════════════════════════
// STATE GLOBAL DARI SERVER
// ══════════════════════════════════════════
let BARN_STATE = null; // { level, pets: [...], fishPond: [...] }
let PETS = null;
let foodCost = 0;
let barnCapacity = 6;
let fishPondCapacity = 3;
let barnLevels = null;
let animalCoins = 0;
let selectedInstanceId = null;
let selectedIsFish = false;

// ══════════════════════════════════════════
// KATEGORI VISUAL — dipecah lebih detail per bentuk, bukan cuma
// "pet_small" generik untuk semua mamalia kecil (itu penyebab kucing,
// kelinci, kucing es semua terlihat sama seperti "babi kecil"). Sekarang
// tiap bentuk unik pakai proporsi sendiri sesuai 3D-model-pet.txt.
// ══════════════════════════════════════════
const PET_VISUAL_CATEGORY = {
  chicken: 'bird_small', chicken_white: 'bird_small', bee: 'flying_tiny',
  // Sapi & naga & kelinci pakai gaya BLOCKY (Minecraft-style, semua kubus)
  // sesuai permintaan khusus — sisanya tetap gaya organik/bulat biasa.
  cow: 'cow_blocky', cow_brown: 'cow_blocky', goat: 'livestock_medium',
  goldfish: 'fish',
  cat: 'cat_shape', cat_black: 'cat_shape', icecat: 'cat_shape',
  dog: 'dog_shape', firefox: 'dog_shape',
  rabbit: 'rabbit_blocky', rabbit_brown: 'rabbit_blocky',
  hamster: 'hamster_shape',
  penguin: 'penguin_blocky',
  dragon: 'dragon_blocky', dragon_ice: 'dragon_blocky',
  unicorn: 'unicorn',
  beetle: 'beetle',
};
// Skala keseluruhan per kategori (1 = ukuran dasar).
const CATEGORY_SCALE = {
  bird_small: 0.55, flying_tiny: 0.3, cow_blocky: 1.5, livestock_medium: 1.15,
  fish: 0.6, cat_shape: 0.8, dog_shape: 1.05, rabbit_blocky: 0.7, hamster_shape: 0.4,
  pet_small: 0.85, dragon_blocky: 1.9, unicorn: 1.7, beetle: 0.7, penguin_blocky: 0.75,
};
const FLYING_CATEGORIES = ['flying_tiny'];
const FLY_HEIGHT = 1.2; // lebih rendah dari Catch a Pet karena ruang kandang terbatas

// ══════════════════════════════════════════
// PET MESH — bentuk primitif per kategori (bukan model .FBX custom).
// Tiap kategori beda proporsi & fitur (telinga, ekor, sayap, tanduk)
// mengikuti ciri khas di 3D-model-pet.txt sebisa mungkin dalam batas
// primitif Three.js.
// ══════════════════════════════════════════
function addLegs(group, bodyMat, legRadius, legLength, spreadX, spreadZ, bodyBottomY) {
  const positions = [
    [spreadX, spreadZ], [spreadX, -spreadZ], [-spreadX, spreadZ], [-spreadX, -spreadZ],
  ];
  const legs = [];
  for (const [lx, lz] of positions) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(legRadius, legRadius * 0.85, legLength, 6), bodyMat);
    leg.position.set(lx, bodyBottomY - legLength / 2, lz);
    leg.userData.isLeg = true;
    leg.userData.baseY = leg.position.y;
    group.add(leg);
    legs.push(leg);
  }
  return legs;
}

function buildCapsuleBody(bodyMat, radius, length) {
  // CapsuleGeometry TIDAK tersedia di Three.js r128 (baru r142+) — pakai
  // silinder + 2 bola di ujung sebagai ganti, hasil visual serupa kapsul.
  const bodyGroup = new THREE.Group();
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 8), bodyMat);
  cyl.rotation.z = Math.PI / 2;
  bodyGroup.add(cyl);
  const capFront = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 8), bodyMat);
  capFront.position.x = length / 2;
  bodyGroup.add(capFront);
  const capBack = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 8), bodyMat);
  capBack.position.x = -length / 2;
  bodyGroup.add(capBack);
  return bodyGroup;
}

function buildPetMesh(petId) {
  const pet = PETS[petId];
  const color = pet ? pet.color : 0x888888;
  const category = PET_VISUAL_CATEGORY[petId] || 'pet_small';
  const scale = CATEGORY_SCALE[category] || 0.85;
  const group = new THREE.Group();
  const legsList = []; // dikumpulkan supaya animasi jalan/lari bisa gerakkan semua kaki bersamaan

  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, flatShading: true });
  const earMat = new THREE.MeshStandardMaterial({ color, roughness: 0.85 });
  const pinkMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.7 });

  if (category === 'fish') {
    // Ikan: badan pipih memanjang, sirip ekor, TANPA kaki, mengambang
    // rendah dekat tanah (representasi ada di air/kolam).
    const body = buildCapsuleBody(bodyMat, 0.22, 0.35);
    body.scale.set(1, 0.6, 1.3);
    body.position.y = 0.25;
    group.add(body);
    const tailFin = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.25, 4), bodyMat);
    tailFin.rotation.z = -Math.PI / 2;
    tailFin.position.set(-0.42, 0.25, 0);
    group.add(tailFin);
  } else if (category === 'flying_tiny' || category === 'bird_small') {
    // Lebah/ayam: badan kecil bulat + sepasang sayap. Lebah (flying_tiny)
    // tidak punya kaki sama sekali (selalu di udara); ayam tetap dikasih
    // kaki tipis karena jalan di tanah.
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), bodyMat);
    body.position.y = 0.35;
    group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), bodyMat);
    head.position.set(0.28, 0.42, 0);
    group.add(head);
    const wingMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
    for (const side of [-1, 1]) {
      const wing = new THREE.Mesh(new THREE.CircleGeometry(0.18, 8), wingMat);
      wing.position.set(0, 0.42, side * 0.18);
      wing.rotation.x = Math.PI / 2;
      wing.userData.isWing = true;
      wing.userData.wingSide = side;
      group.add(wing);
    }
    if (category === 'bird_small') {
      const legs = addLegs(group, bodyMat, 0.02, 0.18, 0.06, 0.05, 0.24);
      legsList.push(...legs);
    }
  } else if (category === 'cat_shape') {
    // Kucing (dokumen 2A): "tubuh ramping", "kepala bundar", "telinga
    // segitiga tegak runcing", "ekor panjang berbulu fleksibel". Badan
    // dibuat LEBIH RAMPING & LEBIH KECIL dari kategori umum sebelumnya
    // (radius 0.22 bukan 0.32) supaya beda jelas dari kelinci/anjing.
    const body = buildCapsuleBody(bodyMat, 0.22, 0.42);
    body.position.y = 0.32;
    group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 8, 8), bodyMat);
    head.position.set(0.42, 0.42, 0);
    group.add(head);
    // Telinga segitiga tegak, runcing — lebih besar & lebih tegak dari default.
    for (const side of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.15, 6), earMat);
      ear.position.set(0.46, 0.58, side * 0.1);
      group.add(ear);
    }
    // Ekor panjang melengkung ke atas (ciri khas kucing), dibangun dari
    // beberapa segmen silinder kecil supaya terlihat melengkung.
    const tailSegments = 4;
    for (let i = 0; i < tailSegments; i++) {
      const t = i / (tailSegments - 1);
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.15, 5), bodyMat);
      seg.position.set(-0.35 - t * 0.15, 0.3 + t * 0.28, 0);
      seg.rotation.z = -Math.PI / 2.6 + t * 0.5;
      group.add(seg);
    }
    const legs = addLegs(group, bodyMat, 0.055, 0.28, 0.16, 0.14, 0.15);
    legsList.push(...legs);
  } else if (category === 'dog_shape') {
    // Anjing (dokumen 2B): "berotot, dada lebar", "telinga menggantung
    // (floppy)", "ekor bergoyang". Badan lebih besar & kekar dari kucing.
    const body = buildCapsuleBody(bodyMat, 0.28, 0.5);
    body.position.y = 0.4;
    group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), bodyMat);
    head.position.set(0.5, 0.5, 0);
    group.add(head);
    // Moncong (snout) menonjol ke depan.
    const snout = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 0.2, 8), bodyMat);
    snout.rotation.z = Math.PI / 2;
    snout.position.set(0.68, 0.46, 0);
    group.add(snout);
    // Telinga menggantung (floppy) — pipih, menjuntai ke bawah, bukan tegak.
    for (const side of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6), earMat);
      ear.scale.set(0.5, 1.3, 0.7);
      ear.position.set(0.5, 0.44, side * 0.2);
      group.add(ear);
    }
    // Ekor menjuntai, sedikit melengkung ke atas.
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.35, 6), bodyMat);
    tail.rotation.z = -Math.PI / 3.2;
    tail.position.set(-0.42, 0.44, 0);
    group.add(tail);
    const legs = addLegs(group, bodyMat, 0.075, 0.36, 0.2, 0.17, 0.18);
    legsList.push(...legs);
  } else if (category === 'rabbit_blocky') {
    // Kelinci gaya Minecraft/voxel: SEMUA bagian pakai BoxGeometry
    // (kotak), bukan bentuk organik melengkung. Proporsi tetap mengacu
    // dokumen (badan gemuk, telinga panjang, kaki belakang lebih
    // besar), tapi digambar blocky/kotak-kotak sesuai permintaan.
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.34, 0.36), bodyMat);
    body.position.y = 0.28;
    group.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.24, 0.24), bodyMat);
    head.position.set(0.32, 0.42, 0);
    group.add(head);
    // Telinga panjang berbentuk balok tipis menjuntai ke atas-belakang.
    for (const side of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.4, 0.08), earMat);
      ear.position.set(0.28, 0.68, side * 0.09);
      ear.rotation.z = side * 0.1;
      group.add(ear);
      const earInner = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.32, 0.04), pinkMat);
      earInner.position.set(0.28 + side * 0.015, 0.68, side * 0.09);
      earInner.rotation.z = side * 0.1;
      group.add(earInner);
    }
    // Ekor kotak kecil di belakang.
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), bodyMat);
    tail.position.set(-0.26, 0.26, 0);
    group.add(tail);
    // Kaki kotak — belakang lebih besar/panjang dari depan (ciri dokumen).
    const frontLegs = [];
    for (const side of [-1, 1]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.16, 0.09), bodyMat);
      leg.position.set(0.14, 0.08, side * 0.13);
      leg.userData.isLeg = true;
      group.add(leg);
      frontLegs.push(leg);
    }
    const backLegs = [];
    for (const side of [-1, 1]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.24, 0.13), bodyMat);
      leg.position.set(-0.16, 0.12, side * 0.15);
      leg.userData.isLeg = true;
      group.add(leg);
      backLegs.push(leg);
    }
    legsList.push(...frontLegs, ...backLegs);
  } else if (category === 'cow_blocky') {
    // Sapi gaya Minecraft: badan balok besar, kepala balok di depan,
    // moncong, telinga & tanduk kecil, corak bercak hitam-putih (khas
    // sapi Minecraft) ditempel sebagai kotak-kotak kecil di permukaan.
    const spotMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9, flatShading: true });

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.5, 0.42), bodyMat);
    body.position.y = 0.5;
    group.add(body);
    // Bercak-bercak (patches) khas corak sapi, ditempel sedikit menonjol
    // dari permukaan badan supaya terlihat jelas (bukan coplanar/z-fighting).
    const patchPositions = [
      [0.15, 0.58, 0.211], [-0.2, 0.42, 0.211], [0.3, 0.35, -0.211], [-0.1, 0.6, -0.211],
    ];
    for (const [px, py, pz] of patchPositions) {
      const patch = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.01), spotMat);
      patch.position.set(px, py, pz);
      group.add(patch);
    }
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.32, 0.28), bodyMat);
    head.position.set(0.58, 0.56, 0);
    group.add(head);
    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.24), new THREE.MeshStandardMaterial({ color: 0xf5c8a0, roughness: 0.9 }));
    snout.position.set(0.74, 0.46, 0);
    group.add(snout);
    // Telinga kotak kecil di samping kepala.
    for (const side of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, 0.12), bodyMat);
      ear.position.set(0.55, 0.72, side * 0.16);
      group.add(ear);
    }
    // Tanduk kecil.
    const hornMat = new THREE.MeshStandardMaterial({ color: 0xe8e0d0, roughness: 0.7 });
    for (const side of [-1, 1]) {
      const horn = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, 0.04), hornMat);
      horn.position.set(0.62, 0.76, side * 0.1);
      group.add(horn);
    }
    // Ekor kotak tipis menjuntai ke bawah.
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, 0.06), bodyMat);
    tail.position.set(-0.45, 0.42, 0);
    group.add(tail);
    // Kaki balok tebal, 4 kaki standar.
    const legs = addLegs(group, bodyMat, 0.09, 0.42, 0.32, 0.15, 0.28);
    legsList.push(...legs);
  } else if (category === 'penguin_blocky') {
    // Pinguin gaya Minecraft/voxel: badan kotak hitam dengan perut putih
    // (kotak putih ditempel di depan), kepala kotak, paruh & kaki oranye,
    // sayap kecil menyamping (bukan buat terbang, cuma dekorasi/berenang).
    const bellyMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.8, flatShading: true });
    const beakMat = new THREE.MeshStandardMaterial({ color: 0xff8c1a, roughness: 0.6 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 0.28), bodyMat);
    body.position.y = 0.35;
    group.add(body);
    const belly = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.36, 0.02), bellyMat);
    belly.position.set(0, 0.32, 0.145);
    group.add(belly);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.24, 0.24), bodyMat);
    head.position.set(0, 0.68, 0);
    group.add(head);
    const beak = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.14), beakMat);
    beak.position.set(0, 0.66, 0.19);
    group.add(beak);
    // Sayap kecil menempel di samping badan (flipper, bukan sayap terbang).
    for (const side of [-1, 1]) {
      const flipper = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, 0.16), bodyMat);
      flipper.position.set(side * 0.2, 0.36, 0);
      flipper.rotation.z = side * 0.15;
      group.add(flipper);
    }
    // Kaki kotak kecil oranye.
    for (const side of [-1, 1]) {
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.06, 0.16), beakMat);
      foot.position.set(side * 0.08, 0.06, 0.06);
      foot.userData.isLeg = true;
      group.add(foot);
      legsList.push(foot);
    }
  } else if (category === 'hamster_shape') {
    // Hamster (dokumen 2D): "sangat kecil, bulat, gemuk, seperti bola",
    // "telinga kecil bulat tegak", "kaki sangat pendek", "ekor hampir
    // tidak terlihat". Paling kecil & paling bulat dari semua pet.
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 10), bodyMat);
    body.scale.set(1, 0.9, 1.1);
    body.position.y = 0.24;
    group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), bodyMat);
    head.position.set(0.28, 0.3, 0);
    group.add(head);
    for (const side of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), earMat);
      ear.scale.set(1, 1, 0.5);
      ear.position.set(0.32, 0.42, side * 0.13);
      group.add(ear);
    }
    const legs = addLegs(group, bodyMat, 0.04, 0.1, 0.14, 0.14, 0.1);
    legsList.push(...legs);
  } else if (category === 'dragon_blocky') {
    // Naga gaya Minecraft/voxel (permintaan khusus): SEMUA bagian pakai
    // BoxGeometry, proporsi tetap mengacu dokumen (leher, kepala
    // menonjol depan dengan tanduk, sayap kelelawar di punggung, ekor
    // panjang dengan spike), tapi bentuknya kotak-kotak, bukan organik.
    const hornMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.6 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.55, 0.5), bodyMat);
    body.position.y = 0.6;
    group.add(body);
    // Leher kotak menghubungkan badan ke kepala.
    const neck = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.4, 0.28), bodyMat);
    neck.rotation.z = -Math.PI / 6;
    neck.position.set(0.55, 0.9, 0);
    group.add(neck);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.34, 0.34), bodyMat);
    head.position.set(0.85, 1.12, 0);
    group.add(head);
    // Moncong kotak kecil menonjol ke depan.
    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.16, 0.2), bodyMat);
    snout.position.set(1.08, 1.06, 0);
    group.add(snout);
    // Tanduk kotak melengkung ke belakang, 2 tanduk.
    for (const side of [-1, 1]) {
      const horn = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.24, 0.06), hornMat);
      horn.position.set(0.9, 1.32, side * 0.1);
      horn.rotation.z = -Math.PI / 6;
      group.add(horn);
    }
    const legs = addLegs(group, bodyMat, 0.11, 0.5, 0.32, 0.24, 0.35);
    legsList.push(...legs);
    // Ekor kotak panjang dengan spike kotak di ujung.
    const tailBase = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.18, 0.18), bodyMat);
    tailBase.position.set(-0.68, 0.5, 0);
    group.add(tailBase);
    const tailSpike = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.24, 0.1), bodyMat);
    tailSpike.position.set(-1.05, 0.5, 0);
    tailSpike.rotation.z = Math.PI / 4;
    group.add(tailSpike);
    // Sayap kotak pipih ditempel di SAMPING badan bagian belakang
    // (bukan dekat leher yang sudah padat elemen lain), pivot di
    // pangkal dekat punggung, membentang lurus ke samping-atas.
    // Sebelumnya sayap ditumpuk offset Z di 2 level (pivot DAN mesh),
    // yang bikin posisi kedua sisi tidak simetris/terlihat aneh —
    // sekarang offset Z HANYA di pivot, mesh sayap cuma geser di
    // sumbu lokalnya sendiri (X, sepanjang bentangan sayap).
    const wingMat = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
    for (const side of [-1, 1]) {
      const wingPivot = new THREE.Group();
      wingPivot.position.set(-0.15, 0.75, side * 0.26); // pangkal sayap di punggung, dekat badan
      wingPivot.rotation.y = side > 0 ? -Math.PI / 5 : Math.PI / 5; // buka ke samping, simetris kedua sisi
      wingPivot.rotation.z = Math.PI / 7; // sedikit terangkat ke atas

      const wing = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.03, 0.4), wingMat);
      wing.position.set(0, 0, side * 0.22); // bentang menjauh dari badan sepanjang sumbu lokal pivot
      wingPivot.add(wing);

      wingPivot.userData.isWing = true;
      wingPivot.userData.wingSide = side;
      group.add(wingPivot);
    }
  } else if (category === 'unicorn') {
    // Unicorn tetap gaya organik (tidak diminta blocky) — badan kapsul,
    // leher, kepala, tanduk emas tunggal khas unicorn.
    const body = buildCapsuleBody(bodyMat, 0.38, 0.65);
    body.position.y = 0.6;
    group.add(body);
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.35, 8), bodyMat);
    neck.rotation.z = -Math.PI / 3.5;
    neck.position.set(0.5, 0.85, 0);
    group.add(neck);
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.42, 6), bodyMat);
    head.rotation.z = -Math.PI / 2;
    head.position.set(0.78, 1.05, 0);
    group.add(head);
    const legs = addLegs(group, bodyMat, 0.1, 0.55, 0.3, 0.26, 0.32);
    legsList.push(...legs);
    const tailBase = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.08, 0.7, 6), bodyMat);
    tailBase.rotation.z = Math.PI / 2.3;
    tailBase.position.set(-0.65, 0.42, 0);
    group.add(tailBase);
    const tailSpike = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 5), bodyMat);
    tailSpike.rotation.z = Math.PI / 2;
    tailSpike.position.set(-1.05, 0.28, 0);
    group.add(tailSpike);
    const hornMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.3 });
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.35, 6), hornMat);
    horn.position.set(0.8, 1.15, 0);
    group.add(horn);
  } else if (category === 'beetle') {
    // Kumbang: badan bulat gempal + 6 kaki kecil (disederhanakan jadi 4).
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), bodyMat);
    body.scale.set(1.2, 0.8, 1);
    body.position.y = 0.28;
    group.add(body);
    const legs = addLegs(group, bodyMat, 0.03, 0.16, 0.18, 0.16, 0.2);
    legsList.push(...legs);
  } else {
    // Fallback generik (dipakai penguin & kategori lain yang belum
    // dirinci): badan kapsul + kepala + telinga + 4 kaki standar.
    const body = buildCapsuleBody(bodyMat, 0.32, 0.5);
    body.position.y = 0.42;
    group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 8, 8), bodyMat);
    head.position.set(0.5, 0.55, 0);
    group.add(head);
    for (const side of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.16, 6), earMat);
      ear.position.set(0.55, 0.76, side * 0.13);
      group.add(ear);
    }
    const legs = addLegs(group, bodyMat, 0.07, 0.35, 0.25, 0.2, 0.2);
    legsList.push(...legs);
  }

  // Tier legendary dikasih glow (naga, unicorn dkk).
  if (pet && pet.tier === 'legendary') {
    const glowMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35, transparent: true, opacity: 0.25 });
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 8), glowMat);
    glow.position.y = 0.6;
    group.add(glow);
  }

  group.scale.setScalar(scale);
  group.userData.legs = legsList;
  group.userData.category = category;
  group.userData.isFlying = FLYING_CATEGORIES.includes(category);
  group.userData.animPhase = Math.random() * Math.PI * 2; // fase acak biar idle tidak semua serentak
  return group;
}

// ══════════════════════════════════════════
// THREE.JS SCENE — kamera orbit (pola sama Garden), grid slot kandang
// berdasarkan barnCapacity, hewan ditampilkan di tiap slot terisi.
// ══════════════════════════════════════════
let scene, camera, renderer, disposed = false;
let raycaster, slotMeshes = []; // 1 mesh alas per slot, dipakai raycast tap
let petMeshGroup = null;

const SLOT_SIZE = 3.0;
const SLOT_GAP = 0.6;
const SLOT_CELL = SLOT_SIZE + SLOT_GAP;

let orbitYaw = Math.PI / 4;
let orbitPitch = 0.75;
let orbitDistance = 22; // diperbesar dari 15 karena area sekarang lebih lebar (kandang darat + kolam ikan bersebelahan)
const MIN_ORBIT_PITCH = 0.35, MAX_ORBIT_PITCH = 1.4;
const MIN_ORBIT_DISTANCE = 6, MAX_ORBIT_DISTANCE = 45;

function updateCameraFromOrbit() {
  const x = orbitDistance * Math.sin(orbitPitch) * Math.cos(orbitYaw);
  const z = orbitDistance * Math.sin(orbitPitch) * Math.sin(orbitYaw);
  const y = orbitDistance * Math.cos(orbitPitch);
  camera.position.set(x, y, z);
  camera.lookAt(0, 0.5, 0);
}

function setupOrbitControls() {
  const canvas = document.getElementById('barnCanvas');
  let dragging = false, lastX = 0, lastY = 0, didDrag = false;

  function start(x, y) { dragging = true; didDrag = false; lastX = x; lastY = y; }
  function move(x, y) {
    if (!dragging) return;
    const dx = x - lastX, dy = y - lastY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
    lastX = x; lastY = y;
    orbitYaw += dx * 0.006;
    orbitPitch = Math.max(MIN_ORBIT_PITCH, Math.min(MAX_ORBIT_PITCH, orbitPitch - dy * 0.006));
    updateCameraFromOrbit();
  }
  function end(clientX, clientY) {
    dragging = false;
    if (!didDrag && clientX !== undefined) handleTap(clientX, clientY);
  }

  canvas.addEventListener('touchstart', e => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  canvas.addEventListener('touchmove', e => { if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  canvas.addEventListener('touchend', e => { const t = e.changedTouches[0]; end(t ? t.clientX : undefined, t ? t.clientY : undefined); });
  canvas.addEventListener('mousedown', e => start(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  window.addEventListener('mouseup', e => end(e.clientX, e.clientY));

  canvas.addEventListener('wheel', e => {
    orbitDistance = Math.max(MIN_ORBIT_DISTANCE, Math.min(MAX_ORBIT_DISTANCE, orbitDistance + e.deltaY * 0.02));
    updateCameraFromOrbit();
    e.preventDefault();
  }, { passive: false });

  let lastPinchDist = null;
  canvas.addEventListener('touchstart', e => { if (e.touches.length === 2) lastPinchDist = pinchDistance(e.touches); }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const d = pinchDistance(e.touches);
      if (lastPinchDist !== null) {
        orbitDistance = Math.max(MIN_ORBIT_DISTANCE, Math.min(MAX_ORBIT_DISTANCE, orbitDistance - (d - lastPinchDist) * 0.03));
        updateCameraFromOrbit();
      }
      lastPinchDist = d;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', e => { if (e.touches.length < 2) lastPinchDist = null; });
}
function pinchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function handleTap(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const intersects = raycaster.intersectObjects(slotMeshes, false);
  if (intersects.length > 0) {
    const { slotIndex, isFish } = intersects[0].object.userData;
    const arr = isFish ? BARN_STATE.fishPond : BARN_STATE.pets;
    if (arr[slotIndex]) openPetPanel(arr[slotIndex], isFish);
  }
}

function gridSizeForSlotCount(count) { return Math.max(1, Math.ceil(Math.sqrt(count))); }

// Kandang darat (kiri) dan kolam ikan (kanan) digambar sebagai 2 area
// bersebelahan, dikelilingi 1 pagar besar yang sama (sesuai keputusan:
// kolam ikan itu "kandang" ikan, bagian dari kandang keseluruhan, bukan
// scene terpisah).
const POND_GAP = 3; // jarak antara area kandang darat & kolam ikan

function computeLayoutSizes() {
  const petGridSize = gridSizeForSlotCount(barnCapacity);
  const petAreaSize = petGridSize * SLOT_CELL + 2;
  const fishGridSize = gridSizeForSlotCount(fishPondCapacity);
  const fishAreaSize = fishGridSize * SLOT_CELL + 2;
  return { petGridSize, petAreaSize, fishGridSize, fishAreaSize };
}

function buildBarnGround() {
  const { petAreaSize, fishAreaSize } = computeLayoutSizes();
  const totalWidth = petAreaSize + POND_GAP + fishAreaSize;
  const totalDepth = Math.max(petAreaSize, fishAreaSize);
  const petAreaCenterX = -(totalWidth / 2) + petAreaSize / 2;
  const fishAreaCenterX = (totalWidth / 2) - fishAreaSize / 2;

  // Tanah kandang darat (coklat).
  const petGeo = new THREE.PlaneGeometry(petAreaSize, totalDepth);
  const petMat = new THREE.MeshStandardMaterial({ color: 0x6b5030, roughness: 1 });
  const petGround = new THREE.Mesh(petGeo, petMat);
  petGround.rotation.x = -Math.PI / 2;
  petGround.position.set(petAreaCenterX, -0.05, 0);
  scene.add(petGround);

  // Kolam ikan (biru, sedikit lebih rendah supaya terasa seperti kolam).
  const fishGeo = new THREE.PlaneGeometry(fishAreaSize, totalDepth);
  const fishGroundMat = new THREE.MeshStandardMaterial({ color: 0x9a7a4a, roughness: 1 });
  const fishGround = new THREE.Mesh(fishGeo, fishGroundMat);
  fishGround.rotation.x = -Math.PI / 2;
  fishGround.position.set(fishAreaCenterX, -0.15, 0);
  scene.add(fishGround);
  const waterMat = new THREE.MeshStandardMaterial({ color: 0x3d7a9c, transparent: true, opacity: 0.75, roughness: 0.3 });
  const waterGeo = new THREE.PlaneGeometry(fishAreaSize - 0.6, totalDepth - 0.6);
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(fishAreaCenterX, -0.05, 0);
  scene.add(water);

  // Pagar kayu mengelilingi SELURUH area (kandang darat + kolam),
  // dengan palang horizontal (pola sama Garden/Wild Harvest).
  const fenceMat = new THREE.MeshStandardMaterial({ color: 0x8a6d3a, roughness: 0.9 });
  const halfW = totalWidth / 2, halfD = totalDepth / 2;
  const postSpacing = 3.2;
  const postHeight = 1.0;

  function addFenceSide(x1, z1, x2, z2) {
    const length = Math.sqrt((x2 - x1) ** 2 + (z2 - z1) ** 2);
    const count = Math.max(2, Math.round(length / postSpacing));
    for (let i = 0; i <= count; i++) {
      const t = i / count;
      const px = x1 + (x2 - x1) * t, pz = z1 + (z2 - z1) * t;
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, postHeight, 5), fenceMat);
      post.position.set(px, postHeight / 2, pz);
      scene.add(post);
    }
    const angle = Math.atan2(z2 - z1, x2 - x1);
    for (const railY of [0.35, 0.75]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(length, 0.09, 0.09), fenceMat);
      rail.position.set((x1 + x2) / 2, railY, (z1 + z2) / 2);
      rail.rotation.y = -angle;
      scene.add(rail);
    }
  }
  addFenceSide(-halfW, -halfD, halfW, -halfD);
  addFenceSide(-halfW, halfD, halfW, halfD);
  addFenceSide(-halfW, -halfD, -halfW, halfD);
  addFenceSide(halfW, -halfD, halfW, halfD);

  return { petAreaCenterX, fishAreaCenterX };
}

let LAYOUT_CENTERS = { petAreaCenterX: 0, fishAreaCenterX: 0 };

function slotWorldPosition(slotIndex, isFish) {
  const { petGridSize, fishGridSize } = computeLayoutSizes();
  const gridSize = isFish ? fishGridSize : petGridSize;
  const centerX = isFish ? LAYOUT_CENTERS.fishAreaCenterX : LAYOUT_CENTERS.petAreaCenterX;
  const row = Math.floor(slotIndex / gridSize);
  const col = slotIndex % gridSize;
  const offset = (gridSize - 1) / 2;
  return { x: centerX + (col - offset) * SLOT_CELL, z: (row - offset) * SLOT_CELL };
}

function rebuildBarnSlots() {
  for (const mesh of slotMeshes) scene.remove(mesh);
  slotMeshes = [];
  if (petMeshGroup) scene.remove(petMeshGroup);
  petMeshGroup = new THREE.Group();
  scene.add(petMeshGroup);

  const emptyMat = new THREE.MeshStandardMaterial({ color: 0x5a4a2e, roughness: 1, transparent: true, opacity: 0.4 });
  const filledMat = new THREE.MeshStandardMaterial({ color: 0x4a3820, roughness: 1 });
  const emptyFishMat = new THREE.MeshStandardMaterial({ color: 0x2a5a7a, roughness: 1, transparent: true, opacity: 0.3 });
  const filledFishMat = new THREE.MeshStandardMaterial({ color: 0x1a4a6a, roughness: 1 });

  function buildSlotsFor(arr, capacity, isFish) {
    for (let i = 0; i < capacity; i++) {
      const { x, z } = slotWorldPosition(i, isFish);
      const pet = arr[i];
      const mat = isFish ? (pet ? filledFishMat : emptyFishMat) : (pet ? filledMat : emptyMat);
      const y = isFish ? -0.02 : 0.12;
      const slotMesh = new THREE.Mesh(new THREE.BoxGeometry(SLOT_SIZE, 0.15, SLOT_SIZE), mat);
      slotMesh.position.set(x, y, z);
      slotMesh.userData = { slotIndex: i, isFish };
      scene.add(slotMesh);
      slotMeshes.push(slotMesh);

      if (pet) {
        const category = PET_VISUAL_CATEGORY[pet.petId] || 'pet_small';
        const isFlying = FLYING_CATEGORIES.includes(category);
        const mesh = buildPetMesh(pet.petId);
        const baseY = isFish ? 0.1 : (isFlying ? 0.25 + FLY_HEIGHT : 0.25);
        mesh.position.set(x, baseY, z);
        mesh.userData.baseY = baseY;
        mesh.userData.instanceId = pet.instanceId;
        petMeshGroup.add(mesh);
      }
    }
  }

  buildSlotsFor(BARN_STATE.pets, barnCapacity, false);
  buildSlotsFor(BARN_STATE.fishPond, fishPondCapacity, true);
}

// Animasi idle sederhana (naik-turun pelan) untuk semua hewan di kandang.
const clockStart = Date.now();
function animatePets() {
  const elapsedSec = (Date.now() - clockStart) / 1000;
  if (!petMeshGroup) return;
  for (const mesh of petMeshGroup.children) {
    const ud = mesh.userData;
    mesh.position.y = ud.baseY + Math.sin(elapsedSec * 1.6 + ud.animPhase) * 0.04;
    mesh.traverse(obj => {
      if (obj.userData.isWing) {
        const flap = ud.isFlying ? Math.sin(elapsedSec * 16 + ud.animPhase) * 0.9 : Math.sin(elapsedSec * 3 + ud.animPhase) * 0.15;
        obj.rotation.z = (obj.userData.wingSide || 1) * (Math.PI / 2.2 + flap);
      }
    });
    for (const leg of ud.legs || []) {
      leg.rotation.x = Math.sin(elapsedSec * 2 + ud.animPhase + (leg.position.x > 0 ? 0 : Math.PI)) * 0.08;
    }
  }
}

// ══════════════════════════════════════════
// PANEL AKSI HEWAN
// ══════════════════════════════════════════
function openPetPanel(pet, isFish) {
  selectedInstanceId = pet.instanceId;
  selectedIsFish = !!isFish;
  const petData = PETS[pet.petId];
  const title = document.getElementById('petPanelTitle');
  const sub = document.getElementById('petPanelSub');
  const body = document.getElementById('petPanelBody');

  title.textContent = `${petData ? petData.name : pet.petId}`;
  sub.textContent = `Happiness: ${pet.currentHappiness}/100`;
  body.innerHTML = '';

  const barWrapper = document.createElement('div');
  barWrapper.className = 'happiness-bar-wrapper';
  const barFill = document.createElement('div');
  barFill.className = 'happiness-bar-fill';
  barFill.style.width = `${pet.currentHappiness}%`;
  barWrapper.appendChild(barFill);
  body.appendChild(barWrapper);

  if (petData && petData.livestockYield && pet.pendingYield > 0) {
    const banner = document.createElement('div');
    banner.className = 'yield-banner';
    banner.innerHTML = `<span>🧺 ${pet.pendingYield}x ${petData.livestockYield.itemName} siap dipanen</span><span>+${pet.pendingYield * petData.livestockYield.sellPrice} 🐾</span>`;
    body.appendChild(banner);

    const collectBtn = document.createElement('button');
    collectBtn.className = 'action-btn';
    collectBtn.textContent = `🧺 Panen ${petData.livestockYield.itemName}`;
    collectBtn.onclick = () => doCollectYield(pet.instanceId);
    body.appendChild(collectBtn);
  }

  const feedBtn = document.createElement('button');
  feedBtn.className = 'action-btn secondary';
  feedBtn.textContent = `🍖 Beri Makan (${foodCost} 🐾)`;
  feedBtn.disabled = animalCoins < foodCost;
  feedBtn.onclick = () => doFeedPet(pet.instanceId);
  body.appendChild(feedBtn);

  const cleanBtn = document.createElement('button');
  cleanBtn.className = 'action-btn secondary';
  cleanBtn.textContent = '🧼 Bersihkan';
  cleanBtn.onclick = () => doCleanPet(pet.instanceId);
  body.appendChild(cleanBtn);

  const petBtn = document.createElement('button');
  petBtn.className = 'action-btn secondary';
  petBtn.textContent = '🤗 Elus';
  petBtn.onclick = () => doPetThePet(pet.instanceId);
  body.appendChild(petBtn);

  document.getElementById('petPanelOverlay').classList.add('show');
}
function closePetPanel() {
  document.getElementById('petPanelOverlay').classList.remove('show');
  selectedInstanceId = null;
}
window.closePetPanel = closePetPanel;

// ══════════════════════════════════════════
// AKSI — panggil server, refresh state, refresh scene & panel
// ══════════════════════════════════════════
async function refreshAfterAction(data) {
  if (data.state) BARN_STATE = data.state;
  if (data.animalCoins !== undefined) animalCoins = data.animalCoins;
  updateHud();
  rebuildBarnSlots();
}
function findPetByInstanceId(instanceId) {
  return BARN_STATE.pets.find(p => p.instanceId === instanceId)
    || BARN_STATE.fishPond.find(p => p.instanceId === instanceId);
}

async function doFeedPet(instanceId) {
  try {
    const data = await callTycoonApi('feed-pet', { instanceId });
    await refreshAfterAction(data);
    showToast('Hewan diberi makan 🍖');
    const pet = findPetByInstanceId(instanceId);
    if (pet) openPetPanel(pet, selectedIsFish);
  } catch (err) { showToast(err.message, true); }
}
async function doCleanPet(instanceId) {
  try {
    const data = await callTycoonApi('clean-pet', { instanceId });
    await refreshAfterAction(data);
    showToast('Hewan dibersihkan 🧼');
    const pet = findPetByInstanceId(instanceId);
    if (pet) openPetPanel(pet, selectedIsFish);
  } catch (err) { showToast(err.message, true); }
}
async function doPetThePet(instanceId) {
  try {
    const data = await callTycoonApi('pet-the-pet', { instanceId });
    await refreshAfterAction(data);
    showToast('Hewan senang dielus 🤗');
    const pet = findPetByInstanceId(instanceId);
    if (pet) openPetPanel(pet, selectedIsFish);
  } catch (err) { showToast(err.message, true); }
}
async function doCollectYield(instanceId) {
  try {
    const data = await callTycoonApi('collect-yield', { instanceId });
    await refreshAfterAction(data);
    closePetPanel();
    showToast(`Panen! +${data.earnedAnimalCoins} Animal Coin (${data.yieldCount}x ${data.yieldName})`);
  } catch (err) { showToast(err.message, true); }
}
async function doUpgradeBarn() {
  try {
    const data = await callTycoonApi('upgrade-barn');
    animalCoins = data.animalCoins;
    const levelData = barnLevels[data.state.level];
    barnCapacity = levelData.pets;
    fishPondCapacity = levelData.fishPondCapacity;
    BARN_STATE.level = data.state.level;
    updateHud();
    LAYOUT_CENTERS = buildBarnGround(); // ukuran area berubah, gambar ulang ground+pagar
    rebuildBarnSlots();
    updateCameraFromOrbit();
    showToast('Kandang berhasil di-upgrade! 🏠');
  } catch (err) { showToast(err.message, true); }
}
window.doUpgradeBarn = doUpgradeBarn;

// ══════════════════════════════════════════
// HUD
// ══════════════════════════════════════════
function updateHud() {
  document.getElementById('hudAnimalCoin').textContent = animalCoins;
  document.getElementById('hudCapacity').textContent = `🏠 Slot: ${BARN_STATE.pets.length}/${barnCapacity}`;
  document.getElementById('hudFishCapacity').textContent = `🐟 Kolam: ${BARN_STATE.fishPond.length}/${fishPondCapacity}`;
  updateUpgradeButton();
}
function updateUpgradeButton() {
  const btn = document.getElementById('upgradeBtn');
  const nextLevel = (BARN_STATE.level || 1) + 1;
  const nextLevelData = barnLevels ? barnLevels[nextLevel] : null;
  if (!nextLevelData) {
    btn.textContent = '🏠 Kandang Level Maksimal';
    btn.disabled = true;
  } else {
    btn.textContent = `⬆️ Upgrade ke Level ${nextLevel} (${nextLevelData.upgradeCost} 🐾)`;
    btn.disabled = animalCoins < nextLevelData.upgradeCost;
  }
}

// ══════════════════════════════════════════
// GAME LOOP & INIT
// ══════════════════════════════════════════
function animate() {
  if (disposed) return;
  requestAnimationFrame(animate);
  animatePets();
  renderer.render(scene, camera);
}

function disposeScene() {
  if (disposed || !renderer) return;
  disposed = true;
  scene.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => m.dispose());
    }
  });
  const glExt = renderer.getContext().getExtension('WEBGL_lose_context');
  if (glExt) glExt.loseContext();
  renderer.dispose();
}
window.addEventListener('beforeunload', disposeScene);

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf0d8a8);
  scene.fog = new THREE.Fog(0xf0d8a8, 18, 55);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('barnCanvas'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  raycaster = new THREE.Raycaster();

  const hemi = new THREE.HemisphereLight(0xffffff, 0x5a4028, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff4d8, 0.9);
  sun.position.set(10, 20, 8);
  scene.add(sun);

  LAYOUT_CENTERS = buildBarnGround();
  rebuildBarnSlots();
  updateCameraFromOrbit();
  setupOrbitControls();
  updateHud();

  window.addEventListener('resize', () => {
    if (disposed) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById('loadingOverlay').style.display = 'none';
  animate();
}

(async function init() {
  const member = getCurrentMember();
  if (!member) {
    document.getElementById('loadingOverlay').textContent = '⚠️ Silakan login dulu untuk membuka Kandangku.';
    return;
  }

  try {
    const data = await callTycoonApi('get-petbarn-state');
    BARN_STATE = data.state;
    PETS = data.pets;
    foodCost = data.foodCost;
    barnCapacity = data.barnCapacity;
    fishPondCapacity = data.fishPondCapacity;
    barnLevels = data.barnLevels;
    animalCoins = data.animalCoins;
  } catch (err) {
    document.getElementById('loadingOverlay').textContent = `❌ Gagal memuat kandang: ${err.message}`;
    return;
  }

  initScene();

  if (BARN_STATE.pets.length === 0) {
    showToast('Kandang masih kosong, coba tangkap hewan dulu!');
  }
})();
</script>
