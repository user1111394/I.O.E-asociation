<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch a Pet — I.O.E Hub</title>
<script src="js/ioe-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a1410;
    color: #e8f0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #worldCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(10,20,16,0.85), transparent);
  }
  header h1 {
    font-size: 1rem;
    background: linear-gradient(90deg,#ffb84d,#ff5aa0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .exit-btn {
    font-size: 0.75rem; font-weight: 700; color: #d8e8c8;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 12px; border-radius: 20px; cursor: pointer;
  }

  .status-hud {
    position: fixed; top: 54px; left: 14px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .status-chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700;
    backdrop-filter: blur(4px);
  }
  .status-chip.biome-chip { border-color: rgba(255,184,77,0.5); color: #ffd8a0; }
  .status-chip.durability-low { border-color: rgba(255,120,80,0.6); color: #ff9878; }
  .status-chip.running { border-color: rgba(255,90,90,0.6); color: #ff9090; }

  .barn-btn {
    position: fixed; top: 54px; right: 14px; z-index: 10;
    font-size: 0.72rem; font-weight: 700; color: #1a1408;
    background: linear-gradient(90deg,#ffb84d,#ff8a3d);
    border: none; padding: 7px 13px; border-radius: 20px; cursor: pointer;
  }

  /* ── Joystick virtual + tombol Lari ── */
  .joystick-zone {
    position: fixed; bottom: 30px; left: 24px; z-index: 20;
    width: 110px; height: 110px;
    touch-action: none;
  }
  .joystick-base {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
  }
  .joystick-knob {
    position: absolute; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,184,77,0.4); border: 1px solid rgba(255,184,77,0.7);
    top: 32px; left: 32px;
    transition: top 0.05s, left 0.05s;
  }
  .run-toggle-btn {
    position: fixed; bottom: 150px; left: 42px; z-index: 20;
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(255,90,90,0.15); border: 2px solid rgba(255,90,90,0.4);
    color: #ff9090; font-weight: 800; font-size: 0.7rem; cursor: pointer;
  }
  .run-toggle-btn.active {
    background: rgba(255,90,90,0.5); border-color: rgba(255,90,90,0.9); color: #fff;
  }

  /* ── Tombol Tangkap — muncul saat dekat hewan yang bisa dicoba tangkap ── */
  .catch-btn {
    position: fixed; bottom: 42px; right: 24px; z-index: 20;
    padding: 14px 22px; border: none; border-radius: 14px;
    background: linear-gradient(90deg,#ffb84d,#ff5aa0);
    color: #1a1408; font-weight: 800; font-size: 0.85rem; cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,184,77,0.4);
    display: none;
  }
  .catch-btn.visible { display: block; }
  .catch-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── QTE overlay: jarum bergerak di bar, tekan pas di zona hijau ── */
  .qte-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 60;
    padding: 20px;
  }
  .qte-overlay.show { display: flex; }
  .qte-card {
    background: linear-gradient(160deg, #1c2a18, #0f1810);
    border: 1px solid rgba(255,184,77,0.4);
    border-radius: 20px; padding: 24px 20px; max-width: 340px; width: 100%;
    text-align: center;
  }
  .qte-title { font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
  .qte-sub { font-size: 0.78rem; color: #b8c8a8; margin-bottom: 20px; }
  .qte-bar-wrapper {
    position: relative; height: 36px; background: rgba(255,255,255,0.08);
    border-radius: 18px; overflow: hidden; margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .qte-green-zone {
    position: absolute; top: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(122,200,80,0.5), rgba(122,200,80,0.7));
    border-left: 2px solid #7ac850; border-right: 2px solid #7ac850;
  }
  .qte-needle {
    position: absolute; top: 0; bottom: 0; width: 4px;
    background: #ffd23f; box-shadow: 0 0 8px rgba(255,210,63,0.8);
  }
  .qte-tap-btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: linear-gradient(90deg,#7ac850,#4a9d4a);
    color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer;
  }

  /* ── Overlay hasil tangkap ── */
  .catch-result-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center; z-index: 60;
    padding: 20px;
  }
  .catch-result-overlay.show { display: flex; }
  .catch-result-card {
    background: linear-gradient(160deg, #1c2a18, #0f1810);
    border: 1px solid rgba(255,184,77,0.4);
    border-radius: 20px; padding: 26px 20px; max-width: 320px; width: 100%;
    text-align: center;
  }
  .catch-result-icon { font-size: 3rem; margin-bottom: 8px; }
  .catch-result-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
  .catch-result-sub { font-size: 0.82rem; color: #b8c8a8; margin-bottom: 20px; }
  .catch-result-close-btn {
    width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: linear-gradient(90deg,#ffb84d,#ff8a3d);
    color: #1a1408; font-weight: 800; cursor: pointer;
  }

  /* ── Overlay alat rusak ── */
  .tool-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .tool-overlay.show { display: flex; }
  .tool-card {
    background: linear-gradient(160deg, #2a2210, #12100a);
    border: 1px solid rgba(255,184,77,0.4);
    border-radius: 16px; padding: 22px; max-width: 320px; width: 100%;
    text-align: center;
  }
  .tool-card h2 { font-size: 1.05rem; margin-bottom: 10px; }
  .tool-card p { font-size: 0.82rem; margin-bottom: 18px; line-height: 1.6; color: #d8c8a8; }
  .tool-card-actions { display: flex; flex-direction: column; gap: 8px; }
  .tool-btn {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: linear-gradient(90deg,#ffb84d,#ff8a3d);
    color: #1a1408; font-weight: 800; cursor: pointer;
  }
  .tool-btn.secondary {
    background: rgba(255,255,255,0.1); color: #d8e8c8;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .loading-overlay {
    position: fixed; inset: 0; background: #0a1410;
    display: flex; align-items: center; justify-content: center; z-index: 200;
    color: #b8c8a8; font-size: 0.85rem; text-align: center; padding: 24px; line-height: 1.6;
  }

  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    z-index: 30; pointer-events: none;
    background: rgba(0,0,0,0.75); border: 1px solid rgba(255,184,77,0.5);
    padding: 10px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 700;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    text-align: center; color: #ffd8a0;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>

<body>

<div class="loading-overlay" id="loadingOverlay">Memasuki Pawlandia...</div>

<canvas id="worldCanvas"></canvas>

<header>
  <h1>🐾 Catch a Pet</h1>
  <button class="exit-btn" onclick="exitToHub()">✕ Keluar</button>
</header>

<button class="barn-btn" onclick="goToPetBarn()">🏠 Kandangku</button>

<div class="status-hud">
  <div class="status-chip biome-chip" id="hudBiome">📍 —</div>
  <div class="status-chip">🐾 Animal Coin: <span id="hudAnimalCoin">0</span></div>
  <div class="status-chip" id="hudDurability">🪢 Durability: —</div>
</div>

<div class="joystick-zone" id="joystickZone">
  <div class="joystick-base"></div>
  <div class="joystick-knob" id="joystickKnob"></div>
</div>

<button class="run-toggle-btn" id="runToggleBtn" onclick="toggleRun()">🏃 LARI</button>

<button class="catch-btn" id="catchBtn" onclick="startCatchAttempt()">🪢 Tangkap</button>

<div class="qte-overlay" id="qteOverlay">
  <div class="qte-card">
    <div class="qte-title" id="qteTitle">Tangkap Hewan!</div>
    <div class="qte-sub" id="qteSub">Tekan tombol pas jarum di zona hijau</div>
    <div class="qte-bar-wrapper">
      <div class="qte-green-zone" id="qteGreenZone"></div>
      <div class="qte-needle" id="qteNeedle"></div>
    </div>
    <button class="qte-tap-btn" onclick="tapQte()">TEKAN!</button>
  </div>
</div>

<div class="catch-result-overlay" id="catchResultOverlay">
  <div class="catch-result-card">
    <div class="catch-result-icon" id="catchResultIcon">🎉</div>
    <div class="catch-result-title" id="catchResultTitle">Berhasil!</div>
    <div class="catch-result-sub" id="catchResultSub"></div>
    <button class="catch-result-close-btn" onclick="closeCatchResultOverlay()">Tutup</button>
  </div>
</div>

<div class="tool-overlay" id="toolOverlay">
  <div class="tool-card">
    <h2 id="toolCardTitle">🪢 Alat Rusak</h2>

    <div class="tool-card-actions">
      <button class="tool-btn" onclick="doRepairTool()">🔧 Perbaiki Alat</button>
      <button class="tool-btn" onclick="doUpgradeTool()">⬆️ Upgrade Alat</button>
      <button class="tool-btn secondary" onclick="closeToolOverlay()">Tutup</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function exitToHub() { window.location.href = 'game.html'; }
function goToPetBarn() { window.location.href = 'petbarn.html'; }

function getCurrentMember() {
  const session = (typeof getIoeSession === 'function') ? getIoeSession() : null;
  if (!session || !session.memberId || !session.sessionToken) return null;
  return { memberId: session.memberId, sessionToken: session.sessionToken };
}

async function callTycoonApi(action, extra = {}) {
  const member = getCurrentMember();
  if (!member) throw new Error('Silakan login dulu');
  const res = await fetch('/api/tycoon', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, memberId: member.memberId, sessionToken: member.sessionToken, ...extra }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Gagal memproses permintaan');
  return data;
}

let toastTimeout = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 1600);
}

// ══════════════════════════════════════════
// STATE GLOBAL DARI SERVER
// ══════════════════════════════════════════
let SERVER_STATE = null;   // { spawns, toolTier, toolDurability }
let BIOMES = null;
let PETS = null;
let TOOL_TIERS = null;
let TOOL_UPGRADE_COST = null;
let GREEN_ZONE_WIDTH = null;
let NEEDLE_SPEED = null;
let FLEE_RADIUS_ON_RUN = 12;
let WORLD_RADIUS_MIN = 15;
let WORLD_RADIUS_MAX = 260;
let animalCoins = 0;

// Layout spawn HARUS identik dengan PET_SPAWN_LAYOUT di tycoon.js
// (5 bioma x 6 spot = 30, ID format "{biomeId}_{index}"), posisi 3D
// diturunkan dari ID lewat PRNG seeded (bukan dikirim server), sama
// persis pola digSpotWorldPosition di wildharvest.html.
function seededRandom(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}
function biomeAngleRange(biomeId) {
  const b = BIOMES[biomeId];
  return [b.angleStart, b.angleEnd];
}
function petSpawnWorldPosition(spotId) {
  const [biomeId, idxStr] = spotId.split('_');
  const idx = Number(idxStr);
  const [angleStart, angleEnd] = biomeAngleRange(biomeId);
  const seedBase = spotId.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const angleFrac = (idx + 0.5) / 6 + (seededRandom(seedBase * 3.1) - 0.5) * 0.15;
  const angleDeg = angleStart + angleFrac * (angleEnd - angleStart);
  const angleRad = (angleDeg * Math.PI) / 180;
  const distFrac = 0.25 + seededRandom(seedBase * 7.7) * 0.7;
  const dist = WORLD_RADIUS_MIN + distFrac * (WORLD_RADIUS_MAX - WORLD_RADIUS_MIN);
  return { x: Math.cos(angleRad) * dist, z: Math.sin(angleRad) * dist };
}

function biomeAtPosition(x, z) {
  let angleDeg = (Math.atan2(z, x) * 180) / Math.PI;
  if (angleDeg < 0) angleDeg += 360;
  for (const [biomeId, b] of Object.entries(BIOMES)) {
    if (angleDeg >= b.angleStart && angleDeg < b.angleEnd) return biomeId;
  }
  return Object.keys(BIOMES)[0];
}

// ══════════════════════════════════════════
// THREE.JS SCENE — terrain di-reuse dari pola Wild Harvest (gelombang +
// gundukan + tekstur per bioma) TANPA sungai (tidak relevan buat area
// tangkap hewan, dan mengurangi kompleksitas dunia kedua ini).
// ══════════════════════════════════════════
let scene, camera, renderer, disposed = false;
let player = { x: 0, z: 0, rotationY: 0, lookPitch: 0 };
const PLAYER_WALK_SPEED = 0.15;
const PLAYER_RUN_SPEED = 0.32; // lari lebih cepat TAPI bikin hewan sekitar kabur
const PLAYER_TURN_SPEED = 0.04;
const EYE_HEIGHT = 1.6;
const SWIPE_YAW_SENSITIVITY = 0.0045;
const SWIPE_PITCH_SENSITIVITY = 0.0035;
const MIN_PITCH = -0.9, MAX_PITCH = 0.9;
const CATCH_INTERACT_RADIUS_BUFFER = 0; // pakai catchRadius alat langsung, tanpa buffer tambahan

let petMeshes = {}; // { spotId: THREE.Group }
let nearestCatchableSpotId = null;
let isRunning = false;
let lastFleeCheckAt = 0;
const FLEE_CHECK_INTERVAL_MS = 600; // throttle panggilan flee-nearby-pets biar tidak spam API tiap frame

// Gundukan tanah seeded tetap (pola sama Wild Harvest, TANPA sungai).
const TERRAIN_MOUNDS = [];
(function seedMounds() {
  for (let i = 0; i < 45; i++) {
    const angle = (i / 45) * Math.PI * 2 + i * 0.9;
    const dist = WORLD_RADIUS_MIN + (i % 9) * (WORLD_RADIUS_MAX - WORLD_RADIUS_MIN) / 9;
    TERRAIN_MOUNDS.push({
      localX: Math.cos(angle) * dist, localY: Math.sin(angle) * dist,
      radius: 10 + (i % 4) * 8,
      height: (i % 3 === 0 ? -1 : 1) * (1.2 + (i % 5) * 0.6),
    });
  }
})();
function moundHeight(localX, localY) {
  let h = 0;
  for (const m of TERRAIN_MOUNDS) {
    const d = Math.sqrt((localX - m.localX) ** 2 + (localY - m.localY) ** 2);
    if (d < m.radius) {
      const t = d / m.radius;
      h += m.height * (0.5 + 0.5 * Math.cos(t * Math.PI));
    }
  }
  return h;
}
function getSurfaceHeightAt(localX, localY) {
  const dist = Math.sqrt(localX * localX + localY * localY);
  const rolling = Math.sin(localX * 0.02) * Math.cos(localY * 0.025) * 2.2;
  const noise = Math.sin(localX * 0.15 + localY * 0.1) * 0.25;
  const mounds = moundHeight(localX, localY);
  const flattenSpawn = Math.min(1, Math.max(0, (dist - 8) / 12));
  return (rolling + noise + mounds) * flattenSpawn;
}
function getWorldSurfaceHeightAt(worldX, worldZ) {
  return getSurfaceHeightAt(worldX, -worldZ);
}

function biomeColorAtAngle(angleDeg) {
  const entries = Object.values(BIOMES);
  for (const b of entries) {
    const mid = (b.angleStart + b.angleEnd) / 2;
    const halfWidth = (b.angleEnd - b.angleStart) / 2;
    const distFromMid = Math.abs(((angleDeg - mid + 540) % 360) - 180);
    if (distFromMid <= halfWidth) {
      const edgeFactor = Math.max(0, (halfWidth - distFromMid) / halfWidth);
      return { color: b.color, blend: edgeFactor };
    }
  }
  return { color: entries[0].color, blend: 1 };
}
function biomeBlendAtAngle(angleDeg) {
  const entries = Object.entries(BIOMES);
  for (const [biomeId, b] of entries) {
    const mid = (b.angleStart + b.angleEnd) / 2;
    const halfWidth = (b.angleEnd - b.angleStart) / 2;
    const distFromMid = Math.abs(((angleDeg - mid + 540) % 360) - 180);
    if (distFromMid <= halfWidth) {
      const edgeFactor = Math.max(0, Math.min(1, (halfWidth - distFromMid) / (halfWidth * 0.35)));
      return { biomeId, blend: edgeFactor };
    }
  }
  return { biomeId: entries[0][0], blend: 1 };
}
function drawBiomeMotif(ctx, biomeId, x, y, rand) {
  switch (biomeId) {
    case 'meadow': {
      const shade = 130 + rand() * 60;
      ctx.fillStyle = `rgba(${shade*0.6},${shade},${shade*0.5},0.5)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.02) { ctx.fillStyle = 'rgba(255,240,180,0.6)'; ctx.fillRect(x, y, 2, 2); }
      break;
    }
    case 'forest': {
      const shade = 60 + rand() * 40;
      ctx.fillStyle = `rgba(${shade*0.5},${shade},${shade*0.5},0.55)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.04) { ctx.fillStyle = 'rgba(110,80,40,0.5)'; ctx.fillRect(x, y, 3, 3); }
      break;
    }
    case 'coast': {
      const shade = 200 + rand() * 40;
      ctx.fillStyle = `rgba(${shade},${shade*0.92},${shade*0.72},0.5)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.015) { ctx.fillStyle = 'rgba(140,140,140,0.4)'; ctx.fillRect(x, y, 2, 2); }
      break;
    }
    case 'snow': {
      const shade = 230 + rand() * 25;
      ctx.fillStyle = `rgba(${shade},${shade},${shade+6},0.5)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.01) { ctx.fillStyle = 'rgba(180,220,240,0.4)'; ctx.fillRect(x, y, 3, 1); }
      break;
    }
    case 'highlands': {
      const shade = 100 + rand() * 45;
      ctx.fillStyle = `rgba(${shade},${shade*0.55},${shade*0.35},0.55)`;
      ctx.fillRect(x, y, 2, 2);
      if (rand() < 0.015) { ctx.fillStyle = 'rgba(200,90,40,0.35)'; ctx.fillRect(x, y, 2, 2); }
      break;
    }
    default: {
      ctx.fillStyle = 'rgba(120,120,120,0.4)';
      ctx.fillRect(x, y, 2, 2);
    }
  }
}
function createWorldGroundTexture() {
  const canvasSize = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = canvasSize; canvas.height = canvasSize;
  const ctx = canvas.getContext('2d');

  const imgData = ctx.createImageData(canvasSize, canvasSize);
  const center = canvasSize / 2;
  for (let py = 0; py < canvasSize; py++) {
    for (let px = 0; px < canvasSize; px++) {
      const dx = px - center, dy = py - center;
      let angleDeg = (Math.atan2(dy, dx) * 180) / Math.PI;
      if (angleDeg < 0) angleDeg += 360;
      const { color } = biomeColorAtAngle(angleDeg);
      const c = new THREE.Color(color);
      const idx = (py * canvasSize + px) * 4;
      imgData.data[idx] = c.r * 255;
      imgData.data[idx + 1] = c.g * 255;
      imgData.data[idx + 2] = c.b * 255;
      imgData.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);

  const dotCount = 90000;
  for (let i = 0; i < dotCount; i++) {
    const rSeed = i * 3.7;
    const angle = seededRandom(rSeed) * Math.PI * 2;
    const radiusFrac = Math.sqrt(seededRandom(rSeed * 1.3));
    const px = center + Math.cos(angle) * radiusFrac * center;
    const py = center + Math.sin(angle) * radiusFrac * center;
    let angleDeg = (angle * 180) / Math.PI;
    if (angleDeg < 0) angleDeg += 360;
    const { biomeId } = biomeBlendAtAngle(angleDeg);
    let localSeed = rSeed * 7.1;
    const rand = () => { localSeed += 1; return seededRandom(localSeed); };
    drawBiomeMotif(ctx, biomeId, px, py, rand);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.ClampToEdgeWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  return texture;
}
function buildTerrain() {
  const size = WORLD_RADIUS_MAX * 2.15;
  const segments = 180;
  const geo = new THREE.PlaneGeometry(size, size, segments, segments);
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, getSurfaceHeightAt(x, y));
    uv.setXY(i, (x / size) + 0.5, (y / size) + 0.5);
  }
  geo.attributes.uv.needsUpdate = true;
  geo.computeVertexNormals();

  const groundTexture = createWorldGroundTexture();
  const mat = new THREE.MeshStandardMaterial({ map: groundTexture, roughness: 1 });
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
}
function buildSky() {
  scene.background = new THREE.Color(0xaee0f5);
  scene.fog = new THREE.Fog(0xaee0f5, 40, WORLD_RADIUS_MAX * 0.85);
}
function scatterDecorations() {
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 1 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x4a9a4a, roughness: 0.9, flatShading: true });
  const decoCount = 160;
  for (let i = 0; i < decoCount; i++) {
    const seed = i * 4.4;
    const angle = seededRandom(seed) * Math.PI * 2;
    const dist = WORLD_RADIUS_MIN + seededRandom(seed * 1.7) * (WORLD_RADIUS_MAX - WORLD_RADIUS_MIN - 5);
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    const y = getWorldSurfaceHeightAt(x, z);
    const scale = 2.4 + seededRandom(seed * 2.3) * 2.2;
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * scale, 0.26 * scale, 4.5 * scale, 6), trunkMat);
    trunk.position.y = 2.25 * scale;
    group.add(trunk);
    const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(2.0 * scale, 0), leafMat);
    leaves.position.y = 4.8 * scale;
    group.add(leaves);
    group.position.set(x, y, z);
    scene.add(group);
  }
}

// ══════════════════════════════════════════
// PET MESH — direpresentasikan sebagai bentuk primitif sederhana
// (bukan model .FBX custom), warna sesuai spesies dari data server.
// Semua hewan pakai bentuk dasar sama (badan oval + kepala bulat +
// telinga kecil) supaya konsisten & ringan, dibedakan lewat warna dan
// skala saja — cukup untuk representasi visual tanpa perlu model
// artstyle spesifik per 20 spesies.
// ══════════════════════════════════════════
function buildPetMesh(petId) {
  const pet = PETS[petId];
  const color = pet ? pet.color : 0x888888;
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, flatShading: true });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.5, 4, 8), bodyMat);
  body.rotation.z = Math.PI / 2;
  body.position.y = 0.4;
  group.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), bodyMat);
  head.position.set(0.55, 0.55, 0);
  group.add(head);

  const earMat = new THREE.MeshStandardMaterial({ color, roughness: 0.85 });
  for (const side of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.18, 6), earMat);
    ear.position.set(0.6, 0.78, side * 0.14);
    group.add(ear);
  }

  // Tier legendary dikasih sedikit glow biar terasa spesial (naga, unicorn dkk).
  if (pet && pet.tier === 'legendary') {
    const glowMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35, transparent: true, opacity: 0.3 });
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), glowMat);
    glow.position.y = 0.5;
    group.add(glow);
  }

  return group;
}

function rebuildPetMeshes() {
  for (const mesh of Object.values(petMeshes)) scene.remove(mesh);
  petMeshes = {};

  for (const [spotId, spot] of Object.entries(SERVER_STATE.spawns)) {
    const isPresent = spot.fledAt === null || Date.now() >= spot.fledAt;
    if (!isPresent) continue;

    const pet = PETS[spot.petId];
    if (!pet) continue;
    const { x, z } = petSpawnWorldPosition(spotId);
    const y = getWorldSurfaceHeightAt(x, z);

    const mesh = buildPetMesh(spot.petId);
    mesh.position.set(x, y, z);
    mesh.userData = { spotId, petId: spot.petId, baseY: y };
    scene.add(mesh);
    petMeshes[spotId] = mesh;
  }
}

// ══════════════════════════════════════════
// JOYSTICK VIRTUAL (pola sama persis Wild Harvest)
// ══════════════════════════════════════════
let joystickActive = false;
let joystickDir = { x: 0, y: 0 };

function setupJoystick() {
  const zone = document.getElementById('joystickZone');
  const knob = document.getElementById('joystickKnob');
  const maxDist = 32;

  function handleMove(clientX, clientY) {
    const rect = zone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    let dx = clientX - centerX, dy = clientY - centerY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    knob.style.left = `${32 + dx}px`;
    knob.style.top = `${32 + dy}px`;
    joystickDir.x = dx / maxDist;
    joystickDir.y = dy / maxDist;
  }
  function resetKnob() {
    knob.style.left = '32px'; knob.style.top = '32px';
    joystickDir.x = 0; joystickDir.y = 0;
    joystickActive = false;
  }

  zone.addEventListener('touchstart', e => { joystickActive = true; handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  zone.addEventListener('touchmove', e => { if (joystickActive) handleMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  zone.addEventListener('touchend', resetKnob);
  zone.addEventListener('touchcancel', resetKnob);

  zone.addEventListener('mousedown', e => { joystickActive = true; handleMove(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if (joystickActive) handleMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', resetKnob);
}

function toggleRun() {
  isRunning = !isRunning;
  document.getElementById('runToggleBtn').classList.toggle('active', isRunning);
}
window.toggleRun = toggleRun;

// ══════════════════════════════════════════
// PLAYER MOVEMENT & KAMERA (identik pola Wild Harvest: tank-style +
// swipe look-around, X ikut memutar badan, Y murni pitch kamera)
// ══════════════════════════════════════════
function updatePlayerPosition() {
  if (joystickDir.x !== 0) player.rotationY -= joystickDir.x * PLAYER_TURN_SPEED;
  if (joystickDir.y !== 0) {
    const speed = isRunning ? PLAYER_RUN_SPEED : PLAYER_WALK_SPEED;
    const moveAmount = -joystickDir.y * speed;
    const moveX = Math.sin(player.rotationY) * moveAmount;
    const moveZ = Math.cos(player.rotationY) * moveAmount;
    const nextX = player.x + moveX;
    const nextZ = player.z + moveZ;
    const nextDist = Math.sqrt(nextX * nextX + nextZ * nextZ);
    if (nextDist < WORLD_RADIUS_MAX - 3) { player.x = nextX; player.z = nextZ; }
  }
}
function updateCamera() {
  const groundY = getWorldSurfaceHeightAt(player.x, player.z);
  const eyeY = groundY + EYE_HEIGHT;
  camera.position.set(player.x, eyeY, player.z);
  const lookX = player.x + Math.sin(player.rotationY) * Math.cos(player.lookPitch);
  const lookZ = player.z + Math.cos(player.rotationY) * Math.cos(player.lookPitch);
  const lookY = eyeY + Math.sin(player.lookPitch);
  camera.lookAt(lookX, lookY, lookZ);
}

let swipeActive = false;
let lastSwipeX = 0, lastSwipeY = 0;
function isInsideJoystickZone(x, y) {
  const zone = document.getElementById('joystickZone');
  const rect = zone.getBoundingClientRect();
  const margin = 20;
  return x >= rect.left - margin && x <= rect.right + margin && y >= rect.top - margin && y <= rect.bottom + margin;
}
function setupSwipeLook() {
  const canvas = document.getElementById('worldCanvas');
  function onStart(x, y) { if (isInsideJoystickZone(x, y)) return; swipeActive = true; lastSwipeX = x; lastSwipeY = y; }
  function onMove(x, y) {
    if (!swipeActive) return;
    const dx = x - lastSwipeX, dy = y - lastSwipeY;
    lastSwipeX = x; lastSwipeY = y;
    player.rotationY -= dx * SWIPE_YAW_SENSITIVITY;
    player.lookPitch = Math.max(MIN_PITCH, Math.min(MAX_PITCH, player.lookPitch - dy * SWIPE_PITCH_SENSITIVITY));
  }
  function onEnd() { swipeActive = false; }

  canvas.addEventListener('touchstart', e => { const t = e.touches[0]; onStart(t.clientX, t.clientY); }, { passive: true });
  canvas.addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
  canvas.addEventListener('touchend', onEnd);
  canvas.addEventListener('touchcancel', onEnd);
  canvas.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);
}

// ══════════════════════════════════════════
// DETEKSI HEWAN TERDEKAT — tombol Tangkap muncul kalau ada hewan dalam
// catchRadius alat SAAT INI (bukan radius tetap, karena tiap tier alat
// beda jangkauan, sesuai dokumen "Jenis Lasso (Upgrade)").
// ══════════════════════════════════════════
function updateNearestCatchableSpot() {
  const tool = TOOL_TIERS[SERVER_STATE.toolTier];
  let nearest = null;
  let nearestDist = Infinity;
  for (const [spotId, mesh] of Object.entries(petMeshes)) {
    const dx = player.x - mesh.position.x;
    const dz = player.z - mesh.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < tool.catchRadius && dist < nearestDist) { nearest = spotId; nearestDist = dist; }
  }
  nearestCatchableSpotId = nearest;
  document.getElementById('catchBtn').classList.toggle('visible', !!nearest);
}

// ══════════════════════════════════════════
// LARI -> KABURKAN HEWAN SEKITAR. Di-throttle (tidak tiap frame) supaya
// tidak spam API. Posisi player & posisi tiap spot dikirim ke server
// supaya server yang validasi jarak (anti-cheat), klien cuma memicu
// pengecekan.
// ══════════════════════════════════════════
async function checkFleeFromRunning() {
  if (!isRunning) return;
  const now = Date.now();
  if (now - lastFleeCheckAt < FLEE_CHECK_INTERVAL_MS) return;
  lastFleeCheckAt = now;

  const spotPositions = {};
  for (const spotId of Object.keys(petMeshes)) {
    const { x, z } = petSpawnWorldPosition(spotId);
    spotPositions[spotId] = { x, z };
  }
  if (Object.keys(spotPositions).length === 0) return;

  try {
    const data = await callTycoonApi('flee-nearby-pets', { playerX: player.x, playerZ: player.z, spotPositions });
    if (data.fledCount > 0) {
      SERVER_STATE = data.state;
      rebuildPetMeshes();
      showToast(`${data.fledCount} hewan kabur karena kamu berlari!`);
    }
  } catch (err) {
    // Diamkan error flee check (bukan aksi kritikal), tidak perlu toast tiap gagal.
  }
}

function updateBiomeHud() {
  const biomeId = biomeAtPosition(player.x, player.z);
  const biome = BIOMES[biomeId];
  document.getElementById('hudBiome').textContent = `📍 ${biome.name}`;
}
function updateHud() {
  document.getElementById('hudAnimalCoin').textContent = animalCoins;
  const tierData = TOOL_TIERS[SERVER_STATE.toolTier];
  const durability = SERVER_STATE.toolDurability;
  const durabilityChip = document.getElementById('hudDurability');
  const durabilityText = durability === Infinity ? '∞' : `${durability}/${tierData.maxDurability}`;
  durabilityChip.textContent = `🪢 ${tierData.name}: ${durabilityText}`;
  const isLow = durability !== Infinity && durability <= tierData.maxDurability * 0.2;
  durabilityChip.classList.toggle('durability-low', isLow);
}

// ══════════════════════════════════════════
// QTE TANGKAP — jarum bergerak bolak-balik 0-100, zona hijau di tengah
// dengan lebar sesuai tier hewan (makin langka makin sempit). Player
// tekan tombol; kalau posisi jarum saat itu ada di dalam zona hijau,
// dianggap berhasil. Ditentukan KLIEN (real-time timing), tapi server
// tetap validasi semua yang bisa dicurangi (lihat attempt-catch).
// ══════════════════════════════════════════
let qteAnimationId = null;
let qteNeedlePos = 0;
let qteDirection = 1;
let qteGreenZoneStart = 0, qteGreenZoneEnd = 0;
let qteActiveSpotId = null;
let qteResolved = false;

function startCatchAttempt() {
  if (!nearestCatchableSpotId) return;
  qteActiveSpotId = nearestCatchableSpotId;
  qteResolved = false;

  const petId = petMeshes[qteActiveSpotId].userData.petId;
  const pet = PETS[petId];
  const zoneWidth = GREEN_ZONE_WIDTH[pet.tier];
  qteGreenZoneStart = 50 - zoneWidth / 2;
  qteGreenZoneEnd = 50 + zoneWidth / 2;
  qteNeedlePos = 0;
  qteDirection = 1;

  document.getElementById('qteTitle').textContent = `Tangkap ${pet.name}!`;
  const greenZoneEl = document.getElementById('qteGreenZone');
  greenZoneEl.style.left = `${qteGreenZoneStart}%`;
  greenZoneEl.style.width = `${zoneWidth}%`;

  document.getElementById('qteOverlay').classList.add('show');
  const speed = NEEDLE_SPEED[pet.tier];
  animateQteNeedle(speed);
}

function animateQteNeedle(speed) {
  function step() {
    if (qteResolved) return;
    qteNeedlePos += qteDirection * speed;
    if (qteNeedlePos >= 100) { qteNeedlePos = 100; qteDirection = -1; }
    if (qteNeedlePos <= 0) { qteNeedlePos = 0; qteDirection = 1; }
    document.getElementById('qteNeedle').style.left = `${qteNeedlePos}%`;
    qteAnimationId = requestAnimationFrame(step);
  }
  step();
}

async function tapQte() {
  if (qteResolved) return;
  qteResolved = true;
  if (qteAnimationId) cancelAnimationFrame(qteAnimationId);
  document.getElementById('qteOverlay').classList.remove('show');

  const success = qteNeedlePos >= qteGreenZoneStart && qteNeedlePos <= qteGreenZoneEnd;
  await finalizeCatchAttempt(qteActiveSpotId, success);
}
window.tapQte = tapQte;

async function finalizeCatchAttempt(spotId, qteSuccess) {
  const catchBtn = document.getElementById('catchBtn');
  catchBtn.disabled = true;
  try {
    const data = await callTycoonApi('attempt-catch', { spotId, playerX: player.x, playerZ: player.z, qteSuccess });
    SERVER_STATE = data.state;
    updateHud();
    rebuildPetMeshes();
    updateNearestCatchableSpot();

    const petId = data.petId;
    const pet = petId ? PETS[petId] : null;

    if (data.barnFull) {
      showCatchResult(false, null, data.message);
    } else if (data.caught) {
      showCatchResult(true, pet, null);
    } else {
      showCatchResult(false, null, 'Hewan berhasil kabur! Coba lagi lain kali.');
    }

    if (data.toolDurability === 0) {
      openToolOverlay();
    }
  } catch (err) {
    if (/alat/i.test(err.message) && /rusak|durability|cukup kuat/i.test(err.message)) {
      openToolOverlay(err.message);
    } else {
      showToast(err.message);
    }
  } finally {
    catchBtn.disabled = false;
  }
}

function showCatchResult(success, pet, customMsg) {
  const overlay = document.getElementById('catchResultOverlay');
  const icon = document.getElementById('catchResultIcon');
  const title = document.getElementById('catchResultTitle');
  const sub = document.getElementById('catchResultSub');

  if (success && pet) {
    icon.textContent = '🎉';
    title.textContent = 'Berhasil Ditangkap!';
    sub.textContent = `${pet.name} sekarang ada di kandangmu.`;
  } else {
    icon.textContent = '💨';
    title.textContent = 'Gagal!';
    sub.textContent = customMsg || 'Hewan berhasil kabur.';
  }
  overlay.classList.add('show');
}
function closeCatchResultOverlay() {
  document.getElementById('catchResultOverlay').classList.remove('show');
}
window.closeCatchResultOverlay = closeCatchResultOverlay;

// ══════════════════════════════════════════
// OVERLAY ALAT RUSAK
// ══════════════════════════════════════════
function openToolOverlay(customMsg) {
  const overlay = document.getElementById('toolOverlay');
  const msg = document.getElementById('toolCardMsg');
  msg.textContent = customMsg || 'Alat tangkap kamu sudah habis durability-nya. Perbaiki atau upgrade dulu sebelum bisa menangkap lagi.';
  overlay.classList.add('show');
}
function closeToolOverlay() { document.getElementById('toolOverlay').classList.remove('show'); }
window.closeToolOverlay = closeToolOverlay;

async function doRepairTool() {
  try {
    const data = await callTycoonApi('repair-catch-tool');
    SERVER_STATE = data.state;
    animalCoins = data.animalCoins;
    updateHud();
    closeToolOverlay();
  } catch (err) { showToast(err.message); }
}
window.doRepairTool = doRepairTool;

async function doUpgradeTool() {
  try {
    const data = await callTycoonApi('upgrade-catch-tool');
    SERVER_STATE = data.state;
    animalCoins = data.animalCoins;
    updateHud();
    closeToolOverlay();
  } catch (err) { showToast(err.message); }
}
window.doUpgradeTool = doUpgradeTool;

// ══════════════════════════════════════════
// GAME LOOP & INIT
// ══════════════════════════════════════════
function animate() {
  if (disposed) return;
  requestAnimationFrame(animate);
  updatePlayerPosition();
  updateCamera();
  updateNearestCatchableSpot();
  updateBiomeHud();
  checkFleeFromRunning();
  renderer.render(scene, camera);
}

function disposeScene() {
  if (disposed || !renderer) return;
  disposed = true;
  scene.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => m.dispose());
    }
  });
  const glExt = renderer.getContext().getExtension('WEBGL_lose_context');
  if (glExt) glExt.loseContext();
  renderer.dispose();
}
window.addEventListener('beforeunload', disposeScene);

function initScene() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, WORLD_RADIUS_MAX * 1.3);
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('worldCanvas'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  buildSky();
  const hemi = new THREE.HemisphereLight(0xffffff, 0x5a4028, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff4d8, 0.8);
  sun.position.set(60, 100, 40);
  scene.add(sun);

  buildTerrain();
  scatterDecorations();
  rebuildPetMeshes();

  setupJoystick();
  setupSwipeLook();
  updateHud();
  updateBiomeHud();

  window.addEventListener('resize', () => {
    if (disposed) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById('loadingOverlay').style.display = 'none';
  animate();
}

(async function init() {
  const member = getCurrentMember();
  if (!member) {
    document.getElementById('loadingOverlay').textContent = '⚠️ Silakan login dulu untuk memasuki Pawlandia.';
    return;
  }

  try {
    const data = await callTycoonApi('get-catchpet-state');
    SERVER_STATE = data.state;
    BIOMES = data.biomes;
    PETS = data.pets;
    TOOL_TIERS = data.toolTiers;
    TOOL_UPGRADE_COST = data.toolUpgradeCost;
    GREEN_ZONE_WIDTH = data.greenZoneWidth;
    NEEDLE_SPEED = data.needleSpeed;
    FLEE_RADIUS_ON_RUN = data.fleeRadiusOnRun;
    WORLD_RADIUS_MIN = data.worldRadiusMin;
    WORLD_RADIUS_MAX = data.worldRadiusMax;
    animalCoins = data.animalCoins;
  } catch (err) {
    document.getElementById('loadingOverlay').textContent = `❌ Gagal memuat dunia: ${err.message}`;
    return;
  }

  initScene();
})();
</script>
