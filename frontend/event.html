<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event — I.O.E Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 20% 10%, #1a1f3a 0%, #0a0a12 60%);
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 14px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  header .logo { font-size: 1rem; }
  header h1 {
    font-size: 0.9rem;
    background: linear-gradient(90deg,#7b5cff,#00c2ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .event-tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 8px 12px; flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .event-tabs::-webkit-scrollbar { display: none; }
  .event-tab {
    flex-shrink: 0;
    padding: 6px 12px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 600;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #a0aec0; cursor: pointer;
    white-space: nowrap;
  }
  .event-tab.active {
    background: rgba(123,92,255,0.2);
    border-color: rgba(123,92,255,0.5);
    color: #fff;
  }
  .event-stage {
    flex: 1; position: relative; overflow: hidden;
  }
  .empty-state {
    text-align: center; padding: 60px 20px; color: #718096;
  }
  .empty-state .icon { font-size: 2.6rem; margin-bottom: 10px; }
  .event-panel {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
  }
  .event-panel.active { display: flex; }
  .event-panel iframe {
    flex: 1; width: 100%; border: none; display: block; background: #000;
  }
  .challenge-fallback {
    flex: 1; display: flex; align-items: center; justify-content: center;
    text-align: center; color: #a0aec0; font-size: 0.85rem; padding: 30px 16px;
  }
  .loading { text-align: center; padding: 60px 20px; color: #718096; }
</style>
</head>
<body>

<header>
  <span class="logo">🌌</span>
  <h1 id="headerTitle">Event I.O.E Hub</h1>
</header>

<div id="eventTabs" class="event-tabs" style="display:none;"></div>

<div class="event-stage">
  <div id="eventStage" class="loading">Memuat event...</div>
</div>

<script type="module">
  // Config Firebase khusus Event (sama dengan yang dipakai di nav.js superadmin panel)
  const EVENT_FIREBASE_CONFIG = {
    apiKey:            "AIzaSyCvIFCwWaH7r8i-8AeqTK2jE5YjMcBhJsg",
    authDomain:        "storage-event-a5d18.firebaseapp.com",
    databaseURL:       "https://storage-event-a5d18-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "storage-event-a5d18",
    messagingSenderId: "432915436521",
    appId:             "1:432915436521:web:384ff16175eb45e46c3178"
  };

  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getDatabase, ref, get, remove } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');

  const app = initializeApp(EVENT_FIREBASE_CONFIG);
  const db = getDatabase(app);

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let activeEventId = null;

  function switchEvent(eventId) {
    activeEventId = eventId;
    document.querySelectorAll('.event-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.eventId === eventId);
    });
    document.querySelectorAll('.event-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.eventId === eventId);
    });
    const activeEv = window._eventsCache.find(e => e.id === eventId);
    document.getElementById('headerTitle').textContent = activeEv ? activeEv.title : 'Event I.O.E Hub';
  }
  window.switchEvent = switchEvent;

  function renderEvents(events) {
    window._eventsCache = events;
    const stageEl = document.getElementById('eventStage');
    const tabsEl = document.getElementById('eventTabs');

    if (events.length === 0) {
      tabsEl.style.display = 'none';
      tabsEl.innerHTML = '';
      document.getElementById('headerTitle').textContent = 'Event I.O.E Hub';
      stageEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">🌠</div>
          <p>Belum ada event yang berlangsung.<br>Pantengin terus ya!</p>
        </div>`;
      return;
    }

    // Tab switcher hanya muncul kalau event aktif lebih dari 1
    if (events.length > 1) {
      tabsEl.style.display = 'flex';
      tabsEl.innerHTML = events.map((ev, i) => `
        <button class="event-tab${i === 0 ? ' active' : ''}" data-event-id="${ev.id}" onclick="switchEvent('${ev.id}')">${escHtml(ev.title)}</button>
      `).join('');
    } else {
      tabsEl.style.display = 'none';
      tabsEl.innerHTML = '';
    }

    stageEl.innerHTML = events.map((ev, i) => {
      const challengeInner = ev.challengeUrl
        ? `<iframe src="/api/event-upload?view=${encodeURIComponent(ev.challengeUrl)}" loading="lazy"></iframe>`
        : `<div class="challenge-fallback">Challenge belum tersedia untuk event ini.</div>`;

      return `
        <div class="event-panel${i === 0 ? ' active' : ''}" data-event-id="${ev.id}">
          ${challengeInner}
        </div>`;
    }).join('');

    document.getElementById('headerTitle').textContent = events[0].title;
    activeEventId = events[0].id;
  }

  async function loadEvents() {
    try {
      const snap = await get(ref(db, 'events'));
      const data = snap.val();

      if (!data) { renderEvents([]); return; }

      const now = Date.now();
      const all = Object.values(data);

      // Lazy delete: bersihkan event yang sudah expired (sinkron dengan panel superadmin)
      for (const ev of all) {
        if (ev.expiresAt && ev.expiresAt < now) {
          await remove(ref(db, `events/${ev.id}`));
        }
      }

      const active = all.filter(ev => !ev.expiresAt || ev.expiresAt >= now);
      active.sort((a, b) => b.createdAt - a.createdAt);
      renderEvents(active);
    } catch (err) {
      console.error('Gagal memuat event:', err);
      document.getElementById('eventStage').innerHTML =
        '<div class="empty-state">⚠️ Gagal memuat event. Coba refresh halaman.</div>';
    }
  }

  loadEvents();
</script>

</body>
</html>
