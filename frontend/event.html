<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event — I.O.E Hub</title>
<script src="js/ioe-auth.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #0a0a12;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ══ Layer 1: header tetap di atas segalanya ══ */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(10,10,18,0.75);
    backdrop-filter: blur(6px);
  }
  header .logo { font-size: 1rem; }
  header h1 {
    font-size: 0.9rem;
    background: linear-gradient(90deg,#7b5cff,#00c2ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .event-tabs {
    position: fixed; top: 42px; left: 0; right: 0; z-index: 20;
    display: flex; gap: 6px; overflow-x: auto;
    padding: 8px 12px;
    background: rgba(10,10,18,0.6);
  }
  .event-tabs::-webkit-scrollbar { display: none; }
  .event-tab {
    flex-shrink: 0;
    padding: 6px 12px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 600;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #a0aec0; cursor: pointer;
    white-space: nowrap;
  }
  .event-tab.active {
    background: rgba(123,92,255,0.3);
    border-color: rgba(123,92,255,0.6);
    color: #fff;
  }

  .empty-state { text-align: center; padding: 90px 20px 20px; color: #718096; }
  .empty-state .icon { font-size: 2.6rem; margin-bottom: 10px; }
  .loading { text-align: center; padding: 90px 20px 20px; color: #718096; }

  /* ══ Layer 2: panggung event, satu per event, ditumpuk penuh layar ══ */
  .event-panel {
    display: none;
    position: fixed; inset: 0;
    align-items: center; justify-content: center;
  }
  .event-panel.active { display: flex; }

  /* Background.jpg — mengisi penuh layar, paling belakang */
  .event-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* Bingkai border + isi quest — TIDAK memenuhi layar, di tengah, supaya
     Background.jpg tetap terlihat di pinggirnya.
     Ukuran: aspect-ratio ASLI Border.png diisi JS (applyBorderAspectRatio) ke
     `aspect-ratio` inline dan `--ar`. Lebar dihitung dari --ar dan batas tinggi
     (--max-h), BUKAN dari max-height, supaya wrapper tidak pernah terpotong dan
     border/mask/isi selalu pas satu sama lain (tidak melar/gepeng). */
  .quest-frame-wrap {
    --max-h: min(72vh, 640px);
    position: relative;
    z-index: 1;
    width: min(84vw, 420px, calc(var(--max-h) * var(--ar, 0.5625)));
    aspect-ratio: 9 / 16;               /* cadangan; diganti inline oleh JS */
    margin: 0;                           /* dipusatkan oleh padding panel (lihat bawah) */
  }
  /* Panel menyisakan ruang header di atas (dan bar preview di bawah); papan dipusatkan di sisanya. */
  .event-panel { padding-top: 56px; }
  body.has-tabs .event-panel { padding-top: 98px; }
  /* Tanpa maskot: papan lebih besar dan tepat di tengah area. */
  .event-panel.no-mascot .quest-frame-wrap { --max-h: min(76vh, 680px); }
  /* Dengan maskot: sisakan strip bawah; maskot sedikit menimpa sudut kiri-bawah papan. */
  .event-panel.has-mascot .quest-frame-wrap {
    --max-h: min(62vh, 600px);
    margin-bottom: 19vh;
  }
  .event-panel.has-mascot .quest-scroll { padding-bottom: 8vh; } /* kartu terakhir bisa digulir lewat dari maskot */
  body.is-preview .event-panel { padding-bottom: 64px; }

  /* Isi papan (questBgUrl). Selalu SOLID: ada warna dasar kertas. Cadangan (sebelum/jika
     lubang Border.png gagal dideteksi): persegi rounded di area aman default. Setelah
     lubang terdeteksi (fitBoardToHole), class .masked memakai mask berbentuk lubang itu. */
  .quest-frame-bg {
    position: absolute; inset: 0;
    background-color: #d9c3a0;
    background-size: cover;
    background-position: center;
    clip-path: inset(var(--hole-t, 12%) var(--hole-r, 10%) var(--hole-b, 12%) var(--hole-l, 10%) round 10px);
  }
  .quest-frame-bg.masked {
    clip-path: none;
    -webkit-mask-image: var(--board-mask);
    mask-image: var(--board-mask);
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }

  /* Daftar quest: flex kolom di dalam area aman lubang (variabel --hole-* diukur dari
     Border.png; default = angka lama 12%/10%). Scrollbar disembunyikan. */
  .quest-scroll {
    position: absolute;
    top: var(--hole-t, 12%); right: var(--hole-r, 10%);
    bottom: var(--hole-b, 12%); left: var(--hole-l, 10%);
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    display: flex; flex-direction: column; gap: 10px;
    padding: 6px 4px;
  }
  .quest-scroll::-webkit-scrollbar { display: none; }

  /* Border.png — hiasan bingkai, paling depan, klik-tembus */
  .quest-frame-border {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    z-index: 2;
  }

  /* ══ Kartu quest: kertas/kayu SOLID ══ */
  .quest-card {
    background: #f4ebd9;
    color: #333;
    border: 2px solid #b08d57;
    border-radius: 12px;
    padding: 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 0 #8a6a3b, 0 6px 12px rgba(0,0,0,0.35);
  }
  .quest-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .quest-num {
    width: 26px; height: 26px; border-radius: 50%;
    background: #a8321f; color: #fff4dc;
    border: 2px solid #6b4423;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
  }
  .quest-title { font-size: 0.82rem; font-weight: 700; color: #3b2a14; }
  .quest-input {
    width: 100%; padding: 9px 10px; margin-bottom: 8px;
    background: #fffaf0; border: 1px solid #c9b48a;
    border-radius: 8px; color: #333; font-size: 0.75rem;
  }
  /* Tautan/tombol/teks bantu di dalam kartu punya warna inline untuk tema gelap lama;
     di kertas dipaksa kontras tinggi. */
  .quest-card a.quest-input, .quest-card button.quest-input {
    color: #1d4ed8 !important; background: #fff7e6 !important; border: 1px solid #c9b48a !important;
  }
  .quest-card div.quest-input { color: #5a4a32 !important; background: #fff7e6 !important; }
  .quest-btn-row { display: flex; gap: 8px; }
  .quest-btn {
    flex: 1; padding: 10px; border: none; border-radius: 8px;
    background: linear-gradient(180deg,#3f8f63,#2f6f4e);
    box-shadow: 0 2px 0 #1f4a34;
    color: #fff; font-weight: 700; font-size: 0.78rem; cursor: pointer;
  }
  .quest-btn:disabled { opacity: 1; cursor: not-allowed; box-shadow: none; }
  .quest-btn.claimed { background: #d9efdf; color: #1e6b3f; }
  .quest-btn.pending { background: #fff0c2; color: #8a6100; }
  .quest-btn.locked  { background: #e8e0cf; color: #8c8372; }
  .quest-status { font-size: 0.7rem; margin-top: 6px; min-height: 14px; font-weight: 600; }
  .quest-file-label {
    display: block; width: 100%; padding: 9px 10px; margin-bottom: 8px;
    background: #fff7e6; border: 1px dashed #b08d57;
    border-radius: 8px; color: #6b5a3e; font-size: 0.72rem; text-align: center;
    cursor: pointer;
  }

  /* Judul/deskripsi/koin event: pita kayu + kertas, terbaca di atas isi papan apa pun */
  .event-title-label {
    text-align: center; font-size: 0.85rem; font-weight: 800; color: #fff4dc;
    background: #6b4423; border: 2px solid #4a2e16; border-radius: 10px;
    padding: 8px 10px; flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
  }
  .event-desc {
    font-size: 0.72rem; color: #4a3a22; background: rgba(244,235,217,0.95);
    border-radius: 8px; padding: 6px 8px; text-align: center; flex-shrink: 0;
  }
  .event-coin-label {
    align-self: center; font-size: 0.72rem; font-weight: 700; color: #5a3d00;
    background: #ffd23f; border: 2px solid #b8860b; border-radius: 999px;
    padding: 4px 12px; flex-shrink: 0;
  }

  /* ══ Maskot (Model A): kiri-bawah, sedikit menimpa papan; bubble di kanannya ══ */
  .mascot-area {
    position: absolute; left: 8px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    z-index: 5;
    display: flex; align-items: flex-end; gap: 6px;
    max-width: calc(100vw - 16px);
    pointer-events: none;               /* tidak menghalangi ketukan di quest di belakangnya */
  }
  body.is-preview .mascot-area { bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); }
  .mascot-img {
    height: min(30vh, 280px); width: auto; max-width: 46vw; object-fit: contain; object-position: left bottom;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    animation: mascot-bob 2.8s ease-in-out infinite;
  }
  .mascot-emoji {
    font-size: min(20vh, 140px); line-height: 1;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    animation: mascot-bob 2.8s ease-in-out infinite;
  }
  .mascot-bubble {
    position: relative; margin-bottom: min(9vh, 70px);
    background: #fffaf0; color: #3b2a14;
    border: 2px solid #b08d57; border-radius: 14px;
    padding: 9px 12px; font-size: 0.78rem; line-height: 1.38; font-weight: 600;
    max-width: min(calc(100vw - 46vw - 32px), 240px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  .mascot-bubble::before {            /* ekor bubble menunjuk ke maskot */
    content: ''; position: absolute; left: -9px; bottom: 12px;
    border: 7px solid transparent; border-right-color: #b08d57; border-left: 0;
  }
  @keyframes mascot-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* ══ Minigame (modal) ══ */
  .mg-overlay {
    position: fixed; inset: 0; z-index: 10000;
    background: rgba(5,5,12,0.84);
    display: flex; align-items: center; justify-content: center; padding: 12px;
  }
  .mg-card {
    width: min(94vw, 440px); background: #f4ebd9; color: #333;
    border: 3px solid #b08d57; border-radius: 18px; padding: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  .mg-head { display: flex; align-items: center; gap: 10px; }
  .mg-title { flex: 1; font-weight: 800; font-size: 0.95rem; color: #3b2a14; }
  .mg-time { font-weight: 800; font-size: 0.95rem; color: #a8321f; min-width: 64px; text-align: right; }
  .mg-close {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid #b08d57;
    background: #fff7e6; color: #6b4423; font-size: 0.9rem; font-weight: 800; cursor: pointer;
  }
  .mg-bar { height: 8px; border-radius: 99px; background: #d9c3a0; margin-top: 8px; overflow: hidden; }
  .mg-bar-fill { height: 100%; width: 100%; background: #2f6f4e; }
  .mg-info { font-size: 0.78rem; font-weight: 600; color: #5a4a32; margin-top: 8px; text-align: center; min-height: 18px; }
  .mg-area {
    position: relative; width: 100%; height: min(56vh, 420px); margin-top: 8px;
    background: repeating-linear-gradient(45deg,#ecdfc4,#ecdfc4 12px,#e5d6b6 12px,#e5d6b6 24px);
    border: 2px solid #c9b48a; border-radius: 12px; overflow: hidden;
    touch-action: manipulation;
  }
  .mg-target {
    position: absolute; width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.1rem; line-height: 1; border: 0; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; user-select: none;
    animation: mg-pop 0.25s ease-out;
  }
  .mg-target.hit { animation: mg-hit 0.18s ease-in forwards; pointer-events: none; }
  .mg-result {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(244,235,217,0.92); font-size: 1.4rem; font-weight: 800; color: #3b2a14;
    text-align: center; padding: 12px;
  }
  @keyframes mg-pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes mg-hit { to { transform: scale(1.6); opacity: 0; } }
  .mg-result { z-index: 10; }
  .mg-result.msg { font-size: 1rem; line-height: 1.4; }
  /* water-tree */
  .wt-scene {
    position: absolute; inset: 0; z-index: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 16px;
    background: linear-gradient(#1c3557, #2f5d8c 65%, #3f77a8); /* langit malam: salju putih tetap terlihat */
  }
  .wt-tree { position: relative; z-index: 1; font-size: 6.5rem; line-height: 1; margin-bottom: 14px; }
  .wt-tree.grow { animation: wt-grow 0.8s ease-out; }
  .wt-can { z-index: 2; position: absolute; top: 8%; left: 56%; font-size: 3.2rem; line-height: 1; transform-origin: 80% 20%; }
  .wt-scene.pouring .wt-can { animation: wt-tilt 1.5s ease-in-out; }
  .wt-drops span { z-index: 2; position: absolute; top: 26%; font-size: 1.5rem; opacity: 0; }
  .wt-drops span:nth-child(1) { left: 50%; } .wt-drops span:nth-child(2) { left: 53%; animation-delay: 0.15s; } .wt-drops span:nth-child(3) { left: 47%; animation-delay: 0.3s; }
  .wt-scene.pouring .wt-drops span { animation: wt-drop 0.5s ease-in infinite; }
  .wt-scene.pouring .wt-drops span:nth-child(2) { animation-delay: 0.15s; } .wt-scene.pouring .wt-drops span:nth-child(3) { animation-delay: 0.3s; }
  .wt-btn { position: relative; z-index: 2; padding: 12px 28px; border-radius: 999px; border: 2px solid #1d4ed8; background: linear-gradient(#60a5fa,#2563eb); color: #fff; font-weight: 800; font-size: 1rem; box-shadow: 0 3px 0 #1e3a8a; cursor: pointer; }
  .wt-btn:disabled { opacity: 0.6; cursor: default; }
  @keyframes wt-tilt { 0% { transform: rotate(0); } 20%, 80% { transform: rotate(-35deg); } 100% { transform: rotate(0); } }
  @keyframes wt-drop { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(105px); opacity: 0; } }
  @keyframes wt-grow { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* ══ Salju (murni CSS, ringan: hanya transform + opacity) ══ */
  .snow-layer { position: absolute; inset: 0; z-index: 3; overflow: hidden; pointer-events: none; }
  .snowflake {
    position: absolute; top: 0; line-height: 1; opacity: 0;
    will-change: transform;
    animation: snow-fall 7s linear infinite;  /* durasi/delay/ukuran/--sway diacak lewat style inline */
  }
  @keyframes snow-fall {
    0%   { transform: translate3d(0, -14px, 0); opacity: 0; }
    8%   { opacity: 0.95; }
    25%  { transform: translate3d(var(--sway, 14px), 105px, 0); }
    50%  { transform: translate3d(calc(var(--sway, 14px) * -1), 220px, 0); }
    75%  { transform: translate3d(var(--sway, 14px), 330px, 0); }
    100% { transform: translate3d(0, 440px, 0); opacity: 0; }
  }
  /* Tumpukan salju di dasar: gradasi putih -> transparan, bentuk tidak simetris (radius oval + 2 gundukan) */
  .snow-pile {
    position: absolute; left: -4%; right: -4%; bottom: 0; height: 96px; z-index: 0;
    background: linear-gradient(to top, #ffffff 0%, #eef4ff 60%, rgba(255,255,255,0) 100%);
    border-radius: 55% 45% 0 0 / 100% 90% 0 0;
    pointer-events: none;
  }
  .snow-pile::before, .snow-pile::after {
    content: ''; position: absolute; bottom: 0;
    background: linear-gradient(to top, #ffffff, rgba(255,255,255,0));
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }
  .snow-pile::before { left: 8%;  width: 34%; height: 78%; }
  .snow-pile::after  { right: 5%; width: 40%; height: 88%; }
  @media (prefers-reduced-motion: reduce) { .snowflake { display: none; } }

  /* ══ Panel Pohon Natal ══ */
  .xmas-fab {
    position: absolute; right: 12px; top: 64px; z-index: 20;
    padding: 9px 14px; border-radius: 999px; border: 2px solid #b8860b;
    background: linear-gradient(#ffe27a, #f5b82e); color: #5a3d00;
    font-weight: 800; font-size: 0.8rem; cursor: pointer;
    box-shadow: 0 3px 0 #8a6100, 0 6px 12px rgba(0,0,0,0.35);
  }
  body.has-tabs .xmas-fab { top: 106px; }
  .xmas-card { text-align: center; }
  .xmas-tree { font-size: 5.5rem; line-height: 1.1; margin: 8px 0 2px; }
  .xmas-tree.grow { animation: wt-grow 0.8s ease-out; }
  .xmas-orn { min-height: 22px; font-size: 0.9rem; letter-spacing: 2px; }
  .xmas-stats { font-weight: 800; color: #3b2a14; font-size: 0.9rem; margin-top: 4px; }
  .xmas-gift { font-weight: 700; color: #8a6100; font-size: 0.82rem; min-height: 20px; margin-top: 6px; }
  .xmas-msg { font-size: 0.78rem; font-weight: 700; min-height: 36px; margin-top: 6px; color: #5a4a32; }
  .xmas-msg.err { color: #c0392b; }
  .xmas-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .xmas-btn {
    padding: 12px; border: 0; border-radius: 10px; font-weight: 800; font-size: 0.9rem; color: #fff; cursor: pointer;
    background: linear-gradient(#3f8f63, #2f6f4e); box-shadow: 0 2px 0 #1f4a34;
  }
  .xmas-btn.alt { background: linear-gradient(#c0392b, #a02a1f); box-shadow: 0 2px 0 #6e1b13; }
  .xmas-btn:disabled { opacity: 0.5; box-shadow: none; cursor: not-allowed; }
  .wt-btn.done { background: linear-gradient(#3f8f63, #2f6f4e); border-color: #1f6b3c; box-shadow: 0 3px 0 #1f4a34; }
  .xmas-btn.gift { background: linear-gradient(#f5b82e, #d99a14); color: #4a3200; box-shadow: 0 2px 0 #8a6100; }
  .xmas-btn[hidden] { display: none; }
  .xmas-spinner { display: inline-block; width: 14px; height: 14px; border: 3px solid #c9b48a; border-top-color: #2f6f4e; border-radius: 50%; animation: xmas-spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes xmas-spin { to { transform: rotate(360deg); } }
  .xmas-rewards { list-style: none; margin: 10px 0 14px; padding: 0; font-weight: 800; color: #3b2a14; font-size: 1rem; line-height: 1.8; }
</style>
</head>
<body>

<header>
  <span class="logo">🌌</span>
  <h1 id="headerTitle">Event I.O.E Hub</h1>
</header>

<div id="eventTabs" class="event-tabs" style="display:none;"></div>

<div id="eventStage" class="loading">Memuat event...</div>

<script type="module">
  // ── Config Firebase khusus Event (sama seperti nav.js superadmin) ──
  const EVENT_FIREBASE_CONFIG = {
    apiKey:            "AIzaSyCvIFCwWaH7r8i-8AeqTK2jE5YjMcBhJsg",
    authDomain:        "storage-event-a5d18.firebaseapp.com",
    databaseURL:       "https://storage-event-a5d18-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "storage-event-a5d18",
    messagingSenderId: "432915436521",
    appId:             "1:432915436521:web:384ff16175eb45e46c3178"
  };

  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getDatabase, ref, get, set, remove } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');

  const app = initializeApp(EVENT_FIREBASE_CONFIG);
  const db = getDatabase(app);

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── Ambil identitas member yang sedang login, pakai getIoeSession() dari
  //    js/ioe-auth.js (sudah tersedia global lewat <script> di <head>). ──
  function getCurrentMember() {
    const session = (typeof getIoeSession === 'function') ? getIoeSession() : null;
    if (!session || !session.memberId || !session.sessionToken) return null;
    return { memberId: session.memberId, sessionToken: session.sessionToken };
  }

  window._eventsCache = [];

  // Mode preview: event.html?preview={draftId} membaca draft_events/{id}, bukan events/.
  // Di mode ini klaim reward & cek status klaim dimatikan (tidak menyentuh /api/shop).
  const PREVIEW_ID = new URLSearchParams(location.search).get('preview');
  const IS_PREVIEW = !!PREVIEW_ID;

  function switchEvent(eventId) {
    document.querySelectorAll('.event-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.eventId === eventId);
    });
    document.querySelectorAll('.event-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.eventId === eventId);
    });
    const activeEv = window._eventsCache.find(e => e.id === eventId);
    document.getElementById('headerTitle').textContent = activeEv ? activeEv.title : 'Event I.O.E Hub';
  }
  window.switchEvent = switchEvent;

  // Label tombol default per tipe quest, dipakai saat quest BELUM diklaim.
  const QUEST_BUTTON_LABEL = {
    'visit':         'Kunjungi & Klaim',
    'submit-link':   'Cek & Klaim',
    'like-video':    'Kirim Bukti',
    'make-video':    'Buka TikTok & Klaim',
    'invite-friend': 'Bagikan & Klaim',
    'login-streak':  'Klaim',
    'minigame':      'Main & Klaim',
  };

  // Hari ke berapa event ini SEKARANG, dihitung dari createdAt (hari event
  // dipublikasikan admin = hari ke-1, sama untuk semua member — bukan
  // dihitung dari kapan member pertama buka event, biar konsisten).
  // Pakai floor(jam / 24) + 1 supaya "hari ke-2" mulai persis 24 jam
  // setelah event dipublikasikan, bukan ikut pergantian tanggal kalender
  // (yang bisa curang/rugi tergantung jam berapa event dipublikasikan).
  function getEventDayNumber(ev) {
    if (!ev.createdAt) return 1;
    const elapsedMs = Date.now() - ev.createdAt;
    const elapsedDays = Math.floor(elapsedMs / (24 * 60 * 60 * 1000));
    return Math.max(1, elapsedDays + 1);
  }

  function renderQuestCard(ev, quest, num, claimed) {
    const status = claimed[quest.id]; // 'approved' | 'pending' | undefined
    const isApproved = status === 'approved';
    const isPending = status === 'pending';

    const unlockDay = quest.unlockDay || 1;
    const currentDay = getEventDayNumber(ev);
    // Terkunci HANYA kalau belum pernah diklaim/pending — quest yang sudah
    // approved/pending harus tetap tampil status finalnya walau unlockDay
    // berubah admin di tengah jalan (edge case, tapi lebih aman).
    const isLocked = !isApproved && !isPending && currentDay < unlockDay;

    // Field input tambahan sesuai tipe quest — cuma tampil kalau belum
    // approved/pending DAN sudah waktunya terbuka, supaya card yang masih
    // terkunci tidak menampilkan input yang belum bisa dipakai.
    let extraField = '';
    if (!isApproved && !isPending && !isLocked) {
      if (quest.type === 'submit-link') {
        extraField = `<input type="text" class="quest-input" id="quest-link-${quest.id}" placeholder="Tempel link video kamu di sini...">`;
      } else if (quest.type === 'like-video') {
        extraField = `
          ${quest.targetLink ? `<a href="${quest.targetLink}" target="_blank" rel="noopener" class="quest-input" style="display:block; text-decoration:none; color:#00c2ff; text-align:center;">▶️ Buka video yang harus di-like</a>` : ''}
          <label class="quest-file-label" id="quest-filelabel-${quest.id}">📎 Pilih screenshot bukti like</label>
          <input type="file" accept="image/*" id="quest-file-${quest.id}" style="display:none;" onchange="handleProofFileChange('${quest.id}')">
        `;
      } else if (quest.type === 'visit' && quest.targetLink) {
        extraField = `<a href="${quest.targetLink}" target="_blank" rel="noopener" class="quest-input" style="display:block; text-decoration:none; color:#00c2ff; text-align:center;">🔗 Buka profile</a>`;
      } else if (quest.type === 'invite-friend' && ev.inviteLink) {
        extraField = `
          <div class="quest-input" style="word-break:break-all; font-size:0.68rem; color:#a0aec0;">${ev.inviteLink}</div>
          <button type="button" onclick="copyInviteLink('${ev.inviteLink}', '${quest.id}')" class="quest-input" style="cursor:pointer; color:#00c2ff; background:rgba(0,194,255,0.1); border-color:rgba(0,194,255,0.3);">📋 Salin Link & Bagikan ke WA</button>
        `;
      } else if (quest.type === 'make-video') {
        extraField = `<a href="https://www.tiktok.com/upload" target="_blank" rel="noopener" class="quest-input" style="display:block; text-decoration:none; color:#00c2ff; text-align:center;">🎬 Buka TikTok</a>`;
      }
    }

    let statusLabel;
    if (isApproved) statusLabel = doneLabel(ev, quest);
    else if (isPending) statusLabel = '⏳ Menunggu Review';
    else if (isLocked) statusLabel = `🔒 Buka di hari ke-${unlockDay}`;
    else statusLabel = (getQuestMinigame(ev, quest) ? '🎮 ' : '') + (QUEST_BUTTON_LABEL[quest.type] || 'Klaim');

    const btnClass = isApproved ? 'claimed' : (isPending ? 'pending' : (isLocked ? 'locked' : ''));
    const disabled = (isApproved || isPending || isLocked) ? 'disabled' : '';

    return `
      <div class="quest-card" data-quest-id="${quest.id}">
        <div class="quest-card-head">
          <div class="quest-num">${num}</div>
          <div class="quest-title">${escHtml(quest.title)}</div>
        </div>
        ${extraField}
        <div class="quest-btn-row">
          <button
            class="quest-btn ${btnClass}"
            id="quest-btn-${quest.id}"
            ${disabled}
            onclick="claimQuest('${ev.id}', '${quest.id}', ${quest.rewardCoin}, '${quest.type}')"
          >${statusLabel}</button>
        </div>
        <div class="quest-status" id="quest-status-${quest.id}"></div>
      </div>
    `;
  }

  // Simpan file screenshot yang dipilih member per quest, supaya bisa
  // diupload ke Cloudinary saat tombol Klaim ditekan (bukan langsung saat
  // dipilih, supaya member masih bisa ganti file sebelum submit).
  window._questProofFiles = {};

  function copyInviteLink(link, questId) {
    navigator.clipboard.writeText(link).then(() => {
      const statusEl = document.getElementById(`quest-status-${questId}`);
      if (statusEl) {
        statusEl.textContent = '✅ Link disalin! Bagikan ke temanmu lewat WhatsApp.';
        statusEl.style.color = '#00c2ff';
      }
    }).catch(() => {
      const statusEl = document.getElementById(`quest-status-${questId}`);
      if (statusEl) {
        statusEl.textContent = '⚠️ Gagal menyalin otomatis, salin manual link di atas.';
        statusEl.style.color = '#ff6b6b';
      }
    });
  }
  window.copyInviteLink = copyInviteLink;

  function handleProofFileChange(questId) {
    const input = document.getElementById(`quest-file-${questId}`);
    const label = document.getElementById(`quest-filelabel-${questId}`);
    const file = input.files && input.files[0];
    if (!file) return;
    window._questProofFiles[questId] = file;
    if (label) label.textContent = `📎 ${file.name}`;
  }
  window.handleProofFileChange = handleProofFileChange;

  // Upload screenshot bukti ke Cloudinary (unsigned) — pakai preset
  // event_poster_unsigned yang sama dengan upload poster event, supaya
  // tidak perlu bikin preset baru di Cloudinary.
  async function uploadProofImage(file) {
    const cloudForm = new FormData();
    cloudForm.append('file', file);
    cloudForm.append('upload_preset', 'event_poster_unsigned');
    const cloudRes = await fetch('https://api.cloudinary.com/v1_1/mclectmg/auto/upload', {
      method: 'POST',
      body: cloudForm,
    });
    const cloudData = await cloudRes.json();
    if (!cloudRes.ok) throw new Error(cloudData.error?.message || 'Upload screenshot gagal');
    return cloudData.secure_url;
  }

  async function claimQuestCore(eventId, questId, rewardCoin, type) {
    if (IS_PREVIEW) {
      const st = document.getElementById(`quest-status-${questId}`);
      if (st) { st.textContent = '👀 Mode preview — klaim dinonaktifkan.'; st.style.color = '#8a6100'; }
      return;
    }
    const member = getCurrentMember();
    const statusEl = document.getElementById(`quest-status-${questId}`);
    const btnEl = document.getElementById(`quest-btn-${questId}`);
    const originalLabel = btnEl.textContent;

    if (!member) {
      statusEl.textContent = '⚠️ Silakan login dulu untuk klaim reward.';
      statusEl.style.color = '#c0392b';
      return;
    }

    // Cari data quest lengkap (untuk sourceLink) dari cache event yang sudah
    // dimuat, supaya tidak perlu fetch ulang ke Firebase di sini.
    const ev = window._eventsCache.find(e => e.id === eventId);
    const quest = ev && ev.quests ? Object.values(ev.quests).find(q => q.id === questId) : null;

    let submittedLink = '';
    let proofImageUrl = '';

    if (type === 'submit-link') {
      const linkInput = document.getElementById(`quest-link-${questId}`);
      if (!linkInput || !linkInput.value.trim()) {
        statusEl.textContent = '⚠️ Tempel link video dulu sebelum klaim.';
        statusEl.style.color = '#c0392b';
        return;
      }
      submittedLink = linkInput.value.trim();
    }

    if (type === 'like-video') {
      const file = window._questProofFiles[questId];
      if (!file) {
        statusEl.textContent = '⚠️ Pilih screenshot bukti dulu sebelum kirim.';
        statusEl.style.color = '#c0392b';
        return;
      }
      btnEl.disabled = true;
      btnEl.textContent = 'Mengupload bukti...';
      statusEl.textContent = '';
      try {
        proofImageUrl = await uploadProofImage(file);
      } catch (err) {
        console.error('Gagal upload bukti:', err);
        btnEl.disabled = false;
        btnEl.textContent = originalLabel;
        statusEl.textContent = `❌ ${err.message || err}`;
        statusEl.style.color = '#c0392b';
        return;
      }
    }

    btnEl.disabled = true;
    btnEl.textContent = 'Memproses...';
    statusEl.textContent = '';

    try {
      const res = await fetch('/api/shop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'claim-quest',
          memberId: member.memberId,
          sessionToken: member.sessionToken,
          eventId, questId, rewardCoin,
          questType: type,
          submittedLink,
          sourceLink: quest ? quest.sourceLink : '',
          proofImageUrl,
          eventCreatedAt: ev ? ev.createdAt : null,
          unlockDay: quest ? (quest.unlockDay || 1) : 1,
          resetType: quest ? (quest.resetType || 'none') : 'none',
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal klaim reward');

      if (data.status === 'pending') {
        btnEl.classList.add('pending');
        btnEl.textContent = '⏳ Menunggu Review';
        statusEl.textContent = 'Terkirim! Menunggu admin cek buktinya.';
        statusEl.style.color = '#8a6100';
      } else {
        btnEl.classList.add('claimed');
        window._claimedAt[`${eventId}:${questId}`] = Date.now();
        btnEl.textContent = quest ? doneLabel({ id: eventId }, quest) : '✅ Selesai';
        statusEl.textContent = `🎉 +${rewardCoin} koin diterima!`;
        statusEl.style.color = '#1e7a4f';
      }
    } catch (err) {
      console.error('Gagal klaim quest:', err);
      btnEl.disabled = false;
      btnEl.textContent = originalLabel;
      statusEl.textContent = `❌ ${err.message || err}`;
      statusEl.style.color = '#c0392b';
    }
  }
  // Klaim: kalau quest ini termasuk targetQuestsForMinigame, pemain main minigame dulu;
  // API klaim (claimQuestCore -> /api/shop) HANYA dipanggil saat menang.
  // CATATAN: ini gerbang sisi-klien (UX). Server belum memverifikasi kemenangan minigame.
  function precheckQuest(type, questId) {
    if (type === 'submit-link') {
      const i = document.getElementById(`quest-link-${questId}`);
      if (!i || !i.value.trim()) return '⚠️ Tempel link video dulu sebelum klaim.';
    }
    if (type === 'like-video' && !window._questProofFiles[questId]) return '⚠️ Pilih screenshot bukti dulu sebelum kirim.';
    return '';
  }

  async function claimQuest(eventId, questId, rewardCoin, type) {
    const ev = window._eventsCache.find(e => e.id === eventId);
    const quest = ev && ev.quests ? Object.values(ev.quests).find(q => q.id === questId) : null;
    const mgType = getQuestMinigame(ev, quest);
    if (!mgType) return claimQuestCore(eventId, questId, rewardCoin, type);

    const statusEl = document.getElementById(`quest-status-${questId}`);
    const btnEl = document.getElementById(`quest-btn-${questId}`);
    const say = (msg, color) => { statusEl.textContent = msg; statusEl.style.color = color; };

    if (!IS_PREVIEW) {
      if (!getCurrentMember()) return say('⚠️ Silakan login dulu untuk klaim reward.', '#c0392b');
      const err = precheckQuest(type, questId); // cek input dulu, jangan sampai menang lalu gagal klaim
      if (err) return say(err, '#c0392b');
    }

    btnEl.disabled = true;
    say('🎮 Selesaikan minigame dulu ya!', '#8a6100');
    openMinigame(mgType,
      () => {
        btnEl.disabled = false;
        if (IS_PREVIEW) return say('🎮 Menang! (preview — klaim dinonaktifkan)', '#1e7a4f');
        claimQuestCore(eventId, questId, rewardCoin, type);
      },
      (reason, message) => { btnEl.disabled = false; say('😅 ' + (message || 'Belum berhasil — coba lagi!'), '#c0392b'); }
    );
  }
  window.claimQuest = claimQuest;


  // ══════════════════════════════════════
  // MASKOT + DETEKSI LUBANG BORDER + MINIGAME
  // ══════════════════════════════════════

  function renderMascot(ev) {
    const dialogue = ev.mascotDialogue ? escHtml(ev.mascotDialogue) : '';
    if (!ev.mascotUrl && !dialogue) return '';
    const fig = ev.mascotUrl
      ? `<img class="mascot-img" src="${escHtml(ev.mascotUrl)}" alt="">`
      : '<div class="mascot-emoji">🧑‍🚀</div>';
    return `<div class="mascot-area">${fig}${dialogue ? `<div class="mascot-bubble">${dialogue}</div>` : ''}</div>`;
  }
  // Gambar maskot gagal dimuat -> ganti emoji (tidak ada kotak gambar rusak)
  document.addEventListener('error', (e) => {
    const t = e.target;
    if (t && t.classList && t.classList.contains('mascot-img')) {
      const d = document.createElement('div');
      d.className = 'mascot-emoji'; d.textContent = '🧑‍🚀';
      t.replaceWith(d);
    }
  }, true);

  // Border.png biasanya bingkai dengan lubang transparan. Dulu border dipakai sebagai mask langsung
  // (isi hanya tampil di bingkai, bukan di lubang) sehingga kartu terlihat melayang. Sekarang:
  // cari lubang (area transparan tertutup yang terhubung ke tengah gambar), bentuk mask dari
  // lubang itu, dan hitung area aman persegi untuk daftar quest. Butuh CORS pada gambar
  // (Cloudinary mengizinkan); kalau gagal, CSS cadangan (persegi rounded) tetap dipakai.
  const holeCache = new Map();
  function analyzeBorderHole(url) {
    if (holeCache.has(url)) return holeCache.get(url);
    const p = new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { try { resolve(computeHole(img)); } catch (e) { console.warn('Deteksi lubang border gagal:', e); resolve(null); } };
      img.onerror = () => resolve(null);
      img.src = url;
    });
    holeCache.set(url, p);
    return p;
  }

  function computeHole(img) {
    if (!img.naturalWidth || !img.naturalHeight) return null;
    const W = 320, H = Math.max(1, Math.round(W * img.naturalHeight / img.naturalWidth));
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.drawImage(img, 0, 0, W, H);
    const data = cx.getImageData(0, 0, W, H).data; // SecurityError bila canvas tercemar -> ditangkap pemanggil
    const open = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) open[i] = data[i * 4 + 3] < 40 ? 1 : 0;

    // seed: piksel transparan terdekat dari tengah gambar
    const mx = W >> 1, my = H >> 1, maxR = Math.floor(Math.min(W, H) * 0.3);
    let seed = -1;
    for (let r = 0; r <= maxR && seed < 0; r++) {
      for (let dy = -r; dy <= r && seed < 0; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          const x = mx + dx, y = my + dy;
          if (x >= 0 && y >= 0 && x < W && y < H && open[y * W + x]) { seed = y * W + x; break; }
        }
      }
    }
    if (seed < 0) return null;

    // flood fill 4 arah
    const hole = new Uint8Array(W * H), q = new Int32Array(W * H);
    let qh = 0, qt = 0, count = 0, touchesEdge = false;
    hole[seed] = 1; q[qt++] = seed;
    while (qh < qt) {
      const p = q[qh++], x = p % W, y = (p / W) | 0;
      count++;
      if (x === 0 || y === 0 || x === W - 1 || y === H - 1) touchesEdge = true;
      if (x > 0 && open[p - 1] && !hole[p - 1]) { hole[p - 1] = 1; q[qt++] = p - 1; }
      if (x < W - 1 && open[p + 1] && !hole[p + 1]) { hole[p + 1] = 1; q[qt++] = p + 1; }
      if (y > 0 && open[p - W] && !hole[p - W]) { hole[p - W] = 1; q[qt++] = p - W; }
      if (y < H - 1 && open[p + W] && !hole[p + W]) { hole[p + W] = 1; q[qt++] = p + W; }
    }
    if (touchesEdge || count < W * H * 0.03) return null; // bukan lubang tertutup

    // kotak pembatas lubang, lalu susutkan sisi-sisinya sampai hampir penuh lubang
    // (supaya sudut membulat/ornamen tidak tertimpa kartu)
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let p = 0; p < W * H; p++) {
      if (!hole[p]) continue;
      const x = p % W, y = (p / W) | 0;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    const share = (xa, ya, xb, yb) => {
      let n = 0, tot = 0;
      for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) { tot++; n += hole[y * W + x]; }
      return n / tot;
    };
    for (let i = 0; i < 400 && x1 - x0 > 20 && y1 - y0 > 20; i++) {
      let moved = false;
      if (share(x0, y0, x1, y0) < 0.97) { y0++; moved = true; }
      if (share(x0, y1, x1, y1) < 0.97) { y1--; moved = true; }
      if (share(x0, y0, x0, y1) < 0.97) { x0++; moved = true; }
      if (share(x1, y0, x1, y1) < 0.97) { x1--; moved = true; }
      if (!moved) break;
    }

    // mask: lubang digemukkan 2 px (menyelip di bawah bingkai, jadi tidak ada celah tipis)
    const mc = document.createElement('canvas'); mc.width = W; mc.height = H;
    const mctx = mc.getContext('2d');
    const out = mctx.createImageData(W, H);
    for (let p = 0; p < W * H; p++) {
      if (!hole[p]) continue;
      const x = p % W, y = (p / W) | 0;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < W && ny < H) out.data[(ny * W + nx) * 4 + 3] = 255;
      }
    }
    mctx.putImageData(out, 0, 0);

    const pad = 2; // margin napas (%) antara kartu dan tepi bingkai
    return {
      mask: mc.toDataURL('image/png'),
      t: (y0 / H) * 100 + pad,
      b: ((H - 1 - y1) / H) * 100 + pad,
      l: (x0 / W) * 100 + pad,
      r: ((W - 1 - x1) / W) * 100 + pad,
    };
  }

  function fitBoardToHole(ev) {
    analyzeBorderHole(ev.borderShapeUrl).then((hole) => {
      if (!hole) return;
      const bg = document.getElementById(`frame-bg-${ev.id}`);
      const wrap = document.getElementById(`frame-wrap-${ev.id}`);
      if (!bg || !wrap) return;
      bg.style.setProperty('--board-mask', `url(${hole.mask})`);
      bg.classList.add('masked');
      for (const k of ['t', 'r', 'b', 'l']) wrap.style.setProperty(`--hole-${k}`, hole[k].toFixed(2) + '%');
    });
  }

  // ── Minigame engine (modular): tambah game baru = tambah entri di MINIGAMES ──
  const TAP_TARGET = { count: 10, seconds: 10, emoji: '🎯', size: 52 };
  const MINIGAMES = {
    'tap-target': { title: 'Tap Target', start: startTapTarget },
    'water-tree': { title: 'Siram Pohon', start: startWaterTree, timer: false }, // tanpa hitung mundur
  };

  // openMinigame(type, onWin, onLose): onWin() bila menang; onLose(reason) bila waktu habis
  // ('timeout') atau ditutup pemain ('cancel'). Tipe tak dikenal -> lolos (jangan blokir
  // reward karena salah konfigurasi).
  function openMinigame(type, onWin, onLose) {
    const def = MINIGAMES[type];
    if (!def) { console.warn('Minigame tidak dikenal:', type); if (onWin) onWin(); return; }

    const overlay = document.createElement('div');
    overlay.className = 'mg-overlay';
    overlay.innerHTML = `
      <div class="mg-card" role="dialog" aria-modal="true">
        <div class="mg-head">
          <div class="mg-title">🎮 ${escHtml(def.title)}</div>
          <div class="mg-time">⏱️ --</div>
          <button type="button" class="mg-close" aria-label="Tutup">✕</button>
        </div>
        <div class="mg-bar"><div class="mg-bar-fill"></div></div>
        <div class="mg-info"></div>
        <div class="mg-area"></div>
      </div>`;
    document.body.appendChild(overlay);

    const area = overlay.querySelector('.mg-area');
    const timeEl = overlay.querySelector('.mg-time');
    const barEl = overlay.querySelector('.mg-bar-fill');
    if (def.timer === false) { timeEl.style.display = 'none'; overlay.querySelector('.mg-bar').style.display = 'none'; }
    const infoEl = overlay.querySelector('.mg-info');
    let finished = false, cleanup = null;

    const close = () => { if (cleanup) cleanup(); overlay.remove(); };
    const finish = (kind, reason, message) => {
      if (finished) return;
      finished = true;
      if (cleanup) cleanup();
      const msg = document.createElement('div');
      msg.className = 'mg-result' + (message ? ' msg' : '');
      msg.textContent = kind === 'win' ? '🎉 Menang!' : (message || '⏰ Waktu habis!');
      area.appendChild(msg);
      setTimeout(() => {
        overlay.remove();
        if (kind === 'win') { if (onWin) onWin(); } else if (onLose) onLose(reason, message);
      }, kind === 'win' ? 800 : (message ? 2300 : 900)); // pesan error diberi waktu baca lebih lama
    };
    overlay.querySelector('.mg-close').addEventListener('click', () => {
      if (finished) return;
      finished = true; close();
      if (onLose) onLose('cancel');
    });

    cleanup = def.start({
      area,
      setInfo: (t) => { infoEl.textContent = t; },
      setTime: (sec, frac) => { timeEl.textContent = `⏱️ ${Math.ceil(sec)}s`; barEl.style.width = (frac * 100) + '%'; },
      win: () => finish('win'),
      lose: (reason, message) => finish('lose', reason, message),
    });
  }
  window.openMinigame = openMinigame;

  // tap-target: 10 sasaran muncul acak sekaligus; ketuk semuanya sebelum 10 detik habis.
  function startTapTarget(api) {
    const { count, seconds, emoji, size } = TAP_TARGET;
    const rect = api.area.getBoundingClientRect();
    const W = Math.max(0, rect.width - size), H = Math.max(0, rect.height - size);
    const pts = [], minDist = size * 1.05;
    for (let i = 0; i < count; i++) {
      let best = null;
      for (let a = 0; a < 60 && !best; a++) {
        const p = { x: Math.random() * W, y: Math.random() * H };
        if (pts.every(q => Math.hypot(q.x - p.x, q.y - p.y) >= minDist)) best = p;
      }
      pts.push(best || { x: Math.random() * W, y: Math.random() * H });
    }

    let left = count, ended = false, timer = null;
    const end = () => { ended = true; if (timer) clearInterval(timer); };
    api.setInfo(`🎯 Ketuk semua sasaran! Sisa ${left}`);
    api.setTime(seconds, 1);

    pts.forEach((p) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'mg-target'; b.setAttribute('aria-label', 'sasaran');
      b.textContent = emoji; b.style.left = p.x + 'px'; b.style.top = p.y + 'px';
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (ended || b.dataset.hit) return;
        b.dataset.hit = '1'; b.classList.add('hit');
        setTimeout(() => b.remove(), 180);
        left--;
        api.setInfo(left > 0 ? `🎯 Ketuk semua sasaran! Sisa ${left}` : '🎉 Semua kena!');
        if (left === 0) { end(); api.win(); }
      });
      api.area.appendChild(b);
    });

    const t0 = performance.now();
    timer = setInterval(() => {
      const rem = Math.max(0, seconds - (performance.now() - t0) / 1000);
      api.setTime(rem, rem / seconds);
      if (rem <= 0) { end(); api.lose('timeout'); }
    }, 100);
    return end;
  }

  // water-tree: pemain menyiram pohon; server (/api/tycoon 'water-xmas-tree') mencatat pertumbuhan dan
  // menegakkan cooldown 24 jam. Menang = server berhasil; error/cooldown = kalah + pesan di dalam modal.
  // Di mode preview server TIDAK dipanggil (hanya demo animasi).
  function startWaterTree(api) {
    const stageOf = (g) => (g >= 7 ? '🎄' : g >= 3 ? '🌲' : '🌱');
    // Salju: 14 serpihan, posisi/kecepatan/ukuran acak. Delay NEGATIF = sudah jatuh sejak modal dibuka.
    const flakes = Array.from({ length: 14 }, () => {
      const left = (3 + Math.random() * 94).toFixed(1);
      const dur = (5 + Math.random() * 4).toFixed(1);
      const delay = (-Math.random() * 9).toFixed(1);
      const size = Math.round(9 + Math.random() * 9);
      const sway = Math.round(8 + Math.random() * 14);
      return `<span class="snowflake" style="left:${left}%; animation-duration:${dur}s; animation-delay:${delay}s; font-size:${size}px; --sway:${sway}px;">❄️</span>`;
    }).join('');
    api.area.innerHTML = `
      <div class="wt-scene">
        <div class="snow-layer">${flakes}</div>
        <div class="wt-can">🚿</div>
        <div class="wt-drops"><span>💧</span><span>💧</span><span>💧</span></div>
        <div class="snow-pile"></div>
        <div class="wt-tree">🌱</div>
        <button type="button" class="wt-btn">💧 Siram</button>
      </div>`;
    const scene = api.area.querySelector('.wt-scene');
    const tree = api.area.querySelector('.wt-tree');
    const btn = api.area.querySelector('.wt-btn');
    const closeBtn = api.area.closest('.mg-overlay').querySelector('.mg-close');
    let ended = false;
    const timers = [];
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
    api.setInfo('Siram pohonmu supaya tumbuh! 🌱 → 🌲 → 🎄');
    let phase = 'idle'; // 'idle' -> (siram) -> 'done' (tombol Selesai); modal ditutup HANYA oleh pemain
    const showDone = () => {
      phase = 'done';
      btn.disabled = false;
      btn.textContent = '✅ Selesai';
      btn.classList.add('done');
      // tombol ✕ sengaja tetap nonaktif: server sudah mencatat siram, jadi pemain harus menekan Selesai untuk klaim reward
    };

    btn.addEventListener('click', async () => {
      if (ended) return;
      if (phase === 'done') { api.win(); return; }
      if (btn.disabled) return;
      btn.disabled = true;
      closeBtn.disabled = true; // jangan tutup di tengah proses (cooldown bisa terpakai tanpa reward)
      scene.classList.add('pouring');
      api.setInfo('💧 Menyiram...');
      await new Promise((r) => later(r, 1500)); // animasi 1,5 detik
      if (ended) return;
      scene.classList.remove('pouring');

      if (IS_PREVIEW) {
        tree.textContent = '🌲'; tree.classList.add('grow');
        api.setInfo('👀 Preview: server tidak dipanggil. Tekan Selesai.');
        showDone();
        return;
      }

      api.setInfo('⏳ Menghubungi server...');
      try {
        const m = getCurrentMember();
        if (!m) throw new Error('login');
        const res = await fetch('/api/tycoon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'water-xmas-tree', memberId: m.memberId, sessionToken: m.sessionToken }),
        });
        let data = {};
        try { data = await res.json(); } catch (e) { /* respons bukan JSON */ }
        if (ended) return;
        if (!res.ok || !data.success) {
          closeBtn.disabled = false;
          return api.lose(res.status === 429 ? 'cooldown' : 'error', data.error || 'Gagal menyiram pohon. Coba lagi nanti.');
        }
        tree.textContent = stageOf(data.growth);
        tree.classList.add('grow');
        api.setInfo(`🎉 Pohon tumbuh! Tahap ${data.growth}/${data.maxGrowth || 7}. Tekan Selesai.`);
        showDone();
      } catch (e) {
        if (ended) return;
        closeBtn.disabled = false;
        api.lose('error', e && e.message === 'login' ? 'Silakan login dulu.' : 'Gagal terhubung ke server. Periksa koneksi lalu coba lagi.');
      }
    });

    return () => { ended = true; timers.forEach(clearTimeout); };
  }

  // ── Panel Pohon Natal: lihat pohon, craft bola (50 koin event), pasang bola, hitung mundur kado ──
  // Tombol muncul hanya di event yang punya quest minigame 'water-tree'.
  function eventHasXmas(ev) {
    return !!ev.quests && Object.values(ev.quests).some(q => getQuestMinigame(ev, q) === 'water-tree');
  }

  async function xmasApi(action, extra) {
    const m = getCurrentMember();
    if (!m) return { ok: false, data: { error: 'Silakan login dulu.' } };
    try {
      const res = await fetch('/api/tycoon', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, memberId: m.memberId, sessionToken: m.sessionToken, ...extra }),
      });
      let data = {};
      try { data = await res.json(); } catch (e) { /* bukan JSON */ }
      return { ok: res.ok, data };
    } catch (e) {
      return { ok: false, data: { error: 'Gagal terhubung ke server. Periksa koneksi lalu coba lagi.' } };
    }
  }

  // Hasil buka kado: daftar teks (dikelompokkan), tanpa animasi undian.
  function showXmasRewards(rewards) {
    const groups = new Map();
    for (const r of rewards) {
      const k = `${r.type}|${r.amount}|${r.name}`;
      const g = groups.get(k);
      if (g) g.n++; else groups.set(k, { r, n: 1 });
    }
    const ov = document.createElement('div');
    ov.className = 'mg-overlay';
    ov.style.zIndex = '10001';
    const card = document.createElement('div');
    card.className = 'mg-card xmas-card';
    const title = document.createElement('div');
    title.className = 'mg-title';
    title.textContent = '🎉 Kamu mendapatkan:';
    const ul = document.createElement('ul');
    ul.className = 'xmas-rewards';
    for (const { r, n } of groups.values()) {
      const li = document.createElement('li');
      li.textContent = r.type === 'item' ? `${n}x ${r.name}` : `${n}x ${r.amount} ${r.name}`; // textContent: aman dari HTML
      ul.appendChild(li);
    }
    if (groups.size === 0) { const li = document.createElement('li'); li.textContent = 'Tidak ada hadiah.'; ul.appendChild(li); }
    const ok = document.createElement('button');
    ok.type = 'button'; ok.className = 'xmas-btn'; ok.textContent = '✅ Tutup';
    ok.addEventListener('click', () => ov.remove());
    card.append(title, ul, ok);
    ov.appendChild(card);
    document.body.appendChild(ov);
  }

  function openXmasPanel(eventId) {
    const overlay = document.createElement('div');
    overlay.className = 'mg-overlay';
    overlay.innerHTML = `
      <div class="mg-card xmas-card" role="dialog" aria-modal="true">
        <div class="mg-head">
          <div class="mg-title">🎄 Pohon Natal</div>
          <button type="button" class="mg-close" aria-label="Tutup">✕</button>
        </div>
        <div class="xmas-tree">🌱</div>
        <div class="xmas-orn"></div>
        <div class="xmas-stats">Memuat...</div>
        <div class="xmas-gift"></div>
        <div class="xmas-msg"></div>
        <div class="xmas-actions">
          <button type="button" class="xmas-btn gift" data-act="open" hidden>🎁 Buka Kado</button>
          <button type="button" class="xmas-btn" data-act="craft" disabled>🛠️ Craft Bola (50 🪙)</button>
          <button type="button" class="xmas-btn alt" data-act="install" disabled>🎄 Pasang Bola</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const q = (s) => overlay.querySelector(s);
    const treeEl = q('.xmas-tree'), ornEl = q('.xmas-orn'), statsEl = q('.xmas-stats');
    const giftEl = q('.xmas-gift'), msgEl = q('.xmas-msg');
    const openBtn = q('[data-act="open"]'), craftBtn = q('[data-act="craft"]'), installBtn = q('[data-act="install"]');
    let st = null, busy = false, alive = true, offset = 0;

    const stageOf = (g) => (g >= 7 ? '🎄' : g >= 3 ? '🌲' : '🌱');
    const say = (t, err) => { msgEl.textContent = t || ''; msgEl.className = 'xmas-msg' + (err ? ' err' : ''); };
    const serverNow = () => Date.now() + offset;

    function renderGift() {
      if (!st || !st.giftsReadyAt || !(st.ornamentsInstalled > 0)) { giftEl.textContent = ''; return; }
      const left = st.giftsReadyAt - serverNow();
      if (left <= 0) { giftEl.textContent = '🎁 Kado sudah siap!'; return; }
      const min = Math.ceil(left / 60000);
      giftEl.textContent = `🎁 Kado siap dalam: ${Math.floor(min / 60)} jam ${min % 60} menit`;
    }
    function render() {
      if (!st) return;
      treeEl.textContent = stageOf(st.growth || 0);
      ornEl.textContent = '🔴'.repeat(Math.min(st.ornamentsInstalled || 0, 12));
      statsEl.textContent = `Bola dibuat: ${st.ornamentsCrafted || 0} | Bola terpasang: ${st.ornamentsInstalled || 0}`;
      craftBtn.textContent = `🛠️ Craft Bola (${st.craftCost || 50} 🪙)`;
      craftBtn.disabled = busy || IS_PREVIEW;
      installBtn.disabled = busy || IS_PREVIEW || !(st.ornamentsCrafted > 0);
      const giftReady = !!(st.ornamentsInstalled > 0 && st.giftsReadyAt && st.giftsReadyAt <= serverNow());
      openBtn.hidden = !giftReady;
      openBtn.textContent = `🎁 Buka ${st.ornamentsInstalled || 0} Kado`;
      openBtn.disabled = busy || IS_PREVIEW;
      renderGift();
    }

    async function act(action, extra, onOk) {
      if (busy) return;
      busy = true; render(); say('⏳ Memproses...');
      const { ok, data } = await xmasApi(action, extra);
      busy = false;
      if (!alive) return;
      if (!ok) { say(data.error || 'Gagal. Coba lagi nanti.', true); render(); return; }
      for (const k of ['ornamentsCrafted', 'ornamentsInstalled', 'giftsReadyAt']) if (k in data) st[k] = data[k];
      onOk(data);
      render();
    }
    craftBtn.addEventListener('click', () => act('craft-ornament', { eventId }, (d) => say(`✅ Bola dibuat! Sisa koin: ${d.coinsLeft} 🪙`)));
    installBtn.addEventListener('click', () => {
      const n = st.ornamentsCrafted;
      act('install-ornament', { eventId }, () => {
        say(`🎉 ${n} bola terpasang!`);
        treeEl.classList.remove('grow'); void treeEl.offsetWidth; treeEl.classList.add('grow');
      });
    });

    // Buka kado: server membaca daftar hadiah dari event di Firebase (BUKAN dari browser, supaya
    // member tidak bisa mengirim daftar hadiah buatannya sendiri). Hasil ditampilkan sebagai teks.
    openBtn.addEventListener('click', async () => {
      if (busy) return;
      busy = true; render();
      msgEl.className = 'xmas-msg';
      msgEl.innerHTML = '<span class="xmas-spinner"></span> Membuka kado...';
      const { ok, data } = await xmasApi('open-gift', { eventId });
      busy = false;
      if (!alive) return;
      if (!ok) { say(data.error || 'Gagal membuka kado. Coba lagi nanti.', true); render(); return; }
      st.ornamentsInstalled = 0; st.giftsReadyAt = null;
      say('');
      render();
      showXmasRewards(data.rewards || []);
    });

    const tick = setInterval(render, 30000); // hitung mundur & munculnya tombol Buka Kado
    const close = () => { alive = false; clearInterval(tick); overlay.remove(); };
    q('.mg-close').addEventListener('click', close);

    (async () => {
      if (IS_PREVIEW) { // preview: data contoh, server tidak dipanggil
        st = { growth: 3, ornamentsCrafted: 1, ornamentsInstalled: 2, giftsReadyAt: Date.now() + 5.5 * 3600 * 1000, craftCost: 50 };
        say('👀 Preview: server tidak dipanggil');
        return render();
      }
      const { ok, data } = await xmasApi('get-xmas-tree-state');
      if (!alive) return;
      if (!ok) { statsEl.textContent = 'Gagal memuat pohon'; say(data.error || 'Coba lagi nanti.', true); return; }
      st = data;
      if (data.serverNow) offset = data.serverNow - Date.now();
      render();
    })();
  }
  window.openXmasPanel = openXmasPanel;

  // Minigame per quest: quest.minigameType. Kompatibel dengan event lama (Fase 1-2) yang
  // memakai ev.minigameType + ev.targetQuestsForMinigame. Return '' kalau tanpa minigame.
  function getQuestMinigame(ev, quest) {
    if (!ev || !quest) return '';
    if (quest.minigameType && quest.minigameType !== 'none') return quest.minigameType;
    if (quest.type === 'minigame') return 'tap-target'; // tipe minigame tanpa pilihan jenis: jangan lolos tanpa main
    if (ev.minigameType && ev.minigameType !== 'none' && ev.targetQuestsForMinigame &&
        Object.values(ev.targetQuestsForMinigame).includes(quest.id)) return ev.minigameType;
    return '';
  }

  // ── Quest berulang (resetType: 'daily' | 'weekly') ──
  // Server (opsional) mengirim claimedAt { questId: epochMs } di check-quest-claimed. Quest yang sudah
  // approved dan lewat interval dianggap belum diklaim (tombol "Klaim" muncul lagi). Tanpa claimedAt,
  // quest tetap "Selesai" (aman).
  const RESET_MS = { daily: 24 * 60 * 60 * 1000, weekly: 7 * 24 * 60 * 60 * 1000 };
  window._claimedAt = {};
  function resetInterval(quest) { return (quest && RESET_MS[quest.resetType]) || 0; }
  function fmtReset(ms) {
    const m = Math.max(1, Math.ceil(ms / 60000));
    if (m >= 1440) return `${Math.floor(m / 1440)} hr ${Math.floor((m % 1440) / 60)} j`;
    if (m >= 60) return `${Math.floor(m / 60)} j ${m % 60} m`;
    return `${m} m`;
  }
  function doneLabel(ev, quest) {
    const iv = resetInterval(quest), t = window._claimedAt[`${ev.id}:${quest.id}`];
    return iv && t ? `✅ Selesai · reset ${fmtReset(t + iv - Date.now())}` : '✅ Selesai';
  }

  function renderEventPanel(ev, index, claimedMap) {
    const quests = ev.quests ? Object.values(ev.quests) : [];
    const claimed = claimedMap[ev.id] || {};

    const questCards = quests.length > 0
      ? quests.map((q, i) => renderQuestCard(ev, q, i + 1, claimed)).join('')
      : '<div class="quest-card">Belum ada quest untuk event ini.</div>';

    const mascot = renderMascot(ev);

    // 3 lapis (tidak berubah): (1) .event-bg, (2) .quest-frame-bg yang di-mask mengikuti lubang
    // border, (3) .quest-frame-border (Border.png) di paling depan. Daftar quest ada di
    // .quest-scroll (di atas lapis 2, di bawah lapis 3). Maskot di luar wrapper.
    return `
      <div class="event-panel${index === 0 ? ' active' : ''}${mascot ? ' has-mascot' : ' no-mascot'}" data-event-id="${ev.id}">
        <img class="event-bg" src="${ev.backgroundUrl}" alt="">
        <div class="quest-frame-wrap" id="frame-wrap-${ev.id}">
          <div class="quest-frame-bg" id="frame-bg-${ev.id}" style="background-image: url('${ev.questBgUrl}');"></div>
          <div class="quest-scroll">
            <div class="event-title-label">${escHtml(ev.title)}</div>
            ${ev.desc ? `<div class="event-desc">${escHtml(ev.desc)}</div>` : ''}
            ${ev.coinName ? `<div class="event-coin-label">🪙 Kumpulkan ${escHtml(ev.coinName)}</div>` : ''}
            ${questCards}
          </div>
          <img class="quest-frame-border" src="${ev.borderShapeUrl}" alt="" onload="applyBorderAspectRatio('${ev.id}', this)" onerror="this.onerror=null;">
        </div>
        ${mascot}
        ${eventHasXmas(ev) ? `<button type="button" class="xmas-fab" onclick="openXmasPanel('${ev.id}')">🎄 Pohon Natal</button>` : ''}
      </div>`;
  }

  // Border.png bisa punya rasio aspek apapun tergantung desainnya (9:16,
  // custom, dll). Supaya wrapper tidak memaksa gambar melar/gepeng, begitu
  // gambar border selesai dimuat, ambil naturalWidth/naturalHeight-nya
  // (dimensi ASLI file) dan terapkan sebagai aspect-ratio ke wrapper —
  // quest-frame-bg ikut pas otomatis karena sama-sama inset:0 di wrapper
  // yang sama. Kalau gambar gagal load / dimensinya 0, biarkan CSS
  // max-width/max-height default yang berlaku (fallback aman).
  function applyBorderAspectRatio(eventId, imgEl) {
    const wrap = document.getElementById(`frame-wrap-${eventId}`);
    if (!wrap || !imgEl.naturalWidth || !imgEl.naturalHeight) return;
    wrap.style.aspectRatio = `${imgEl.naturalWidth} / ${imgEl.naturalHeight}`;
    wrap.style.setProperty('--ar', (imgEl.naturalWidth / imgEl.naturalHeight).toFixed(4)); // dipakai CSS untuk lebar
  }
  window.applyBorderAspectRatio = applyBorderAspectRatio;

  // Gambar yang sudah ada di cache browser bisa saja punya `complete: true`
  // SEBELUM onload sempat didaftarkan (race condition render innerHTML),
  // jadi event onload tidak akan pernah terpicu untuk gambar itu. Sapu
  // ulang semua .quest-frame-border setelah render untuk jaga-jaga.
  function reapplyCachedBorderAspectRatios() {
    document.querySelectorAll('.quest-frame-border').forEach(imgEl => {
      if (imgEl.complete && imgEl.naturalWidth) {
        const wrap = imgEl.closest('.quest-frame-wrap');
        if (wrap) {
          wrap.style.aspectRatio = `${imgEl.naturalWidth} / ${imgEl.naturalHeight}`;
          wrap.style.setProperty('--ar', (imgEl.naturalWidth / imgEl.naturalHeight).toFixed(4));
        }
      }
    });
  }
  window.reapplyCachedBorderAspectRatios = reapplyCachedBorderAspectRatios;

  async function fetchClaimedStatus(events) {
    const member = getCurrentMember();
    const claimedMap = {};
    if (IS_PREVIEW || !member) return claimedMap;

    for (const ev of events) {
      const quests = ev.quests ? Object.values(ev.quests) : [];
      if (quests.length === 0) continue;
      try {
        const res = await fetch('/api/shop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'check-quest-claimed',
            memberId: member.memberId,
            sessionToken: member.sessionToken,
            eventId: ev.id,
            questIds: quests.map(q => q.id),
          }),
        });
        const data = await res.json();
        if (res.ok) {
          claimedMap[ev.id] = data.claimed || {};
          const at = data.claimedAt || {};
          for (const q of quests) {
            const iv = resetInterval(q);
            if (!iv || !at[q.id]) continue;
            window._claimedAt[`${ev.id}:${q.id}`] = Number(at[q.id]);
            if (claimedMap[ev.id][q.id] === 'approved' && Date.now() - Number(at[q.id]) >= iv) delete claimedMap[ev.id][q.id];
          }
        }
      } catch (e) {
        console.error('Gagal cek status klaim untuk event', ev.id, e);
      }
    }
    return claimedMap;
  }

  async function renderEvents(events) {
    window._eventsCache = events;
    const stageEl = document.getElementById('eventStage');
    const tabsEl = document.getElementById('eventTabs');

    if (events.length === 0) {
      tabsEl.style.display = 'none';
      tabsEl.innerHTML = '';
      document.getElementById('headerTitle').textContent = 'Event I.O.E Hub';
      stageEl.className = '';
      stageEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">🌠</div>
          <p>Belum ada event yang berlangsung.<br>Pantengin terus ya!</p>
        </div>`;
      return;
    }

    document.body.classList.toggle('has-tabs', events.length > 1);
    if (events.length > 1) {
      tabsEl.style.display = 'flex';
      tabsEl.innerHTML = events.map((ev, i) => `
        <button class="event-tab${i === 0 ? ' active' : ''}" data-event-id="${ev.id}" onclick="switchEvent('${ev.id}')">${escHtml(ev.title)}</button>
      `).join('');
    } else {
      tabsEl.style.display = 'none';
      tabsEl.innerHTML = '';
    }

    const claimedMap = await fetchClaimedStatus(events);

    stageEl.className = '';
    stageEl.innerHTML = events.map((ev, i) => renderEventPanel(ev, i, claimedMap)).join('');
    reapplyCachedBorderAspectRatios();
    events.forEach(fitBoardToHole);

    document.getElementById('headerTitle').textContent = events[0].title;
  }

  // ── Preview draft + tombol PUBLISH (hanya muncul di mode preview) ──
  async function publishDraft(btn) {
    if (!confirm('Terbitkan event ini sekarang? Hari ke-1 dan masa berlaku dihitung mulai sekarang.')) return;
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = 'Menerbitkan...';
    try {
      const draftRef = ref(db, `draft_events/${PREVIEW_ID}`);
      const draft = (await get(draftRef)).val();
      if (!draft) throw new Error('Draft tidak ditemukan');
      const now = Date.now();
      const eventId = 'event_' + now;
      const { draftCreatedAt, ...rest } = draft;
      await set(ref(db, `events/${eventId}`), {
        ...rest,
        id: eventId,
        createdAt: now,
        expiresAt: now + (Number(draft.days) || 1) * 24 * 60 * 60 * 1000,
      });
      await remove(draftRef);
      location.replace('event.html');
    } catch (err) {
      console.error('Gagal publish:', err);
      alert('Gagal menerbitkan: ' + (err && err.message ? err.message : err));
      btn.disabled = false;
      btn.textContent = label;
    }
  }

  function showPreviewUi() {
    document.body.classList.add('is-preview');
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom, 0px) + 12px); z-index:9999; display:flex; gap:8px; align-items:center; padding:10px 12px; border-radius:14px; background:rgba(20,20,30,0.94); border:1px solid #ffd166; color:#ffd166; font-size:12px; box-shadow:0 6px 24px rgba(0,0,0,0.5);';
    bar.innerHTML = '<span style="flex:1;">👀 PREVIEW DRAFT — belum terbit</span>';
    const btn = document.createElement('button');
    btn.textContent = 'PUBLISH';
    btn.style.cssText = 'padding:10px 16px; border-radius:10px; border:0; background:#00e5c0; color:#06231e; font-weight:700; font-size:13px;';
    btn.addEventListener('click', () => publishDraft(btn));
    bar.appendChild(btn);
    document.body.appendChild(bar);
  }

  async function loadPreview() {
    const draft = (await get(ref(db, `draft_events/${PREVIEW_ID}`))).val();
    if (!draft) {
      document.getElementById('eventStage').className = '';
      document.getElementById('eventStage').innerHTML =
        '<div class="empty-state">⚠️ Draft tidak ditemukan (sudah diterbitkan atau dihapus).</div>';
      return;
    }
    draft.targetQuestsForMinigame = draft.targetQuestsForMinigame || []; // Firebase membuang array kosong
    await renderEvents([draft]);
    showPreviewUi();
  }

  async function loadEvents() {
    try {
      if (IS_PREVIEW) { await loadPreview(); return; }
      const snap = await get(ref(db, 'events'));
      const data = snap.val();

      if (!data) { renderEvents([]); return; }

      const now = Date.now();
      const all = Object.values(data);

      for (const ev of all) {
        if (ev.expiresAt && ev.expiresAt < now) {
          await remove(ref(db, `events/${ev.id}`));
        }
      }

      const active = all.filter(ev => !ev.expiresAt || ev.expiresAt >= now);
      active.sort((a, b) => b.createdAt - a.createdAt);
      renderEvents(active);
    } catch (err) {
      console.error('Gagal memuat event:', err);
      document.getElementById('eventStage').innerHTML =
        '<div class="empty-state">⚠️ Gagal memuat event. Coba refresh halaman.</div>';
    }
  }

  loadEvents();
</script>

</body>
</html>
