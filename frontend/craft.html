<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refinery & Craft — I.O.E Hub</title>
<script src="js/ioe-auth.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0a12;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-bottom: 24px;
  }

  header {
    position: sticky; top: 0; z-index: 10;
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(10,10,18,0.97), rgba(10,10,18,0.9));
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  header h1 {
    font-size: 1rem;
    background: linear-gradient(90deg,#7b5cff,#00c2ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .orecoin-badge {
    font-size: 0.8rem; font-weight: 700; color: #ffd23f;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,210,63,0.3);
    padding: 5px 10px; border-radius: 20px;
    display: flex; align-items: center; gap: 4px;
  }

  .tab-row {
    display: flex; gap: 6px; padding: 10px 14px;
    position: sticky; top: 52px; z-index: 9;
    background: #0a0a12;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tab-btn {
    flex: 1; padding: 9px 4px; border: 1px solid rgba(123,92,255,0.25);
    background: rgba(123,92,255,0.08); color: #cbd5e0;
    border-radius: 10px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
  }
  .tab-btn.active { background: linear-gradient(90deg,#7b5cff,#00c2ff); color: #fff; border-color: transparent; }

  .section { display: none; padding: 14px; }
  .section.active { display: block; }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .card-title { font-size: 0.85rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .card-sub { font-size: 0.68rem; color: #718096; margin-bottom: 10px; }

  /* ── Refinery ── */
  .ore-select-row {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px;
  }
  .ore-select-row::-webkit-scrollbar { display: none; }
  .ore-pick {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 10px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
    font-size: 0.62rem; min-width: 64px;
  }
  .ore-pick.selected { border-color: #00c2ff; background: rgba(0,194,255,0.12); }
  .ore-pick .ore-dot { width: 18px; height: 18px; border-radius: 50%; }
  .ore-pick .ore-amt { color: #a0aec0; }

  .qty-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .qty-input {
    flex: 1; padding: 9px 10px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 0.85rem;
  }
  .qty-max-btn {
    padding: 9px 12px; border-radius: 8px; border: 1px solid rgba(0,194,255,0.3);
    background: rgba(0,194,255,0.1); color: #00c2ff; font-size: 0.68rem; font-weight: 700; cursor: pointer;
  }

  .refine-info { font-size: 0.7rem; color: #a0aec0; margin-bottom: 10px; line-height: 1.5; }
  .refine-info b { color: #fff; }

  .action-btn {
    width: 100%; padding: 11px; border: none; border-radius: 10px;
    background: linear-gradient(90deg,#00c2ff,#7b5cff);
    color: #fff; font-weight: 800; font-size: 0.82rem; cursor: pointer;
  }
  .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .refinery-progress-card {
    background: rgba(0,194,255,0.08); border: 1px solid rgba(0,194,255,0.3);
  }
  .refinery-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; margin: 8px 0; }
  .refinery-bar-fill { height: 100%; background: linear-gradient(90deg,#00c2ff,#7b5cff); transition: width 0.3s; }

  /* ── Market ── */
  .market-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .market-row:last-child { border-bottom: none; }
  .market-dot { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
  .market-info { flex: 1; min-width: 0; }
  .market-name { font-size: 0.78rem; font-weight: 700; color: #fff; }
  .market-price { font-size: 0.65rem; color: #ffd23f; }
  .market-owned { font-size: 0.65rem; color: #718096; }
  .market-sell-btn {
    padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(0,229,197,0.4);
    background: rgba(0,229,197,0.15); color: #00e5c0; font-size: 0.68rem; font-weight: 700; cursor: pointer;
    flex-shrink: 0;
  }
  .market-sell-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Craft (Space Program) ── */
  .planet-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .planet-tabs::-webkit-scrollbar { display: none; }
  .planet-tab {
    flex-shrink: 0; padding: 7px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 700;
    border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #cbd5e0; cursor: pointer;
  }
  .planet-tab.active { background: linear-gradient(90deg,#7b5cff,#00c2ff); color: #fff; border-color: transparent; }

  .asset-card { position: relative; }
  .asset-card.done { border-color: rgba(0,229,197,0.4); background: rgba(0,229,197,0.06); }
  .asset-card.locked { opacity: 0.5; }
  .asset-status { font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 12px; display: inline-block; margin-bottom: 8px; }
  .asset-status.done { background: rgba(0,229,197,0.2); color: #00e5c0; }
  .asset-status.locked { background: rgba(255,255,255,0.1); color: #718096; }
  .asset-status.ready { background: rgba(255,210,63,0.2); color: #ffd23f; }

  .cost-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .cost-chip {
    font-size: 0.62rem; padding: 4px 8px; border-radius: 8px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  }
  .cost-chip.insufficient { color: #ff6b6b; border-color: rgba(255,107,107,0.3); }
  .cost-chip.sufficient { color: #00e5c0; }

  .explore-card { background: linear-gradient(160deg, rgba(123,92,255,0.12), rgba(0,194,255,0.06)); border-color: rgba(123,92,255,0.3); }
  .explore-reward-row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .explore-reward-chip { font-size: 0.65rem; padding: 4px 9px; border-radius: 10px; background: rgba(255,255,255,0.08); }

  .status-msg { font-size: 0.7rem; margin-top: 8px; min-height: 16px; text-align: center; }
  .loading-state { text-align: center; padding: 30px 20px; color: #718096; font-size: 0.8rem; }
</style>
</head>
<body>

<header>
  <h1>🛠️ Refinery & Craft</h1>
  <div class="orecoin-badge" id="oreCoinBadge">🪙 —</div>
</header>

<div class="tab-row">
  <button class="tab-btn active" id="tab-refinery" onclick="switchTab('refinery')">⚙️ Refinery</button>
  <button class="tab-btn" id="tab-market" onclick="switchTab('market')">💰 Market</button>
  <button class="tab-btn" id="tab-craft" onclick="switchTab('craft')">🚀 Space Program</button>
</div>

<div class="section active" id="section-refinery">
  <div class="loading-state">Memuat refinery...</div>
</div>

<div class="section" id="section-market">
  <div class="loading-state">Memuat market...</div>
</div>

<div class="section" id="section-craft">
  <div class="loading-state">Memuat space program...</div>
</div>

<script>
  const ORE_COLORS = {
    coal: '#4a4a52', copper: '#2E8B57', iron: '#c05c5c', silver: '#C0C0C0',
    gold: '#FFD700', platinum: '#E5E4E2', crystal: '#9370DB', mythril: '#4169E1',
    uranium: '#39FF14', darkmatter: '#8b5cf6',
  };
  const ORE_LABELS = {
    coal: 'Coal', copper: 'Copper', iron: 'Iron', silver: 'Silver', gold: 'Gold',
    platinum: 'Platinum', crystal: 'Crystal', mythril: 'Mythril', uranium: 'Uranium', darkmatter: 'Dark Matter',
  };
  const ORE_EMOJI = {
    coal: '⚫', copper: '🟤', iron: '🔴', silver: '⚪', gold: '🟡',
    platinum: '💎', crystal: '🔮', mythril: '🔷', uranium: '🟢', darkmatter: '🟣',
  };
  const RESOURCE_LABELS = { moonCrystal: 'Moon Crystal', lunarDust: 'Lunar Dust', martianOre: 'Martian Ore', redDust: 'Red Dust', jovianGas: 'Jovian Gas', stormCrystal: 'Storm Crystal', ringFragment: 'Ring Fragment', titanGas: 'Titan Gas', deepIce: 'Deep Ice', cobaltShard: 'Cobalt Shard', voidShard: 'Void Shard', darkMatterEssence: 'Dark Matter Essence' };
  const RESOURCE_EMOJI = { moonCrystal: '💠', lunarDust: '🌙', martianOre: '🔴', redDust: '🟠', jovianGas: '🌀', stormCrystal: '⚡', ringFragment: '💍', titanGas: '🌫️', deepIce: '🧊', cobaltShard: '🔷', voidShard: '🕳️', darkMatterEssence: '🟣' };

  let gameData = null;
  let selectedRefineOre = null;
  let refineryTimerInterval = null;
  let activePlanetId = 'moon';

  function getCurrentMember() {
    const session = (typeof getIoeSession === 'function') ? getIoeSession() : null;
    if (!session || !session.memberId || !session.sessionToken) return null;
    return { memberId: session.memberId, sessionToken: session.sessionToken };
  }

  async function callTycoonApi(action, extra = {}) {
    const member = getCurrentMember();
    if (!member) throw new Error('Silakan login dulu');
    const res = await fetch('/api/tycoon', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, memberId: member.memberId, sessionToken: member.sessionToken, ...extra }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal memproses permintaan');
    return data;
  }

  function formatAmount(n) { return Math.floor(n).toLocaleString('id-ID'); }

  function switchTab(tab) {
    ['refinery', 'market', 'craft'].forEach(t => {
      document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
      document.getElementById(`section-${t}`).classList.toggle('active', t === tab);
    });
  }
  window.switchTab = switchTab;

  function updateOreCoinBadge() {
    document.getElementById('oreCoinBadge').textContent = `🪙 ${formatAmount(gameData.oreCoins)}`;
  }

  // ══════════════════════════════════════════
  // REFINERY TAB
  // ══════════════════════════════════════════
  function renderRefineryTab() {
    const el = document.getElementById('section-refinery');
    const { state, refineryRecipes } = gameData;
    const job = state.refineryJob;

    let html = '';

    if (job) {
      const recipe = refineryRecipes[job.oreType];
      html += `
        <div class="card refinery-progress-card">
          <div class="card-title">${ORE_EMOJI[job.oreType] || '⚙️'} Memproses ${ORE_LABELS[job.oreType] || job.oreType} → ${recipe.ingotName}</div>
          <div class="card-sub">Jumlah: ${job.quantity} ${recipe.ingotName}</div>
          <div class="refinery-bar"><div class="refinery-bar-fill" id="refineryBarFill" style="width:0%"></div></div>
          <div class="status-msg" id="refineryTimeLeft" style="color:#00c2ff;"></div>
        </div>`;
    } else {
      html += `
        <div class="card">
          <div class="card-title">Pilih Ore untuk Diolah</div>
          <div class="card-sub">Ore mentah diproses jadi ingot — ingot dijual lebih mahal & dipakai untuk craft Space Program.</div>
          <div class="ore-select-row" id="oreSelectRow"></div>
          <div id="refineFormArea"></div>
        </div>`;
    }

    el.innerHTML = html;

    if (job) {
      startRefineryTimer(job);
    } else {
      renderOreSelectRow();
    }
  }

  function renderOreSelectRow() {
    const row = document.getElementById('oreSelectRow');
    const { state, refineryRecipes } = gameData;
    const oreTypes = Object.keys(refineryRecipes);

    row.innerHTML = oreTypes.map(oreType => {
      const owned = (state.oreInventory && state.oreInventory[oreType]) || 0;
      const selected = selectedRefineOre === oreType;
      return `
        <div class="ore-pick ${selected ? 'selected' : ''}" onclick="selectRefineOre('${oreType}')">
          <div class="ore-dot" style="background:${ORE_COLORS[oreType]};"></div>
          <div>${ORE_LABELS[oreType]}</div>
          <div class="ore-amt">${formatAmount(owned)}</div>
        </div>`;
    }).join('');

    if (selectedRefineOre) renderRefineForm();
  }

  function selectRefineOre(oreType) {
    selectedRefineOre = oreType;
    renderOreSelectRow();
  }
  window.selectRefineOre = selectRefineOre;

  function renderRefineForm() {
    const area = document.getElementById('refineFormArea');
    const { state, refineryRecipes } = gameData;
    const oreType = selectedRefineOre;
    const recipe = refineryRecipes[oreType];
    const owned = (state.oreInventory && state.oreInventory[oreType]) || 0;
    const maxQty = Math.floor(owned / recipe.inputPerOutput);

    area.innerHTML = `
      <div class="refine-info">
        Butuh <b>${recipe.inputPerOutput}x ${ORE_LABELS[oreType]}</b> mentah untuk 1 <b>${recipe.ingotName}</b>.
        Waktu proses: <b>${recipe.durationSeconds}s per unit</b>. Kamu punya ${formatAmount(owned)} ${ORE_LABELS[oreType]} (maks ${maxQty} ${recipe.ingotName}).
      </div>
      <div class="qty-row">
        <input type="number" min="1" max="${maxQty}" value="1" class="qty-input" id="refineQtyInput">
        <button class="qty-max-btn" onclick="setMaxRefineQty(${maxQty})">MAX</button>
      </div>
      <button class="action-btn" id="startRefineBtn" onclick="startRefine()" ${maxQty < 1 ? 'disabled' : ''}>
        ${maxQty < 1 ? 'Ore tidak cukup' : `Mulai Refine (~${recipe.durationSeconds}s/unit)`}
      </button>
      <div class="status-msg" id="refineStatusMsg"></div>
    `;
  }

  function setMaxRefineQty(max) {
    document.getElementById('refineQtyInput').value = max;
  }
  window.setMaxRefineQty = setMaxRefineQty;

  async function startRefine() {
    const qtyInput = document.getElementById('refineQtyInput');
    const statusEl = document.getElementById('refineStatusMsg');
    const btn = document.getElementById('startRefineBtn');
    const qty = parseInt(qtyInput.value, 10);

    if (!qty || qty < 1) {
      statusEl.textContent = '⚠️ Jumlah tidak valid';
      statusEl.style.color = '#ff6b6b';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Memproses...';

    try {
      const data = await callTycoonApi('start-refine', { oreType: selectedRefineOre, quantity: qty });
      gameData.state = data.state;
      selectedRefineOre = null;
      renderRefineryTab();
    } catch (err) {
      statusEl.textContent = `❌ ${err.message}`;
      statusEl.style.color = '#ff6b6b';
      btn.disabled = false;
      btn.textContent = 'Mulai Refine';
    }
  }
  window.startRefine = startRefine;

  // Timer client-side murni untuk TAMPILAN progress bar — status final
  // (apakah job benar-benar selesai & ingot bertambah) TETAP divalidasi
  // ulang oleh server (applyRefineryProgress) setiap kali endpoint apapun
  // dipanggil, bukan dipercaya dari hitungan client ini.
  function startRefineryTimer(job) {
    if (refineryTimerInterval) clearInterval(refineryTimerInterval);

    function tick() {
      const now = Date.now();
      const total = job.finishAt - job.startedAt;
      const elapsed = now - job.startedAt;
      const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));

      const fillEl = document.getElementById('refineryBarFill');
      const timeEl = document.getElementById('refineryTimeLeft');
      if (!fillEl || !timeEl) { clearInterval(refineryTimerInterval); return; }

      fillEl.style.width = `${pct}%`;

      const remainingMs = Math.max(0, job.finishAt - now);
      if (remainingMs <= 0) {
        timeEl.textContent = 'Selesai! Memuat ulang...';
        clearInterval(refineryTimerInterval);
        loadGameData();
        return;
      }
      const totalSec = Math.ceil(remainingMs / 1000);
      const m = Math.floor(totalSec / 60), s = totalSec % 60;
      timeEl.textContent = `Sisa waktu: ${m}m ${s}s`;
    }
    tick();
    refineryTimerInterval = setInterval(tick, 1000);
  }

  // ══════════════════════════════════════════
  // MARKET TAB
  // ══════════════════════════════════════════
  function renderMarketTab() {
    const el = document.getElementById('section-market');
    const { state, oreSellPrice, ingotSellPrice, refineryRecipes } = gameData;

    const oreRows = Object.keys(oreSellPrice).map(oreType => {
      const owned = (state.oreInventory && state.oreInventory[oreType]) || 0;
      return `
        <div class="market-row">
          <div class="market-dot" style="background:${ORE_COLORS[oreType]}22;">${ORE_EMOJI[oreType]}</div>
          <div class="market-info">
            <div class="market-name">${ORE_LABELS[oreType]} (mentah)</div>
            <div class="market-price">🪙 ${oreSellPrice[oreType]} /unit</div>
            <div class="market-owned">Punya: ${formatAmount(owned)}</div>
          </div>
          <button class="market-sell-btn" ${owned < 1 ? 'disabled' : ''} onclick="sellAll('sell-ore', '${oreType}', ${owned})">Jual Semua</button>
        </div>`;
    }).join('');

    const ingotRows = Object.keys(ingotSellPrice).map(oreType => {
      const owned = (state.ingotInventory && state.ingotInventory[oreType]) || 0;
      const ingotName = refineryRecipes[oreType]?.ingotName || oreType;
      return `
        <div class="market-row">
          <div class="market-dot" style="background:${ORE_COLORS[oreType]}44;">${ORE_EMOJI[oreType]}</div>
          <div class="market-info">
            <div class="market-name">${ingotName}</div>
            <div class="market-price">🪙 ${ingotSellPrice[oreType]} /unit</div>
            <div class="market-owned">Punya: ${formatAmount(owned)}</div>
          </div>
          <button class="market-sell-btn" ${owned < 1 ? 'disabled' : ''} onclick="sellAll('sell-ingot', '${oreType}', ${owned})">Jual Semua</button>
        </div>`;
    }).join('');

    el.innerHTML = `
      <div class="card">
        <div class="card-title">Jual Ore Mentah</div>
        <div class="card-sub">Harga lebih rendah — cepat tapi kurang untung dibanding diolah dulu.</div>
        ${oreRows}
      </div>
      <div class="card">
        <div class="card-title">Jual Ingot</div>
        <div class="card-sub">Hasil olahan Refinery, harga jual lebih tinggi.</div>
        ${ingotRows}
      </div>
      <div class="status-msg" id="marketStatusMsg"></div>
    `;
  }

  async function sellAll(action, oreType, quantity) {
    const statusEl = document.getElementById('marketStatusMsg');
    try {
      const data = await callTycoonApi(action, { oreType, quantity });
      gameData.state = data.state;
      gameData.oreCoins = data.oreCoins;
      updateOreCoinBadge();
      renderMarketTab();
      const msgEl = document.getElementById('marketStatusMsg');
      if (msgEl) {
        msgEl.textContent = `✅ Terjual! +${formatAmount(data.earned)} Ore Coin`;
        msgEl.style.color = '#00e5c0';
      }
    } catch (err) {
      if (statusEl) {
        statusEl.textContent = `❌ ${err.message}`;
        statusEl.style.color = '#ff6b6b';
      }
    }
  }
  window.sellAll = sellAll;

  // ══════════════════════════════════════════
  // CRAFT (SPACE PROGRAM) TAB
  // ══════════════════════════════════════════
  function renderCraftTab() {
    const el = document.getElementById('section-craft');
    const { planets } = gameData;
    const planetIds = Object.keys(planets).sort((a, b) => planets[a].order - planets[b].order);

    const tabs = planetIds.map(pid => `
      <button class="planet-tab ${pid === activePlanetId ? 'active' : ''}" onclick="switchPlanetTab('${pid}')">${planets[pid].name}</button>
    `).join('');

    el.innerHTML = `<div class="planet-tabs">${tabs}</div><div id="planetAssetArea"></div>`;
    renderPlanetAssets();
  }

  function switchPlanetTab(planetId) {
    activePlanetId = planetId;
    renderCraftTab();
  }
  window.switchPlanetTab = switchPlanetTab;

  function renderCostChips(cost, oreCoinCost) {
    const { state, oreCoins } = gameData;
    const ingotChips = Object.entries(cost).map(([ingotType, needed]) => {
      const owned = (state.ingotInventory && state.ingotInventory[ingotType]) || 0;
      const ok = owned >= needed;
      const ingotName = gameData.refineryRecipes[ingotType]?.ingotName || ingotType;
      return `<div class="cost-chip ${ok ? 'sufficient' : 'insufficient'}">${ingotName} ${formatAmount(owned)}/${needed}</div>`;
    }).join('');
    const coinOk = oreCoins >= oreCoinCost;
    const coinChip = `<div class="cost-chip ${coinOk ? 'sufficient' : 'insufficient'}">🪙 ${formatAmount(oreCoins)}/${formatAmount(oreCoinCost)}</div>`;
    return `<div class="cost-list">${ingotChips}${coinChip}</div>`;
  }

  function canAffordAsset(cost, oreCoinCost) {
    const { state, oreCoins } = gameData;
    if (oreCoins < oreCoinCost) return false;
    for (const [ingotType, needed] of Object.entries(cost)) {
      const owned = (state.ingotInventory && state.ingotInventory[ingotType]) || 0;
      if (owned < needed) return false;
    }
    return true;
  }

  function renderPlanetAssets() {
    const area = document.getElementById('planetAssetArea');
    const planet = gameData.planets[activePlanetId];
    const state = gameData.state;

    if (!state.spaceProgram) state.spaceProgram = {};
    const progress = state.spaceProgram[activePlanetId] || { satellite: false, rocket: false, vehicle: false, explored: 0 };

    const assetOrder = ['satellite', 'rocket', 'vehicle'];
    const assetIcons = { satellite: '🛰️', rocket: '🚀', vehicle: '🚙' };

    let html = '';

    assetOrder.forEach(assetType => {
      const def = planet[assetType];
      const done = progress[assetType];
      const requiresDone = !def.requires || progress[def.requires];
      const locked = !done && !requiresDone;

      let statusHtml;
      if (done) statusHtml = `<span class="asset-status done">✅ Selesai</span>`;
      else if (locked) statusHtml = `<span class="asset-status locked">🔒 Craft ${planet[def.requires].name} dulu</span>`;
      else statusHtml = `<span class="asset-status ready">Siap Di-craft</span>`;

      const canAfford = !done && !locked && canAffordAsset(def.cost, def.oreCoinCost);

      html += `
        <div class="card asset-card ${done ? 'done' : ''} ${locked ? 'locked' : ''}">
          ${statusHtml}
          <div class="card-title">${assetIcons[assetType]} ${def.name}</div>
          ${!done ? renderCostChips(def.cost, def.oreCoinCost) : ''}
          ${!done && !locked ? `
            <button class="action-btn" ${canAfford ? '' : 'disabled'} onclick="craftAsset('${assetType}')">
              ${canAfford ? 'Craft Sekarang' : 'Bahan/Ore Coin Tidak Cukup'}
            </button>` : ''}
        </div>`;
    });

    const allDone = progress.satellite && progress.rocket && progress.vehicle;
    html += `
      <div class="card explore-card">
        <div class="card-title">🔭 Explore ${planet.name}</div>
        <div class="card-sub">${allDone ? `Sudah di-explore ${progress.explored}x. Bisa diulang untuk dapat reward lagi.` : 'Selesaikan satelit, roket, dan kendaraan dulu untuk membuka eksplorasi.'}</div>
        <div class="explore-reward-row">
          ${Object.entries(planet.exploreRewards).map(([res, range]) => `<div class="explore-reward-chip">${RESOURCE_EMOJI[res] || '✨'} ${RESOURCE_LABELS[res] || res}: ${range.min}-${range.max}</div>`).join('')}
        </div>
        <button class="action-btn" ${allDone ? '' : 'disabled'} onclick="explorePlanet()">
          ${allDone ? (progress.explored > 0 ? 'Explore Again' : 'Explore Sekarang') : 'Selesaikan Craft Dulu'}
        </button>
        <div class="status-msg" id="exploreStatusMsg"></div>
      </div>
    `;

    area.innerHTML = html;
  }

  async function craftAsset(assetType) {
    try {
      const data = await callTycoonApi('craft-asset', { planetId: activePlanetId, assetType });
      gameData.state = data.state;
      gameData.oreCoins = data.oreCoinsLeft;
      updateOreCoinBadge();
      renderPlanetAssets();
    } catch (err) {
      alert(`Gagal craft: ${err.message}`);
    }
  }
  window.craftAsset = craftAsset;

  async function explorePlanet() {
    const statusEl = document.getElementById('exploreStatusMsg');
    try {
      const data = await callTycoonApi('explore-planet', { planetId: activePlanetId });
      gameData.state = data.state;
      renderPlanetAssets();
      const rewardText = Object.entries(data.rewards).map(([res, amt]) => `+${amt} ${RESOURCE_LABELS[res] || res}`).join(', ');
      const msgEl = document.getElementById('exploreStatusMsg');
      if (msgEl) {
        msgEl.textContent = `🎉 ${rewardText}`;
        msgEl.style.color = '#00e5c0';
      }
    } catch (err) {
      if (statusEl) {
        statusEl.textContent = `❌ ${err.message}`;
        statusEl.style.color = '#ff6b6b';
      }
    }
  }
  window.explorePlanet = explorePlanet;

  // ══════════════════════════════════════════
  // INIT
  // ══════════════════════════════════════════
  async function loadGameData() {
    try {
      const data = await callTycoonApi('get-state');
      gameData = data;
      updateOreCoinBadge();
      renderRefineryTab();
      renderMarketTab();
      renderCraftTab();
    } catch (err) {
      document.body.innerHTML = `<div class="loading-state">❌ ${err.message}</div>`;
    }
  }

  loadGameData();
</script>
</body>
</html>
